name: Desplegar panel a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Despliegue DIRECTO a Pages (source = GitHub Actions). No depende de una
# rama gh-pages ni de que GitHub reconstruya solo — publica el artefacto.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      # SOLO el sitio: antes se publicaba el repo ENTERO (path: "."), o sea también
      # supabase/functions (el motor completo), supabase/migrations (esquema, grants y —
      # hasta el 2026-09-17 — un secreto del scheduler), scripts y documentos internos.
      # Cualquier secreto que alguien deje en un archivo quedaba descargable al instante.
      - name: Armar el sitio (solo lo público)
        run: |
          mkdir -p _site
          cp -r panel assets _site/
          cp index.html privacidad.html logo.png _site/
          touch _site/.nojekyll
      - name: Subir artefacto (sitio estático, sin Jekyll)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
