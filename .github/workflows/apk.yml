# Arma el APK de Nodo (Android) en la nube. Se corre a mano (Actions → «APK de Nodo» → Run workflow)
# o solo cuando cambia algo de app-android/. La app web (panel/app) NO necesita un APK nuevo: se
# actualiza sola con cada push a main, porque el APK la carga desde GitHub Pages.
#
# Secretos (Settings → Secrets and variables → Actions), todos opcionales:
#   GOOGLE_SERVICES_JSON  → contenido de google-services.json de Firebase (activa los avisos con la app cerrada)
#   ANDROID_KEYSTORE_B64  → la llave de firma en base64 (sin ella sale un APK de prueba, que para actualizar
#   ANDROID_KEYSTORE_PASS    hay que desinstalar el anterior)
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASS
name: APK de Nodo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app-android/**", ".github/workflows/apk.yml"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Dependencias
        working-directory: app-android
        run: npm ci
      - name: Firebase (si está el secreto)
        env: { GSJ: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: |
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > app-android/android/app/google-services.json; echo "con Firebase"; else echo "sin Firebase: los avisos con la app cerrada quedan apagados"; fi
      - name: Llave de firma (si está el secreto)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/nodo.keystore"; echo "NODO_KEYSTORE=$RUNNER_TEMP/nodo.keystore" >> "$GITHUB_ENV"; echo "con firma propia"; else echo "sin llave: APK de prueba (firma de depuración)"; fi
      - name: Sincronizar Capacitor
        working-directory: app-android
        run: npx cap sync android 2>&1 | tee $RUNNER_TEMP/sync.log; test ${PIPESTATUS[0]} -eq 0 || { tail -25 $RUNNER_TEMP/sync.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Compilar
        working-directory: app-android/android
        env:
          NODO_VERSION_CODE: ${{ github.run_number }}
          NODO_VERSION_NAME: 1.0.${{ github.run_number }}
          NODO_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          NODO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NODO_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x gradlew
          # Si falla, las líneas del error salen como anotaciones (se ven sin iniciar sesión en GitHub)
          falla() { grep -E "error|What went wrong|FAILURE|e: |Could not|> " "$RUNNER_TEMP/gradle.log" | tail -30 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          if [ -n "$NODO_KEYSTORE" ]; then ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/gradle.log" 2>&1 || falla; cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Nodo-1.0.${{ github.run_number }}.apk"
          else ./gradlew --no-daemon assembleDebug > "$RUNNER_TEMP/gradle.log" 2>&1 || falla; cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Nodo-1.0.${{ github.run_number }}-prueba.apk"; fi
      # 📱 (3-nov) El APK firmado se publica en el link fijo de descarga del panel (⚙ → App para celular):
      # Storage público descargas/Nodo.apk + Nodo.json (versión, tamaño, fecha). Así quien la baje recibe siempre la
      # última. Necesita el secreto SUPABASE_SERVICE_ROLE_KEY (tools/secreto-apk-github.ps1); sin él, no se publica.
      - name: Publicar en el link de descarga
        if: ${{ env.NODO_KEYSTORE != '' }}
        env: { SRK: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" }
        run: |
          if [ -z "$SRK" ]; then echo "::warning::Sin SUPABASE_SERVICE_ROLE_KEY: el APK no se publicó en el link de descarga"; exit 0; fi
          APK="$RUNNER_TEMP/Nodo-1.0.${{ github.run_number }}.apk"
          B="https://ahoxdyffbwjlshmdezwi.supabase.co/storage/v1/object/descargas"
          curl -sSf -X POST "$B/Nodo.apk" -H "Authorization: Bearer $SRK" -H "apikey: $SRK" -H "x-upsert: true" \
            -H "cache-control: max-age=300" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK"
          printf '{"version":"1.0.%s","bytes":%s,"fecha":"%s"}' "${{ github.run_number }}" "$(stat -c%s "$APK")" "$(date -u +%FT%TZ)" > "$RUNNER_TEMP/Nodo.json"
          curl -sSf -X POST "$B/Nodo.json" -H "Authorization: Bearer $SRK" -H "apikey: $SRK" -H "x-upsert: true" \
            -H "cache-control: max-age=60" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/Nodo.json"
          echo "Publicado: Nodo.apk 1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Nodo-APK-1.0.${{ github.run_number }}
          path: ${{ runner.temp }}/Nodo-*.apk
          retention-days: 30
