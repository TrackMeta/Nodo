<!doctype html>
<html lang="es"><head><meta charset="utf-8" /><title>Nodo · Bot</title>
<!-- (14-nov-2026) La sección «Bot» ahora es UNA página: bot.html. Esta dirección vieja (negocio.html) lleva a la pestaña que
     corresponde, conservando lo demás de la dirección (p. ej. ?preguntas=1 de la campanita, ?armar=1). -->
<script>
(function(){
  var q = new URLSearchParams(location.search), t = q.get("tab"), ok = ["conocimiento","entrega","datos"];
  q.set("tab", ok.indexOf(t) >= 0 ? t : ok[0]);
  location.replace("bot.html?" + q.toString() + location.hash);
})();
</script></head><body></body></html>
