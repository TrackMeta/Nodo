<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nodo.theme")||"dark"}catch(e){}</script>
<title>Nodo · Respuestas rápidas</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
<link rel="stylesheet" href="shell.css" />
<style>
  :root{
    --bg:#0e1116; --surface:#151a21; --surface-2:#1b222c; --border:#232b36;
    --text:#e7ecf2; --muted:#8a97a8; --faint:#5c6675;
    --brand:#2b7fff; --brand-2:#1e6ff0; --brand-bg:#12233f;
    --green:#22c079; --green-bg:#10281d; --amber:#f0a92b; --amber-bg:#2c2311; --red:#e2564a; --red-bg:#2c1615;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .qcard{cursor:pointer;transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease}
  .qcard:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 8px 22px rgba(0,0,0,.28)}
  .qcard .c-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .qcard .c-dot{width:10px;height:10px;border-radius:50%;flex:none}
  .qcard .c-tt{font-size:15.5px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .atajo{font-size:11px;font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--brand-bg);color:var(--brand);padding:2px 8px;border-radius:6px;flex:none;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .qbody{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:56px;white-space:pre-wrap}
  .qbody.empty{color:var(--faint);font-style:italic}
  .c-media{display:flex;gap:5px;margin-top:9px;align-items:center}
  .c-th{width:38px;height:38px;border-radius:7px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:15px;overflow:hidden}
  /* `display:flex` SOLO en el placeholder (un <div> con ▶/🎤/icono). En un <img>
     rompe object-fit: la miniatura dejaba de recortarse y salía deformada, como un
     recuadro con la imagen estirada. La clase la comparten los dos. */
  div.c-th{display:flex;align-items:center;justify-content:center}
  .c-th svg{width:16px;height:16px}
  .c-more{font-size:11px;color:var(--faint);font-weight:600}
  .c-foot{margin-top:11px;display:flex;gap:8px;align-items:center}
  /* Buscador */
  .qsearch{position:relative;max-width:360px;margin-bottom:14px}
  .qsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none}
  .qsearch input{width:100%;height:40px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;color:var(--text);padding:0 12px 0 36px;font-size:13.5px;outline:none;font-family:var(--font)}
  .qsearch input:focus{border-color:var(--brand)}
  label{display:block;font-size:11.5px;color:var(--muted);margin:16px 0 6px;font-weight:700}
  .in,.ta{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 13px;font-size:13.5px;outline:none;font-family:var(--font)}
  .ta{min-height:140px;resize:vertical;line-height:1.55} .in:focus,.ta:focus{border-color:var(--brand)}
  .sel{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);height:42px;padding:0 12px;font-size:13.5px;outline:none;width:100%}
  .row{display:flex;gap:14px;flex-wrap:wrap} .row>.f{flex:1;min-width:160px}
  .dcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px;max-width:680px}
  .hint{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.55}
  .btn{height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .btn.primary{background:var(--brand);border:none;color:#fff}.btn.primary:hover{background:var(--brand-2)}
  .btn svg{width:15px;height:15px;flex:none}
  /* (10-oct) Eliminar: botón de verdad (antes el ícono medía 0 px y quedaba una palabra roja suelta) */
  .btn.danger{color:var(--muted);border-color:var(--border);background:var(--surface)}
  .btn.danger:hover{color:var(--red);border-color:var(--red)}
  /* (10-oct) editor más limpio */
  .qtitle{font-size:23px;font-weight:700;letter-spacing:-.4px;background:none;border:1px solid transparent;border-radius:10px;color:var(--text);padding:4px 8px;margin-left:-9px;font-family:inherit;outline:none;min-width:0;flex:1}
  .qtitle:hover{border-color:var(--border)} .qtitle:focus{border-color:var(--brand);background:var(--surface-2)}
  .atin{display:inline-flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;height:34px;padding:0 4px 0 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--muted)}
  .atin input{background:none;border:none;outline:none;color:var(--text);font:inherit;width:130px;padding:0 4px}
  .atin:focus-within{border-color:var(--brand)}
  .qsw2{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--border);flex:none}
  .qsw2.on{border-color:var(--text)}
  .qsw2.none{background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
  .bubtools{display:flex;gap:2px}
  .bubtools button{width:26px;height:26px;border-radius:7px;border:none;background:none;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;padding:0}
  .bubtools button:hover{background:var(--surface);color:var(--text)} .bubtools .qbDel:hover{color:var(--red)}
  .bubtools svg{width:14px;height:14px}
  .qdetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,260px);gap:20px;align-items:start}
  .qprevcol{position:sticky;top:16px}
  @media(max-width:820px){ .qdetail{grid-template-columns:1fr} .qprevcol{position:static;max-width:300px} }
</style>
</head>
<body>
<div class="nodo-page">
  <div class="nodo-wrap">
    <div id="gridView">
      <div class="nodo-head">
        <div class="grow">
          <h1 class="nodo-title">Respuestas rápidas</h1>
          <p class="nodo-lead">Mensajes listos para mandar con un clic desde la Bandeja. En el chat, escribe <b>/</b> para buscarlos.</p>
        </div>
        <div class="nodo-actions">
          <button class="nodo-btn primary" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Nueva respuesta</button>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
      <div class="qsearch" id="qsearchWrap" style="flex:1;min-width:200px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="qSearch" placeholder="Buscar por título, atajo o texto…" autocomplete="off"/>
      </div>
      <button class="nodo-btn" id="addFolderBtn" style="display:none;height:40px" title="Crear una carpeta para ordenar tus respuestas">+ Carpeta</button>
      </div>
      <div class="nodo-folders" id="folders"></div>
      <div class="nodo-cards" id="cards"></div>
    </div>
    <div id="detailView" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <button class="nodo-back" id="backBtn" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver a respuestas</button>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="del-btn" id="delBtn" title="Eliminar respuesta" aria-label="Eliminar respuesta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg></button>
          <button class="btn primary" id="saveBtn">Guardar</button>
        </div>
      </div>
      <div id="detail" style="margin-top:18px"></div>
    </div>
  </div>
</div>

<script type="module">
import { supa, mountShell, toast, icon, askText, confirmDialog, guardUnsaved } from "./shell.js";
import { mountFolders } from "./folder-bar.js";
import { waScreenHtml, waBubbles, seqBrand } from "./seq-editor.js?v=13";
let Fbar = null;
const $=(id)=>document.getElementById(id);
const st={ channelId:null, list:[], qr:null, folder:"__all", localFolders:new Set() };
function esc(s){return (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// Paleta para identificar cada respuesta con un color (como Etiquetas).
const PALETTE=["#2563EB","#16A34A","#CA8A04","#EA580C","#DC2626","#7C3AED"];
function qrColor(c){ return c && /^#[0-9a-f]{3,8}$/i.test(c) ? c : "#2b7fff"; }   // solo hex real: va a innerHTML
// Sube un archivo y lo agrega a st.qr.media (multimedia que se envía con la
// respuesta). Reusa la Edge Function media-upload.
function pickQrMedia(kind, onDone){
  const accept={image:"image/*",video:"video/*",audio:"audio/*",document:"*/*",file:"image/*,video/*,audio/*,application/pdf,*/*"}[kind]||"*/*";
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    if(kind==="file"){ const t=file.type||""; kind=t.startsWith("image/")?"image":t.startsWith("video/")?"video":t.startsWith("audio/")?"audio":"document"; }
    if(file.size>16*1024*1024){ toast("Archivo muy grande (máx 16 MB)",true); return; }
    toast("Subiendo…");
    try{
      const dataURL=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
      const { data,error }=await supa.functions.invoke("media-upload",{ body:{ channel_id:st.channelId, filename:file.name, content_type:file.type, data:dataURL } });
      if(error||!data?.url){ toast("No se pudo subir el archivo",true); return; }
      const m={ media_kind:data.kind||kind, media_url:data.url, mime:file.type, filename:file.name, caption:"" };
      toast("Archivo agregado"); if(onDone) onDone(m);
    }catch(e){ toast("Error al subir",true); }
  };
  inp.click();
}

async function boot(){
  const { data:{session} }=await supa.auth.getSession(); if(!session){ location.href="index.html"; return; }
  const shell=await mountShell({ active:"respuestas" });
  guardUnsaved(".nodo-page"); // avisa si sales con una respuesta a medio editar (igual que Productos)
  st.channelId=shell.channelId;
  shell.onChannel(id=>{ st.channelId=id; st.qr=null; showGrid(); load(); });
  $("addBtn").onclick=createQR;
  $("backBtn").onclick=()=>{ st.qr=null; showGrid(); };
  $("saveBtn").onclick=saveQR; $("delBtn").onclick=deleteQR;
  $("qSearch").oninput=renderCards;
  await load();
}
function showGrid(){ $("gridView").style.display=""; $("detailView").style.display="none"; }
function showDetail(){ $("gridView").style.display="none"; $("detailView").style.display=""; window.scrollTo(0,0); }

async function load(){
  const gen=(st.loadGen=(st.loadGen||0)+1), forChannel=st.channelId; // anti-carrera al cambiar de bot
  const { data }=await supa.from("quick_replies").select("*").eq("channel_id",forChannel).order("orden").order("created_at");
  if(gen!==st.loadGen) return;
  st.list=data||[];
  if(!Fbar){
    Fbar=await mountFolders({ el:$("folders"), tipo:"quick_reply", table:"quick_replies", channelId:st.channelId, items:()=>st.list, onChange:renderCards, labelAll:"Todas" });
  } else if(Fbar.channelId()!==st.channelId){ await Fbar.setChannel(st.channelId); }
  else { await Fbar.reload(); }
  renderCards();
}
function renderCards(){
  const box=$("cards");
  // El buscador solo tiene sentido si ya hay respuestas.
  const sw=$("qsearchWrap"); if(sw) sw.style.display=st.list.length?"":"none";
  // (10-oct) Carpetas solo cuando creaste alguna; mientras tanto «+ Carpeta» chico al lado del buscador.
  const hayCarp=!!(Fbar && Fbar.metas().length);
  { const fb=$("folders"), ab=$("addFolderBtn");
    if(fb) fb.style.display=(hayCarp && st.list.length)?"":"none";
    if(ab){ ab.style.display=(!hayCarp && st.list.length)?"":"none"; ab.onclick=()=>{ const nb=document.querySelector('#folders [data-act="new"]'); if(nb) nb.click(); }; } }
  if(!st.list.length){
    box.innerHTML=`<div class="nodo-empty" style="grid-column:1/-1"><div class="e-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></svg></div><h3>Aún no hay respuestas rápidas</h3><p>Crea mensajes predefinidos para responder al instante desde la Bandeja.</p></div>`;
    return;
  }
  let list=st.list;
  if(Fbar) list=Fbar.filter(list);
  const query=($("qSearch")?.value||"").trim().toLowerCase();
  if(query) list=list.filter(q=>`${q.titulo||""} ${q.atajo||""} ${q.cuerpo||""}`.toLowerCase().includes(query));
  if(!list.length){
    box.innerHTML=`<div class="nodo-empty" style="grid-column:1/-1"><p>${query?`Nada coincide con “${esc(query)}”.`:"Sin respuestas en esta carpeta."}</p></div>`;
    return;
  }
  box.innerHTML="";
  list.forEach(q=>{
    const el=document.createElement("div"); el.className="nodo-card qcard";
    const media=(Array.isArray(q.media)?q.media:[]).filter(m=>m&&m.media_url);
    const thumbs=media.length?`<div class="c-media">${media.slice(0,4).map(m=>
        m.media_kind==="image" ? `<img class="c-th" src="${esc(m.media_url)}" alt=""/>`
        : m.media_kind==="video" ? `<div class="c-th">▶</div>`
        : m.media_kind==="audio" ? `<div class="c-th">${icon("mic")}</div>`
        : `<div class="c-th">${icon("file")}</div>`
      ).join("")}${media.length>4?`<span class="c-more">+${media.length-4}</span>`:""}</div>`:"";
    const cuerpo=(q.cuerpo||"").trim();
    el.innerHTML=`
      <div class="c-top">${q.color?`<span class="c-dot" style="background:${qrColor(q.color)}"></span>`:''}<span class="c-tt">${esc(q.titulo)}</span>${q.atajo?`<span class="atajo">${esc(q.atajo)}</span>`:''}</div>
      <div class="qbody${cuerpo?'':' empty'}">${cuerpo?esc(cuerpo):"Sin mensaje todavía"}</div>
      ${thumbs}
      <div class="c-foot"><span data-cardfolder></span></div>`;
    const fslot=el.querySelector("[data-cardfolder]");
    if(fslot && Fbar && hayCarp){ const pk=Fbar.picker({ current:q.folder||null, onPick:async(v)=>{ const { error }=await supa.from("quick_replies").update({ folder:v }).eq("id",q.id); if(error){ toast(error.message,true); return; } q.folder=v; toast(v?`Movido a "${v}"`:"Quitado de la carpeta"); await Fbar.reload(); renderCards(); } }); pk.addEventListener("click",e=>e.stopPropagation()); fslot.appendChild(pk); }
    el.onclick=()=>openQR(q.id); box.appendChild(el);
  });
}
async function createQR(){
  const titulo=await askText({title:"Nueva respuesta rápida",label:"Título de la respuesta",placeholder:"Ej. Saludo, Precio, Datos de pago",confirmText:"Crear"}); if(!titulo) return;
  const folder=(Fbar&&Fbar.current!=="__all"&&Fbar.current!=="__none")?Fbar.current:null;
  const { data,error }=await supa.from("quick_replies").insert({ channel_id:st.channelId, titulo:titulo.trim(), cuerpo:"", folder, orden:st.list.length }).select("id").single();
  if(error){ toast(error.message,true); return; }
  await load(); openQR(data.id);
}
// Burbujas de la respuesta (modelo nuevo). Guardadas en la columna jsonb `media`
// como lista ordenada de {text} | {media_url,media_kind,caption,…}. Compat: una
// respuesta vieja (cuerpo + media sueltos) se convierte a [{text:cuerpo}, …media].
function qrBubbles(qr){
  const raw=Array.isArray(qr.media)?qr.media:[];
  const hasText=raw.some(b=> b && typeof b.text==="string" && !b.media_url);
  if(hasText) return raw.map(b=>({...b}));
  const bubs=[];
  if(qr.cuerpo && qr.cuerpo.trim()) bubs.push({text:qr.cuerpo});
  raw.forEach(m=>{ if(m&&m.media_url) bubs.push({...m}); });
  if(!bubs.length) bubs.push({text:""});
  return bubs;
}
async function openQR(id){
  const forChannel=st.channelId;   // anti-carrera: si cambiaste de bot mientras cargaba, no abre la del anterior
  const { data }=await supa.from("quick_replies").select("*").eq("id",id).maybeSingle();
  if(forChannel!==st.channelId || !data) return;
  st.qr=data; st.qr.bubbles=qrBubbles(data); renderDetail(); showDetail();
}
function renderDetail(){
  const q=st.qr; if(!q) return;
  $("detail").innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap">
      <input class="qtitle" id="q_titulo" value="${esc(q.titulo)}" placeholder="Título de la respuesta" title="Toca para cambiar el título"/>
    </div>
    <div class="qdetail">
    <div class="dcard" style="max-width:none">
      <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:var(--muted);font-weight:600">Atajo</span>
          <span class="atin">/<input id="q_atajo" value="${esc(String(q.atajo||'').replace(/^\/+/,''))}" placeholder="precio" autocomplete="off"/></span></div>
        <div style="display:flex;align-items:center;gap:7px"><span style="font-size:12px;color:var(--muted);font-weight:600">Color</span><span id="q_palette" style="display:flex;gap:6px;align-items:center"></span></div>
      </div>
      <label>Mensaje</label>
      <div class="hint" style="margin-top:0;margin-bottom:8px">Se envían en orden · <b>{{nombre}}</b> = nombre del cliente</div>
      <div id="q_bubbles"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
        <button class="btn qbAdd" data-k="text" style="height:34px">+ Texto</button>
        <button class="btn qbAdd" data-k="file" style="height:34px">+ Imagen o archivo</button>
      </div>
    </div>
    <div class="qprevcol">
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:7px;font-weight:700">Así le llega al cliente</div>
      <div id="q_prev"></div>
    </div>
    </div>`;
  // Paleta de color
  const cur=q.color||null;
  const pal=$("q_palette");
  // (10-oct) 6 puntitos + «sin color». Un color viejo fuera de la paleta se muestra como uno más (no se pierde).
  const cols=(cur && !PALETTE.includes(cur)) ? [...PALETTE, cur] : PALETTE;
  pal.innerHTML=`<span class="qsw2 none qClearC${cur?'':' on'}" title="Sin color">×</span>`
    + cols.map(c=>`<span class="qsw2 qsw${cur===c?' on':''}" data-c="${c}" style="background:${c}"></span>`).join("")
    + `<label class="qsw2 none" title="Otro color" style="position:relative;margin:0">+<input type="color" id="q_colorCustom" value="${qrColor(cur)}" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:none"/></label>`;
  // Título/atajo se preservan al re-renderizar por color; las burbujas ya se
  // actualizan en vivo (oninput), así que no hace falta cosecharlas.
  const harvest=()=>{ st.qr.titulo=$("q_titulo").value; st.qr.atajo=$("q_atajo").value?("/"+$("q_atajo").value.replace(/^\/+/,"")):""; };
  const setColor=(c)=>{ harvest(); q.color=c||null; renderDetail(); };
  pal.querySelectorAll(".qsw").forEach(s=> s.onclick=()=>setColor(s.dataset.c));
  pal.querySelector(".qClearC").onclick=()=>setColor(null);
  $("q_colorCustom").onchange=(e)=>setColor(e.target.value);   // «+» = cualquier color
  // el atajo siempre empieza con «/» (el «/» ya está dibujado: si lo escribes, se quita)
  $("q_atajo").oninput=(e)=>{ const v=e.target.value.replace(/^\/+/,"").replace(/\s+/g,""); if(v!==e.target.value) e.target.value=v; };
  // ── Vista previa en vivo tipo WhatsApp (misma pantalla que el resto del panel) ──
  // El envío de respuestas rápidas (index.html applyVars) SOLO resuelve {{nombre}}.
  // El preview debe reflejar exactamente eso: resolvemos {{nombre}} y dejamos cualquier
  // otra {{variable}} LITERAL (visible), para que el operador vea que no se sustituye
  // y no cree plantillas rotas creyendo que {{precio}} funciona aquí.
  const smpQr=(t)=>String(t||"").replace(/\{\{\s*nombre\s*\}\}/gi,"Ana");
  let _brand={};
  function paintPreview(){
    const box=$("q_prev"); if(!box) return;
    const bubbles=(st.qr.bubbles||[]).map(b=> b.media_url ? {media_url:b.media_url,media_kind:b.media_kind,caption:b.caption} : {text:b.text});
    box.innerHTML=waScreenHtml({ title:_brand.nombre, logoUrl:_brand.logo_url, bubblesHtml:waBubbles(bubbles,smpQr), empty:"Escribe el mensaje para ver cómo llega…" });
  }
  // ── Editor de BURBUJAS (texto / imagen-con-caption), como los otros editores ──
  function paintBubbles(){
    const box=$("q_bubbles"); if(!box) return; box.innerHTML="";
    const bubs=st.qr.bubbles=(st.qr.bubbles&&st.qr.bubbles.length)?st.qr.bubbles:[{text:""}];
    bubs.forEach((b,i)=>{
      const el=document.createElement("div"); el.dataset.bi=i;
      el.style.cssText="border:1px solid var(--border);border-radius:11px;padding:10px;margin-bottom:8px;background:var(--surface-2)";
      const kind=b.media_url?(b.media_kind||"document"):"text";
      let media="";
      if(kind==="image") media=`<img src="${esc(b.media_url)}" style="max-width:150px;max-height:110px;border-radius:8px;display:block;margin-bottom:8px"/>`;
      else if(kind==="video") media=`<video src="${esc(b.media_url)}" style="max-width:180px;max-height:120px;border-radius:8px;display:block;margin-bottom:8px" controls></video>`;
      else if(kind==="audio") media=`<audio src="${esc(b.media_url)}" style="height:34px;margin-bottom:8px;display:block" controls></audio>`;
      else if(b.media_url) media=`<div style="font-size:12.5px;margin-bottom:8px;display:flex;align-items:center;gap:5px">${icon("file")} ${esc(b.filename||"documento")}</div>`;
      const label=b.media_url?(kind.charAt(0).toUpperCase()+kind.slice(1)):"Texto";
      el.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
          <span style="font-size:11px;color:var(--muted);font-weight:600;flex:1">${label}</span>
          ${bubs.length>1?`<span class="bubtools">${i>0?`<button class="qbUp" title="Subir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>`:""}${i<bubs.length-1?`<button class="qbDown" title="Bajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>`:""}<button class="qbDel" title="Quitar">${icon("trash")}</button></span>`:(b.media_url?`<span class="bubtools"><button class="qbDel" title="Quitar">${icon("trash")}</button></span>`:"")}
        </div>${media}${b.media_url
          ? (kind!=="audio"?`<input class="in qbcap" placeholder="Texto sobre la imagen (opcional) — usa {{nombre}}" value="${esc(b.caption||"")}"/>`:"")
          : `<textarea class="ta qbtext" style="min-height:70px" placeholder="Escribe el mensaje… usa {{nombre}}">${esc(b.text||"")}</textarea>`}`;
      box.appendChild(el);
      const tx=el.querySelector(".qbtext"); if(tx) tx.oninput=e=>{ b.text=e.target.value; paintPreview(); };
      const cp=el.querySelector(".qbcap"); if(cp) cp.oninput=e=>{ b.caption=e.target.value; paintPreview(); };
      const _d=el.querySelector(".qbDel"), _u=el.querySelector(".qbUp"), _w=el.querySelector(".qbDown");
      if(_d) _d.onclick=()=>{ bubs.splice(i,1); if(!bubs.length) bubs.push({text:""}); paintBubbles(); paintPreview(); };
      if(_u) _u.onclick=()=>{ if(i===0)return; [bubs[i-1],bubs[i]]=[bubs[i],bubs[i-1]]; paintBubbles(); paintPreview(); };
      if(_w) _w.onclick=()=>{ if(i>=bubs.length-1)return; [bubs[i+1],bubs[i]]=[bubs[i],bubs[i+1]]; paintBubbles(); paintPreview(); };
    });
    paintPreview();
  }
  paintBubbles();
  document.querySelectorAll(".qbAdd").forEach(btn=> btn.onclick=()=>{
    const k=btn.dataset.k;
    if(k==="text"){ st.qr.bubbles.push({text:""}); paintBubbles(); }
    else pickQrMedia(k, (m)=>{ st.qr.bubbles.push(m); paintBubbles(); });
  });
  seqBrand(st.channelId).then(b=>{ _brand=b; paintPreview(); });
}
async function saveQR(){
  if(!st.qr) return;
  // Limpia burbujas vacías y persiste: las BURBUJAS van en `media` (jsonb), y
  // `cuerpo` = textos/captions unidos (para búsqueda y compat con la Bandeja vieja).
  const bubs=(st.qr.bubbles||[]).filter(b=> b.media_url || (b.text&&String(b.text).trim()));
  const cuerpo=bubs.map(b=> b.text||b.caption||"").filter(s=>s&&String(s).trim()).join("\n\n");
  const _at=$("q_atajo").value.trim().replace(/^\/+/,"");
  const patch={ titulo:$("q_titulo").value.trim(), atajo:_at?("/"+_at):null, folder:st.qr.folder||null, cuerpo, color:st.qr.color||null, media:bubs.length?bubs:null };
  if(!patch.titulo){ toast("El título no puede estar vacío",true); return; }
  // Atajo repetido: dos respuestas con «/precio» y cuál sale en la Bandeja dependía del orden
  // de la consulta. Se avisa antes de guardar.
  if(patch.atajo){ const a=patch.atajo.toLowerCase(); const otra=(st.list||[]).find(q=>q.id!==st.qr.id&&String(q.atajo||"").toLowerCase()===a); if(otra){ toast(`El atajo «${patch.atajo}» ya lo usa «${otra.titulo||"otra respuesta"}». Cámbialo para que no se confundan.`,true); return; } }
  let { error }=await supa.from("quick_replies").update(patch).eq("id",st.qr.id);
  if(error && /color|media|column/.test(error.message)){ const { color, media, ...base }=patch; ({ error }=await supa.from("quick_replies").update(base).eq("id",st.qr.id)); if(!error) toast("Guardado (aplica la migración 0028 para color/multimedia)"); }
  if(error){ toast(error.message,true); return; }
  toast("Guardado"); await load(); await openQR(st.qr.id);
}
async function deleteQR(){
  if(!st.qr) return;
  if(!await confirmDialog({title:"Eliminar respuesta",message:`¿Eliminar "${st.qr.titulo}"?`,confirmText:"Eliminar",danger:true})) return;
  { const { error:eDel }=await supa.from("quick_replies").delete().eq("id",st.qr.id); if(eDel){ toast(eDel.message,true); return; } } st.qr=null; toast("Eliminada"); showGrid(); await load();
}
boot();
</script>
