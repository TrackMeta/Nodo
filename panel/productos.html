// ── Acordeón del hub: cada fila despliega su sección inline (varias a la vez).
// Reusa las funciones de sección pasándoles el panel (.acc-body) como contenedor.
const ACC_RENDER={ producto:renderProducto, opciones:renderOpciones, entrega:renderEntrega,
  ia:renderProductoIA, activacion:renderActivacion, extras:renderExtras, remarketing:renderRemarketing,
  regalos:renderRegaloVenta, stock:renderStock };
function accToggle(wrap){
  if(!wrap) return;
  const t=wrap.dataset.t, body=wrap.querySelector(".acc-body");
  if(wrap.classList.contains("open")){ wrap.classList.remove("open"); return; } // oculta, conserva el DOM
  wrap.classList.add("open");
  // Render perezoso: se dibuja una sola vez; al reabrir se muestra el mismo DOM.
  if(body && !body.dataset.rendered){ const fn=ACC_RENDER[t]; if(fn){ fn(body); body.dataset.rendered="1"; } }
}
function accOpen(t){
  const wrap=document.querySelector('.acc[data-t="'+t+'"]'); if(!wrap) return;
  const d=wrap.closest("details"); if(d) d.open=true; // abre "Más opciones" si aplica
  if(!wrap.classList.contains("open")) accToggle(wrap);
  wrap.scrollIntoView({behavior:"smooth",block:"center"});
}
function accRerender(t){
  const wrap=document.querySelector('.acc[data-t="'+t+'"]');
  if(wrap && wrap.classList.contains("open")){ const fn=ACC_RENDER[t]; if(fn) fn(wrap.querySelector(".acc-body")); }
}
// "Cómo llegan los clientes" depende de flujos/triggers que viven en la BD; tras
// guardar hay que recargarlos para que la fila brille sin recargar la página.
async function refreshActivacionRow(){
  if(st.prod && st.receta){
    const { data:flows } = await supa.from("flows").select("id,nombre,role,estado").eq("product_id",st.prod.id);
    const fIni=(flows||[]).find(f=>f.role==="mensajes_iniciales");
    let trigs=[]; if(fIni){ const { data:tt } = await supa.from("flow_triggers").select("id,tipo,activo").eq("flow_id",fIni.id); trigs=tt||[]; }
    st.receta.flows=flows||[]; st.receta.fIni=fIni; st.receta.trigs=trigs; st.receta.fVenta=(flows||[]).find(f=>f.role==="venta");
  }
  if(st._refreshRow) st._refreshRow("activacion");
  if(st._refreshMeter) st._refreshMeter();
}

async function renderInicio(){
  const b=$("tabBody");
  b.innerHTML=`<div class="empty">Cargando…</div>`;
  const fisico=(st.prod.tipo||"digital")==="fisico";
  const esExtra=st.prod.clase==="extra";
  const esRegalo=st.prod.clase==="regalo";
  const c=st.prod.config||{};
  const { data:flows } = await supa.from("flows").select("id,nombre,role,estado").eq("product_id",st.prod.id);
  const fIni=(flows||[]).find(f=>f.role==="mensajes_iniciales");
  const fVenta=(flows||[]).find(f=>f.role==="venta");
  let trigs=[];
  if(fIni){ const { data:t } = await supa.from("flow_triggers").select("id,tipo,activo").eq("flow_id",fIni.id); trigs=t||[]; }
  const { data:ch } = await supa.from("channels").select("negocio,ocr_config,gsheets,entregas").eq("id",st.channelId).maybeSingle();
  st.receta={ flows:flows||[], fIni, fVenta, trigs, ch:ch||{} };

  // Estado por sección (para los puntitos y el X/Y de cada fase).
  const est=(t)=>{
    if(t==="producto"){
      if(esRegalo){
        if(fisico) return {ok:true,msg:"Listo · viaja en el paquete"};
        const ok=(st.versions||[]).some(v=>Array.isArray(v.entrega)&&v.entrega.some(it=>it&&String(it.url||"").trim()));
        return {ok,msg:ok?"Regalo y entrega listos":"Falta el link o archivo del regalo"};
      }
      if(fisico){ return {ok:true,msg:"Nombre, tallas y stock"}; }
      return {ok:true,msg:"Nombre y tipo listos"}; }
    if(t==="opciones"){
      if(esRegalo){ // un regalo no lleva precio: solo importa qué entrega
        if(fisico) return {ok:true,msg:"Viaja en el paquete del pedido"};
        const ok=(st.versions||[]).some(v=>Array.isArray(v.entrega)&&v.entrega.some(it=>it&&String(it.url||"").trim()));
        return {ok,msg:ok?"Entrega configurada":"Falta el link o archivo del regalo"};
      }
      const active=(st.versions||[]).filter(v=>v.activo!==false); const priced=active.filter(v=>Number(v.precio)>0); const prices=priced.map(v=>Number(v.precio));
      let msg; if(!priced.length) msg="Falta ponerle precio"; else if(active.length===1) msg=`S/ ${prices[0]} · 1 presentación`; else msg=`${active.length} presentaciones · desde S/ ${Math.min(...prices)}`;
      return {ok:priced.length>0,msg}; }
    if(t==="entrega"){ if(fisico) return {ok:true,msg:"Se despacha (hereda de Negocio)"}; const ok=(st.versions||[]).some(v=>Array.isArray(v.entrega)&&v.entrega.some(it=>it&&String(it.url||"").trim()))||!!(c.link_entrega&&String(c.link_entrega).trim()); return {ok,msg:ok?"Entrega configurada":"Falta el link o archivo"}; }
    if(t==="ia"){ const ok=!!(c.contexto_producto||(c.ia&&(c.ia.detalle||c.ia.resumen))); return {ok,msg:ok?"La IA sabe venderlo":"La IA aún no sabe venderlo"}; }
    if(t==="activacion"){ const ok=!!fIni && trigs.length>0; return {ok,msg:ok?"Palabra clave + mensajes listos":(fIni?"Faltan palabras clave":"Faltan mensajes iniciales")}; }
    if(t==="extras"){ const n=(c.extras||[]).length; return {ok:n>0,opt:true,msg:n>0?`${n} venta(s) extra`:"Sin ventas extra (opcional)"}; }
    if(t==="remarketing"){ const ok=!!c.remarketing_seq_id; return {ok,opt:true,msg:ok?"Secuencia enlazada":"Sin reenganche (opcional)"}; }
    if(t==="regalos"){ const n=(c.regalos||[]).length; return {ok:n>0,opt:true,msg:n>0?`${n} regalo(s)`:"Sin regalo (opcional)"}; }
    if(t==="flujos") return {ok:true,opt:true,msg:"Editor visual (avanzado)"};
    if(t==="stock"){ const s=(c.stock&&typeof c.stock==="object")?c.stock:{}; const ks=Object.keys(s); const tot=ks.reduce((a,k)=>a+(Number(s[k])||0),0); return {ok:ks.length>0,opt:true,msg:ks.length?`${tot} unidad(es) en stock`:"Sin stock cargado (opcional)"}; }
    return {ok:false,msg:""};
  };
  const IA_SPARK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/><path d="M12 4v4"/><circle cx="12" cy="4" r="1"/></svg>';
  const IC={ producto:icon("box"), opciones:icon("productos"), entrega:fisico?icon("truck"):icon("link"),
    ia:IA_SPARK, activacion:icon("activity"), extras:icon("dollar"), remarketing:icon("secuencias"), flujos:icon("flujos"), stock:icon("productos") };

  // ── Medidor "Listo para vender": de los pasos REQUERIDOS, cuántos están ok ──
  const req = esRegalo ? [] : (esExtra ? ["opciones","ia"]
    : (fisico ? ["producto","opciones","stock","ia","activacion"] : ["producto","opciones","entrega","ia","activacion"]));
  const pct = req.length ? Math.round(req.filter(t=>est(t).ok).length/req.length*100) : 100;
  // Degradado de la barra y del %: mismo tono que la sección IA (violeta→fucsia)
  // mientras avanza, verde al llegar al 100%.
  const grad = pct>=100 ? "linear-gradient(90deg,#22c079,#12b76a)" : "linear-gradient(90deg,var(--ia1,#a855f7),var(--ia2,#ec4899))";
  const gradGlow = pct>=100 ? "rgba(34,192,121,.45)" : "rgba(168,85,247,.45)";

  // ── Cabecera: emoji + nombre + tipo + medidor ──────────────────────
  const tipoTxt = esRegalo ? "Regalo · gratis" : esExtra ? (fisico?"Complemento físico":"Complemento digital")
    : fisico ? "Producto físico" : "Producto digital · entrega al instante";
  // Emoji editable (botón) + popup del selector (reusa wireEmojiPicker).
  const emojiBox = `<div style="position:relative;flex:none">
      <button id="emojiBtn" class="emoji-head" title="Cambiar emoji" style="width:52px;height:52px;border-radius:14px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.05),0 5px 12px -5px rgba(0,0,0,.16);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">${st.prod.emoji?esc(st.prod.emoji):"📦"}</button>
      <div id="emojiPop" style="display:none;position:absolute;z-index:30;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.35);width:300px;margin-top:6px"></div>
    </div>`;
  const PENCIL='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const badge = esRegalo?`<span class="pdet-xbadge" style="background:rgba(168,85,247,.14);color:#a855f7">🎁 Regalo · gratis</span>`:esExtra?`<span class="pdet-xbadge">Extra · complemento</span>`:"";
  const bannerTop = `<div style="display:flex;align-items:center;gap:14px;margin-bottom:${esRegalo?"0":"14px"}">
      ${emojiBox}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:22px;font-weight:800;letter-spacing:-.3px"><span id="hdrName" class="hdr-name" title="Clic para renombrar">${esc(st.prod.nombre||"Producto")}</span><span id="hdrEdit" title="Renombrar" style="cursor:pointer;color:var(--faint);display:inline-flex">${PENCIL}</span>${badge}</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:2px">${tipoTxt}</div>
      </div>
      ${esRegalo?"":`<div style="text-align:right;flex:none"><div style="font-size:12px;color:var(--muted);font-weight:600">Listo para vender</div><div id="hubPct" style="font-size:28px;font-weight:800;background:${grad};-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15">${pct}%</div></div>`}
    </div>`;
  const headCard = esRegalo
    ? `<div style="margin-bottom:16px">${bannerTop}</div>`
    : `<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px">
        ${bannerTop}
        <div style="height:10px;border-radius:20px;background:var(--surface-2);overflow:hidden;margin:4px 0 2px;border:1px solid var(--border)"><div id="hubBar" style="width:${pct}%;height:100%;background:${grad};box-shadow:0 0 12px -1px ${gradGlow};border-radius:20px;transition:width .45s ease,background .3s ease"></div></div>
      </div>`;

  // "¿Lo armo por ti?" vive en el FAB flotante de abajo a la derecha (armFab),
  // no como tarjeta en el hub (decisión de Rodrigo).

  // ── Filas del hub ──────────────────────────────────────────────────
  const rowHtml=(t,o)=>{ const e=est(t); const isOk=o.ok!==undefined?o.ok:e.ok;
    // Completada = brilla en el color de SU grupo (verde/IA/dorado) + ícono del
    // mismo color. Pendiente = todo neutro/gris (solo lo completado resalta).
    const tone=o.tone||'green';
    const TONE_ICO={ green:"background:rgba(34,192,121,.16);border-color:transparent;color:#22c079",
      ia:"background:rgba(168,85,247,.16);border-color:transparent;color:var(--ia1,#a855f7)",
      gold:"background:rgba(230,168,20,.20);border-color:transparent;color:#c88a04" };
    const icoStyle=isOk?`style="${TONE_ICO[tone]||TONE_ICO.green}"`:'';
    const subStyle=(!isOk&&o.warn)?'color:var(--muted);font-weight:600':'color:var(--muted)';
    const optTag=o.opt?` <span style="font-size:11px;color:var(--faint);font-weight:600">· opcional</span>`:'';
    const cls=isOk?' ok-'+tone:'';
    return `<div class="acc" data-t="${t}">
      <button class="ini-item acc-hd${cls}" type="button">
        <span class="ini-ico ${isOk?'done':''}" ${icoStyle}>${o.ico||IC[t]||''}</span>
        <span class="ini-item-nm">${o.label}${optTag}</span>
        <span class="ini-item-msg" style="${subStyle}">${o.sub||''}</span>
        <span class="ini-chev">›</span></button>
      <div class="acc-body"></div>
    </div>`; };
  const group=(title,rows)=>`<div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 6px 9px">${title}</div><div class="ini-ph" style="padding:6px"><div class="ini-items">${rows.join("")}</div></div>`;

  // Subtítulos con el dato REAL del producto
  const emo = st.prod.emoji?esc(st.prod.emoji)+" ":"";
  const active=(st.versions||[]).filter(v=>v.activo!==false);
  const priced=active.filter(v=>Number(v.precio)>0); const prices=priced.map(v=>Number(v.precio));
  const costo=Number(c.costo)||0;
  let precioSub, precioWarn=false;
  if(!priced.length){ precioSub="Falta ponerle precio"; precioWarn=true; }
  else if(active.length===1){ precioSub=`S/ ${prices[0]} · 1 presentación`; if(costo>0&&prices[0]>costo) precioSub+=` · ganas S/ ${Math.round(prices[0]-costo)}`; }
  else precioSub=`${active.length} presentaciones · desde S/ ${Math.min(...prices)}`;
  const sStock=(c.stock&&typeof c.stock==="object")?c.stock:{}; const totStock=Object.keys(sStock).reduce((a,k)=>a+(Number(sStock[k])||0),0);
  const atrs=(c.atributos||[]).length;
  const stockSub = (atrs||totStock) ? `${atrs?atrs+" variante(s) · ":""}${totStock} unidad(es) en stock` : "Sin variantes · agrega cuántas tienes";

  // Digital: "producto" ya no es identidad (eso va en el encabezado) — es solo
  // "Detalles a preguntar" (datos que la IA pide antes de cerrar). Opcional.
  const qEs = rowHtml("producto",{label:"Detalles a preguntar",sub:(c.atributos||[]).length?`${(c.atributos||[]).length} dato(s) que la IA pide`:"Datos que la IA pide antes de cerrar (opcional)",ico:icon("edit"),opt:true,ok:(c.atributos||[]).length>0});
  const qCuesta = rowHtml("opciones",{label:"¿Cuánto cuesta?",sub:precioSub,warn:precioWarn,ico:icon("dollar")});
  const qVar = fisico
    ? rowHtml("producto",{label:"Variantes y stock",sub:stockSub,ico:icon("productos"),opt:true,ok:(atrs>0||totStock>0)})
    : rowHtml("entrega",{label:"¿Cómo se entrega?",sub:est("entrega").ok?"Entrega configurada":"Falta el link o archivo",warn:!est("entrega").ok});
  const rIA = rowHtml("ia",{label:"La IA sabe venderlo",sub:est("ia").ok?"La IA ya sabe venderlo":"Falta describir tu producto",warn:!est("ia").ok,tone:"ia"});
  const rAct = rowHtml("activacion",{label:"Cómo llegan los clientes",sub:est("activacion").ok?"Palabra clave + mensajes listos":"Falta una palabra clave",warn:!est("activacion").ok,tone:"ia"});

  // Poner a vender
  const sellTxt = pct>=100 ? "Todo listo — genera el flujo y tu bot empieza a vender." : "Genera el flujo de venta con IA: vende, toma los datos conversando y crea el pedido.";
  const sellCard = `<div class="card sell-card" style="margin-bottom:0">
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">${sellTxt}</div>
      <div id="saludBox"></div>
      <button class="btn primary" id="genFlow" style="height:46px;font-size:14px;width:100%;margin-top:12px">${fVenta?"Regenerar flujo de venta":"Poner a vender"}</button>
      ${fVenta && fVenta.estado!=="activo" ? `
        <div style="margin-top:10px;border:1px solid var(--red,#e2564a);background:rgba(226,86,74,.08);border-radius:11px;padding:10px 12px;font-size:12.5px;line-height:1.5">
          <b style="color:var(--red,#e2564a)">En pausa: no vende.</b> Manda el saludo y se queda callado.
          <div style="margin-top:8px"><button class="btn" id="activarVenta" style="height:32px">Poner a vender</button></div>
        </div>` : (fVenta?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px">
          <span style="font-size:12.5px;color:var(--green,#22c079);font-weight:600">● Activo — ya vende.</span>
          <button class="btn" id="pausarVenta" style="height:30px;padding:0 12px;font-size:12.5px">Pausar</button>
        </div>`:"")}
    </div>`;

  // Más opciones (colapsable): ventas extra, remarketing, flujos
  const mas = `<details style="margin-top:16px">
      <summary style="cursor:pointer;list-style:none;font-size:12.5px;font-weight:700;color:var(--muted);padding:8px 4px">＋ Más opciones <span style="color:var(--faint);font-weight:400">· regalo, ventas extra, reenganche</span></summary>
      <div class="ini-ph" style="padding:6px;margin-top:6px"><div class="ini-items">
        ${rowHtml("regalos",{label:"Regalo con la compra",sub:est("regalos").msg,opt:true,tone:"gold",ico:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>'})}
        ${rowHtml("extras",{label:"Ventas extra",sub:est("extras").msg,opt:true,tone:"gold"})}
        ${rowHtml("remarketing",{label:"Reenganche",sub:est("remarketing").msg,opt:true,tone:"gold"})}
      </div></div>
    </details>`;

  // ── Ensamblado por clase ───────────────────────────────────────────
  if(esRegalo){
    b.innerHTML=`${headCard}
      ${group("El regalo",[
        rowHtml("producto",{label:"El regalo",sub:fisico?`${emo}${esc(st.prod.nombre||"regalo")} · físico`:(est("producto").ok?"Entrega lista":"Falta el link o archivo"),ico:IC.producto,warn:!fisico&&!est("producto").ok,ok:fisico||est("producto").ok})
      ])}
      <div class="card" style="border-color:rgba(168,85,247,.4);margin-top:14px">
        <h4 style="margin-top:0">🎁 Esto es un regalo</h4>
        <div style="font-size:13px;color:var(--muted);line-height:1.6">No se vende ni tiene flujo propio: se <b>regala gratis al comprar un producto principal</b>. Ve a ese principal → pestaña <b>Ventas extra</b> → <b>Regalo con la compra</b> y elígelo ahí. ${fisico?"Como es físico, viaja en el mismo paquete del pedido.":"Como es digital, configura arriba el link o archivo que se entrega."}</div>
      </div>`;
  } else if(esExtra){
    b.innerHTML=`${headCard}
      ${group("Tu producto",fisico?[qCuesta,qVar]:[qCuesta,qVar,qEs])}
      ${group("Tu venta",[rIA])}
      <div class="card" style="border-color:var(--brand-border);margin-top:14px">
        <h4 style="margin-top:0">Este es un complemento</h4>
        <div style="font-size:13px;color:var(--muted);line-height:1.6">No se vende solo: se ofrece <b>enganchado a un producto principal</b> (en la pestaña <b>Ventas extra</b> de ese principal). No necesita su propio flujo — con completar lo de arriba basta.</div>
      </div>`;
  } else {
    b.innerHTML=`${headCard}
      ${group("Tu producto",fisico?[qCuesta,qVar]:[qCuesta,qVar,qEs])}
      ${group("Tu venta",[rIA,rAct])}
      ${mas}
      <div style="margin-top:18px">${sellCard}</div>`;
  }

  const hb=$("armHeroBtn"); if(hb) hb.onclick=armOpen;
  b.querySelectorAll(".acc-hd").forEach(hd=> hd.onclick=()=>accToggle(hd.closest(".acc")));
  // Encabezado: emoji (selector) + nombre editable inline.
  wireEmojiPicker();
  const startNameEdit=()=>{
    const nm=$("hdrName"); if(!nm) return;
    const cur=st.prod.nombre||"";
    const inp=document.createElement("input");
    inp.value=cur; inp.className="in";
    inp.style.cssText="font-size:20px;font-weight:800;padding:3px 9px;width:min(360px,60vw)";
    const pen=$("hdrEdit"); if(pen) pen.style.display="none";
    nm.replaceWith(inp); inp.focus(); inp.select();
    let done=false;
    const commit=(save)=>{ if(done) return; done=true; if(save) st.prod.nombre=inp.value.trim()||cur; renderDetail(); };
    inp.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); commit(true); } else if(e.key==="Escape"){ e.preventDefault(); commit(false); } };
    inp.onblur=()=>commit(true);
  };
  const nmEl=$("hdrName"); if(nmEl) nmEl.onclick=startNameEdit;
  const penEl=$("hdrEdit"); if(penEl) penEl.onclick=startNameEdit;

  // ── Brillo EN VIVO de las filas: al editar dentro de una sección, su fila
  // se actualiza (verde/IA/dorado) sin redibujar el hub ni recargar la página.
  const TONE_ICO_R={ green:"background:rgba(34,192,121,.16);border-color:transparent;color:#22c079",
    ia:"background:rgba(168,85,247,.16);border-color:transparent;color:var(--ia1,#a855f7)",
    gold:"background:rgba(230,168,20,.20);border-color:transparent;color:#c88a04" };
  const recompRow=(t)=>{
    if(t==="opciones"){ const a=(st.versions||[]).filter(v=>v.activo!==false); const pr=a.filter(v=>Number(v.precio)>0); const prc=pr.map(v=>Number(v.precio)); const co=Number(c.costo)||0;
      let s,w=false; if(!pr.length){ s="Falta ponerle precio"; w=true; } else if(a.length===1){ s=`S/ ${prc[0]} · 1 presentación`; if(co>0&&prc[0]>co) s+=` · ganas S/ ${Math.round(prc[0]-co)}`; } else s=`${a.length} presentaciones · desde S/ ${Math.min(...prc)}`;
      return { ok:pr.length>0, tone:"green", sub:s, warn:w }; }
    if(t==="producto"){ if(!fisico) return null; const sk=(c.stock&&typeof c.stock==="object")?c.stock:{}; const tot=Object.keys(sk).reduce((x,k)=>x+(Number(sk[k])||0),0); const at=(c.atributos||[]).length;
      return { ok:(at>0||tot>0), tone:"green", sub:(at||tot)?`${at?at+" variante(s) · ":""}${tot} unidad(es) en stock`:"Sin variantes · agrega cuántas tienes" }; }
    if(t==="ia"){ return { ok:est("ia").ok, tone:"ia", sub:est("ia").ok?"La IA ya sabe venderlo":"Falta describir tu producto", warn:!est("ia").ok }; }
    if(t==="activacion"){ return { ok:est("activacion").ok, tone:"ia", sub:est("activacion").ok?"Palabra clave + mensajes listos":"Falta una palabra clave", warn:!est("activacion").ok }; }
    if(t==="entrega"){ return { ok:est("entrega").ok, tone:"green", sub:est("entrega").ok?"Entrega configurada":"Falta el link o archivo", warn:!est("entrega").ok }; }
    if(t==="extras"){ return { ok:est("extras").ok, tone:"gold", sub:est("extras").msg }; }
    if(t==="remarketing"){ return { ok:est("remarketing").ok, tone:"gold", sub:est("remarketing").msg }; }
    if(t==="regalos"){ return { ok:est("regalos").ok, tone:"gold", sub:est("regalos").msg }; }
    return null;
  };
  const applyRow=(t)=>{
    const wrap=b.querySelector('.acc[data-t="'+t+'"]'); if(!wrap) return;
    const r=recompRow(t); if(!r) return;
    const hd=wrap.querySelector('.acc-hd'), ico=hd.querySelector('.ini-ico'), msg=hd.querySelector('.ini-item-msg');
    hd.classList.remove('ok-green','ok-ia','ok-gold'); if(r.ok) hd.classList.add('ok-'+r.tone);
    if(ico){ ico.className='ini-ico'+(r.ok?' done':''); ico.setAttribute('style', r.ok?TONE_ICO_R[r.tone]:''); }
    if(msg){ msg.textContent=r.sub||''; msg.setAttribute('style', (!r.ok&&r.warn)?'color:var(--muted);font-weight:600':'color:var(--muted)'); }
  };
  st._refreshRow=applyRow;
  // Medidor "Listo para vender" en vivo (barra + %): recalcula desde los mismos
  // pasos requeridos y actualiza la barra/número sin redibujar el hub.
  const refreshMeter=()=>{
    if(!req.length) return;
    const p=Math.round(req.filter(t=>est(t).ok).length/req.length*100);
    const g=p>=100?"linear-gradient(90deg,#22c079,#12b76a)":"linear-gradient(90deg,var(--ia1,#a855f7),var(--ia2,#ec4899))";
    const gl=p>=100?"rgba(34,192,121,.45)":"rgba(168,85,247,.45)";
    const bar=$("hubBar"); if(bar){ bar.style.width=p+"%"; bar.style.background=g; bar.style.boxShadow="0 0 12px -1px "+gl; }
    const pe=$("hubPct"); if(pe){ pe.textContent=p+"%"; pe.style.background=g; pe.style.webkitBackgroundClip="text"; pe.style.backgroundClip="text"; pe.style.webkitTextFillColor="transparent"; }
  };
  st._refreshMeter=refreshMeter;
  const onEdit=(ev)=>{ const acc=ev.target.closest&&ev.target.closest('.acc-body')&&ev.target.closest('.acc'); if(acc){ applyRow(acc.dataset.t); refreshMeter(); } };
  b.addEventListener('input', onEdit);
  b.addEventListener('change', onEdit);

  if(!esExtra && !esRegalo){
    renderSalud(pct>=100);
    const g=$("genFlow"); if(g) g.onclick=generarFlujoVenta;
    const av=$("activarVenta");
    if(av) av.onclick=async(e)=>{
      e.target.disabled=true;
      const { error }=await supa.from("flows").update({ estado:"activo" }).eq("id",st.receta.fVenta.id);
      if(error){ toast(error.message,true); e.target.disabled=false; return; }
      toast("Puesto a vender ✓ · el producto ya vende"); st.tab="inicio"; renderDetail();
    };
    const pv=$("pausarVenta");
    if(pv) pv.onclick=async(e)=>{
      if(!await confirmDialog({title:"Pausar producto",message:`¿Pausar "${esc(st.prod.nombre)}"? El bot dejará de venderlo (sigue saludando). Lo reactivas cuando quieras.`,confirmText:"Pausar"})) return;
      e.target.disabled=true;
      const { error }=await supa.from("flows").update({ estado:"borrador" }).eq("id",st.receta.fVenta.id);
      if(error){ toast(error.message,true); e.target.disabled=false; return; }
      toast("Producto pausado ✓ · ya no vende"); st.tab="inicio"; renderDetail();
    };
  }
}

// Salud del producto: lo que impediría vender bien. Se avisa ACÁ, antes de
// publicar — no con un cliente a medio comprar.
function renderSalud(ready){
  const box=$("saludBox"); if(!box) return;
  const fisico=(st.prod.tipo||"digital")==="fisico";
  const ops=st.versions.filter(v=>v.activo!==false);
  const conPrecio=ops.filter(v=>v.precio!=null&&v.precio!=="");
  const errs=[], warns=[];
  if(!ops.length) errs.push("El producto no tiene ninguna presentación activa.");
  if(!conPrecio.length) errs.push("Ninguna presentación tiene precio: el validador no puede saber cuánto debe pagar el cliente.");
  if(!fisico){
    // Cuenta solo los items con URL: una fila de entrega vacía no entrega nada.
    const sinEntrega=conPrecio.filter(v=>!(Array.isArray(v.entrega)&&v.entrega.some(it=>it&&String(it.url||"").trim())));
    if(sinEntrega.length) errs.push(`Con precio pero sin entrega: ${sinEntrega.map(v=>`"${v.nombre||"—"}"`).join(", ")}. El cliente pagaría y no recibiría nada.`);
  }
  // Físico sin adelanto resoluble: el flujo de provincia manda "confírmalo con
  // un adelanto de *S/ *" — con el monto en blanco. Se ve roto y nadie paga.
  if(fisico){
    const ov=st.prod.config?.adelanto_override;
    const propio=(ov!=null&&String(ov).trim()!=="");
    const viejo=st.prod.config?.envio?.agencias?.shalom?.adelanto_valor;
    const def=st.receta?.ch?.entregas?.adelanto_default;
    const hay = propio || (viejo!=null&&String(viejo).trim()!=="") || (def!=null&&String(def).trim()!=="");
    if(!hay) errs.push("Sin adelanto: el pedido a provincia le pediría <b>“un adelanto de S/ ”</b> con el monto en blanco. Ponlo en Negocio → Entrega, o solo para este producto en su pestaña Entrega.");
  }
  // OJO: "sin palabra clave / sin mensajes iniciales / sin conocimiento" ya se
  // ven como filas naranjas del hub (Tu venta) → no repetir acá. Solo lo que NO
  // se muestra en otro lado: métodos de pago para el validador de comprobantes.
  const metodos=(st.receta?.ch?.ocr_config?.metodos||[]).filter(m=>m&&(m.app||m.numero||m.titular));
  if(!metodos.length) warns.push("El validador de comprobantes no tiene métodos de pago: la IA no podrá verificar a quién le pagaron.");
  const line=(t,c,ic)=>`<div style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.55;margin-bottom:5px">
    <span style="color:${c};display:inline-flex;flex:none">${icon(ic)}</span><div>${t}</div></div>`;
  box.innerHTML = (errs.length||warns.length)
    ? `<div style="border:1px solid ${errs.length?"var(--red)":"#f0a92b"};background:${errs.length?"rgba(239,68,68,.06)":"rgba(240,169,43,.07)"};border-radius:11px;padding:12px">
        <div style="font-weight:700;font-size:12.5px;margin-bottom:7px">${errs.length?"Esto impide vender":"Revisa esto antes de publicar"}</div>
        ${errs.map(e=>line(e,"var(--red)","alert")).join("")}${warns.map(w=>line(w,"#f0a92b","alert")).join("")}
      </div>`
    : (ready?`<div style="display:flex;gap:8px;align-items:center;font-size:12.5px;color:#22c079">
        <span style="display:inline-flex">${icon("check")}</span> Todo listo para vender.</div>`:"");
}

// Genera el flujo de venta DIGITAL desde la receta. Forma del flujo (IA-first,
// que es como Rodrigo vende de verdad — los esqueletos viejos eran guiones
// rígidos con botones):
//
//   [IA vende] → [espera] → ¿mandó imagen?
//                             ├─ sí → [OCR valida] → ¿pago OK?
//                             │                       ├─ sí → [entregar] → [fin]
//                             │                       └─ no → [pedir de nuevo] → [espera]
//                             └─ no → [IA vende]  (bucle: sigue conversando)
//
// El bucle hace que la IA atienda dudas indefinidamente y que el comprobante se
// detecte en cualquier momento (requisitos 3 y 4).
// Genera el flujo de venta de un producto FÍSICO. A diferencia del digital
// (paga → entrega → fin), este termina cuando se CREA EL PEDIDO: despachar,
// mandar la guía, cobrar el saldo y soltar la clave no los hace el flujo, los
// hace Rodrigo con el Copiloto y el Kanban ("no todo puede ser automatizado").
//
//   [IA vende] ← sabe la zona y pesca datos mientras conversa
//        ↓
//   [escucha] → ¿mandó comprobante?
//     ├─ sí → [valida el adelanto] → ok → [pedido: adelanto validado] → fin
//     │                            └→ [pide de nuevo] → escucha
//     └─ no → ¿de dónde es?
//              ├─ Lima      → ¿datos completos? → [crea pedido CONFIRMADO] → fin
//              └─ Provincia → ¿datos completos? → [crea pedido ESPERANDO ADELANTO]
//                                                  → [le pide el adelanto] → escucha
//
// Las guardas de "¿ya tiene pedido?" usan campo_igual contra "" porque el motor
// no tiene un operador "campo no existe"; sin ellas el bucle crearía un pedido
// nuevo por cada mensaje.
async function generarFlujoFisico(flowId, N, E){
  const cfg=st.prod.config||{};
  // OJO con las claves:
  //  · `nombre` NO se puede usar: ctx.nombre ya trae el nombre de WhatsApp del
  //    contacto, así que el extractor creería que ya lo tiene y nunca lo
  //    pediría. A la agencia le llegaría el apodo de WhatsApp y no entregan.
  //  · `sede` lleva validar:"sede" (verificación por CÓDIGO de que no sea la
  //    ciudad). Decírselo en el detalle no alcanza: aun con "NO la ciudad" en
  //    mayúsculas, ante "soy de Trujillo" devuelve sede="trujillo", y como
  //    después no se pisa lo capturado, la sede real se perdía.
  const campos=[
    { clave:"nombre_completo", label:"Nombre y apellido del que recibe", requerido:true },
    { clave:"direccion", label:"Dirección exacta", detalle:"calle y número, o dónde entregar aunque sea impreciso", requerido:true, solo_si_zona:"lima" },
    { clave:"referencia", label:"Referencia", detalle:"algo cerca para ubicarlo", requerido:false, solo_si_zona:"lima" },
    { clave:"dni", label:"DNI", detalle:"8 dígitos, se lo pide la agencia", requerido:true, validar:"dni", solo_si_zona:"provincia" },
    { clave:"sede", label:"Sede de la agencia", detalle:"la oficina EXACTA donde lo va a recoger (ej. «Av. España»), NO la ciudad", requerido:true, validar:"sede", solo_si_zona:"provincia" },
    // Teléfono: SOLO se le pide al cliente que llegó por "nombre de usuario" de
    // WhatsApp y no compartió su número (sin_numero=si). Al que tiene número no se
    // le molesta (ya lo tenemos). El courier necesita SÍ o SÍ un celular para
    // coordinar la entrega. Ver migración 0062 / {{sin_numero}}.
    { clave:"telefono", label:"Número de celular para la entrega", detalle:"9 dígitos; el courier lo llama para coordinar el envío", requerido:true, solo_si_sin_numero:true },
    // VA ÚLTIMO y solo en LIMA: tener los datos NO es lo mismo que querer
    // comprar. En Lima el pedido nace "confirmado" y sale un motorizado, así que
    // un mensaje de consulta bien completo ("¿tienen talla 38? soy Juan Pérez,
    // Av. Larco 100, Miraflores") despachaba un pedido que nadie pidió, y el
    // flete lo pagabas tú. En provincia no hace falta: ahí nada se mueve hasta
    // que pague el adelanto.
    { clave:"confirmo", label:"Confirmación de la compra", requerido:true, solo_si_zona:"lima",
      detalle:"pon «si» SOLO si el cliente dijo claramente que quiere comprarlo o que confirma el pedido " +
              "(«sí, lo quiero», «confirmo», «mándamelo», «ya, envíalo»). " +
              "Preguntar el precio, la talla, si hay stock o si llegan a su zona NO es confirmar: en ese caso OMITE este dato." },
  ];
  // Igual que en el digital: se ESCUCHA primero. A este flujo se llega después
  // de los mensajes iniciales; arrancar vendiendo sería hablar encima del saludo.
  const nVender=await N("ia","La IA vende y toma datos",{
    operacion:"generar_texto", enviar:true, usar_conocimiento:true,
    detectar_opcion:true, detectar_zona:true, campos,
    prompt:"Eres un vendedor experto por WhatsApp: cálido, seguro y orientado a CERRAR (sin ser pesado). "+
           "Continúa la conversación de forma natural: responde dudas, explica el valor y guía a la compra.\n"+
           "CÓMO VENDER (aplícalo con tacto, la venta manda):\n"+
           "· Habla en BENEFICIOS, no en características ('no te van a doler los pies' > 'suela de EVA').\n"+
           "· Ante una objeción ('está caro', 'lo pienso', 'no confío', '¿es original?'), NO te rindas ni discutas: reconoce, rebate con valor/garantía/prueba y reencamina al cierre. Si el producto tiene una sección de objeciones o FAQ, úsala.\n"+
           "· CIERRE ASUMIDO: en vez de '¿lo quieres?', avanza dando por hecha la compra ('¿te lo mando hoy o mañana?', '¿a qué dirección te lo despacho?').\n"+
           "· UNA sola cosa a la vez: un mensaje corto, una pregunta. Nada de listas largas ni interrogatorios.\n"+
           "· Usa la prueba social, la urgencia real (stock, regalo, envío incluido) y la multimedia SOLO si el conocimiento del producto te la dio. NUNCA inventes datos, precios, reseñas ni escasez.\n"+
           "Pregúntale a dónde se lo enviamos para saber cómo despacharlo. Pide los datos que falten de a uno, "+
           "sin sonar a formulario. No prometas fechas ni coberturas que el sistema no te haya confirmado.\n"+
           // El adelanto lo fija el negocio y lo pide un mensaje FIJO del flujo,
           // con el monto exacto. Sin esto la IA preguntaba "¿con cuánto te
           // gustaría hacer el adelanto?" y el mensaje siguiente decía "de S/ 20":
           // se contradecía sola y el cliente podía pagar de menos.
           // OJO con la ZONA: el adelanto es SOLO de provincia. Una primera
           // versión de esta instrucción no lo aclaraba y la IA le prometió un
           // adelanto a un cliente de Lima, que paga contraentrega.
           "REGLAS DE COBRO, no las inventes:\n"+
           "· Provincia (envío por agencia): se cobra un ADELANTO cuyo monto lo decide el negocio, NO el cliente. "+
           "Nunca preguntes cuánto quiere adelantar ni negocies la cifra, y no se lo pidas tú: "+
           "apenas estén sus datos, el sistema le manda el monto exacto y los datos de pago.\n"+
           "· Lima (contraentrega): NO hay adelanto ni pago por adelantado. Paga TODO al recibir el pedido. "+
           "Nunca le menciones adelantos, Yape ni datos de pago a alguien de Lima.\n"+
           "Si todavía no sabes de dónde es, no hables de pagos."+
           // Si el cliente YA mandó el comprobante del adelanto antes de dar sus
           // datos, esta nota (la arma buildContext desde _prepago_adel_url) le
           // dice a la IA que NO lo vuelva a pedir. Vacía en el caso normal.
           "{{adelanto_prepago_nota}}",
  },false,80,240);
  const nEsperar=await N("pregunta","Escuchar al cliente",{ text:"" },true,380,240);
  const nFin=await N("fin","Fin",{},false,2080,240);

  // OJO: acá NO hay rama de "validar el comprobante del adelanto". Eso lo toma
  // el interceptor `maybeAdelanto` del motor, ANTES del flujo, para que respete
  // el selector Manual/Automático de IA · Pedidos en el momento y no según cómo
  // estaba el día que generaste el flujo. Si estaba acá, aprobaría solo aunque
  // hubieras elegido que te consulte.

  // ── Rama Lima (contraentrega: no hay pago por adelantado) ──
  const nEsLima=await N("condicion","¿Es de Lima?",{
    rutas:[{ nombre:"Lima", handle:"ruta:lima", match:"todas",
             condiciones:[{ op:"campo_igual", campo:"zona_entrega", valor:"lima" }] }],
  },false,660,440);
  const nLimaOk=await N("condicion","¿Datos listos? (Lima)",{
    rutas:[{ nombre:"Crear", handle:"ruta:crear", match:"todas",
             condiciones:[
               { op:"campo_igual", campo:"datos_completos", valor:"si" },
               { op:"campo_igual", campo:"pedido_creado", valor:"" }, // aún sin pedido
             ] }],
  },false,960,440);
  const nCrearLima=await N("accion","Crear pedido Lima",{
    acciones:[
      // `monto` es la BASE: el motor le suma el envío que se cobre. Pero lo que
      // el motorizado tiene que cobrar en la puerta es el TOTAL ({{total_cobrar}}
      // = precio + envío). Con {{precio}} ahí, cobrar envío en Lima significaba
      // regalarlo: el pedido decía 130 y el motorizado cobraba 120.
      { tipo:"crear_pedido", estado:"confirmado", monto:"{{precio}}",
        // `distrito` = el distrito reconocido (mismo valor que zona_nombre); `provincia`
        // siempre Lima (para el rótulo/ficha en formato peruano distrito→provincia).
        datos:{ zona:"lima", zona_nombre:"{{zona_nombre}}", distrito:"{{zona_nombre}}", provincia:"Lima",
                direccion:"{{direccion}}", referencia:"{{referencia}}",
                cliente:"{{nombre_completo}}", opcion:"{{opcion}}", saldo:"{{total_cobrar}}", entrega_hoy:"{{entrega_hoy}}",
                tel:"{{telefono}}" } },
      { tipo:"set_field", key:"pedido_creado", valor:"si" },
      // El texto vive en el catálogo de avisos (Canales → Avisos de Telegram),
      // no acá: así se puede apagar o reescribir sin regenerar el flujo, y
      // regenerarlo no pisa lo que el operador haya editado.
      { tipo:"notify_admin", plantilla:"pedido_lima" },
    ],
  },false,1240,440);
  const nConfLima=await N("mensaje","Confirmación Lima",{
    // {{cliente}} y no {{nombre}}: acá ya dio su nombre completo para el rótulo,
    // así que usar el del perfil de WhatsApp queda raro.
    bubbles:[{ text:"¡Listo, {{cliente}}! ✅ Tu pedido quedó confirmado.\n\n🛵 Pagas al recibirlo. Te avisamos cuando salga el motorizado." }],
  },false,1520,440);

  // ── Rama Provincia (crea el pedido y recién ahí pide el adelanto) ──
  const nProvOk=await N("condicion","¿Datos listos? (Provincia)",{
    rutas:[{ nombre:"Crear", handle:"ruta:crear", match:"todas",
             condiciones:[
               { op:"campo_igual", campo:"datos_completos", valor:"si" },
               { op:"campo_igual", campo:"zona_entrega", valor:"provincia" },
               { op:"campo_igual", campo:"pedido_creado", valor:"" },
             ] }],
  },false,960,640);
  const nCrearProv=await N("accion","Crear pedido Provincia",{
    acciones:[
      { tipo:"crear_pedido", estado:"esperando_adelanto", monto:"{{precio}}",
        // La ciudad va SEPARADA de la sede: "Av. España" sola no alcanza para
        // despachar (¿la de Trujillo o la de Lima?).
        // El saldo es lo que falta TRAS el adelanto ({{saldo}} = precio − adelanto).
        // Con {{precio}} acá se le cobraba el adelanto dos veces al cliente.
        datos:{ zona:"provincia", ciudad:"{{ciudad}}", sede:"{{sede}}", dni:"{{dni}}", cliente:"{{nombre_completo}}",
                opcion:"{{opcion}}", adelanto:"{{adelanto}}", saldo:"{{saldo}}", tel:"{{telefono}}" } },
      { tipo:"set_field", key:"pedido_creado", valor:"si" },
      { tipo:"notify_admin", plantilla:"pedido_provincia" },
    ],
  },false,1240,640);
  const nPedirAdel=await N("mensaje","Pedir el adelanto",{
    bubbles:[{ text:"¡Perfecto! 🙌 Para despachar tu pedido a la agencia, confírmalo con un adelanto de *S/ {{adelanto}}*.\n\n{{datos_pago}}\n\nCuando lo hagas, mándame la captura y lo verifico al toque." }],
  },false,1520,640);
  // ¿El cliente YA pagó el adelanto ANTES de dar sus datos? El motor lo enganchó
  // al crear el pedido (engancharPrepagoAdelanto) y marcó `adelanto_prepagado`. Si
  // es así, NO le pedimos pagar de nuevo: le confirmamos que estamos verificando
  // (el pedido ya quedó en Pagos por validar con su comprobante).
  const nPrepagoCk=await N("condicion","¿Ya pagó el adelanto?",{
    rutas:[{ nombre:"Ya pagó", handle:"ruta:yapago", match:"todas",
             condiciones:[{ op:"campo_igual", campo:"adelanto_prepagado", valor:"si" }] }],
  },false,1520,500);
  const nYaPago=await N("mensaje","Ya pagó — verificando",{
    bubbles:[{ text:"¡Recibí tu pago y tus datos! ✅ Estoy verificando tu adelanto y en un momento te confirmo el despacho. 🙌" }],
  },false,1800,500);

  // ORDEN CRÍTICO: se escucha → la IA extrae → RECIÉN AHÍ se evalúa si están
  // los datos. Si las condiciones fueran antes del nodo de IA, evaluarían el
  // contexto de ANTES de extraer y el pedido se crearía siempre un mensaje
  // tarde (el cliente da el último dato y no pasa nada hasta que escriba otra
  // vez). No se ve leyendo el código: aparece corriendo la conversación.
  // Sin rama de imagen: el comprobante del adelanto lo intercepta el motor.
  await E(nEsperar,"continuar",nVender);
  await E(nVender,"exito",nEsLima);
  await E(nEsLima,"ruta:lima",nLimaOk);
  await E(nEsLima,"si_no_cumple",nProvOk);
  await E(nLimaOk,"ruta:crear",nCrearLima);
  await E(nLimaOk,"si_no_cumple",nEsperar);     // faltan datos → la IA ya los pidió
  await E(nCrearLima,"continuar",nConfLima);
  await E(nProvOk,"ruta:crear",nCrearProv);
  await E(nProvOk,"si_no_cumple",nEsperar);     // faltan datos o zona desconocida

  // ── Ventas extra "ride-along" (físico) ──
  // El extra no se cobra aparte: se suma al mismo envío (sube el saldo; en Lima
  // sube lo que cobra el motorizado, en provincia lo que cobra la agencia).
  const extras=(Array.isArray(cfg.extras)?cfg.extras:[]).filter(x=>x&&x.version_id);
  const esperaSeg=Math.max(60,(Number(cfg.extras_espera_min)||15)*60);
  const provPost=(cfg.extras_prov_momento||"post")==="post"; // configurable
  if(extras.length && !st.extraCat) await cargarCatalogoExtras();
  const catX=st.extraCat||[];

  // Lima: se ofrece tras confirmar (no hay adelanto que esperar).
  if(extras.length) await buildRideAlongExtras(N,E,nConfLima,nFin,extras,catX,esperaSeg,240);
  else await E(nConfLima,"continuar",nFin);

  // Provincia: crear pedido → ¿ya pagó el adelanto? → (no: pedirlo) / (sí:
  // verificando) → esperar. La bifurcación nPrepagoCk evita re-pedir el pago a
  // quien ya lo mandó antes de dar sus datos.
  if(!extras.length){
    await E(nCrearProv,"continuar",nPrepagoCk);
    await E(nPrepagoCk,"si_no_cumple",nPedirAdel);
    await E(nPrepagoCk,"ruta:yapago",nYaPago);
    await E(nPedirAdel,"continuar",nEsperar);
    await E(nYaPago,"continuar",nEsperar);
  }else if(!provPost){
    // PRE: se ofrece el extra entre crear el pedido y pedir el adelanto (ya sube el
    // saldo); la bifurcación de prepago va DESPUÉS de los extras, antes de pedir.
    await buildRideAlongExtras(N,E,nCrearProv,nPrepagoCk,extras,catX,esperaSeg,640);
    await E(nPrepagoCk,"si_no_cumple",nPedirAdel);
    await E(nPrepagoCk,"ruta:yapago",nYaPago);
    await E(nPedirAdel,"continuar",nEsperar);
    await E(nYaPago,"continuar",nEsperar);
  }else{
    // POST (recomendado): crear → ¿ya pagó? → pedir adelanto (o "verificando") →
    // ESPERAR el adelanto en un nodo marcado post_adelanto que VUELVE a sí mismo si
    // el cliente escribe (así el run queda parqueado ahí, confiable). Al validarse
    // el pago (auto o aprobado por ti), el motor reanuda por "post_adelanto" →
    // "¡recibido!" → ofrecimiento. Si ya prepagó, entra a ese mismo nodo de espera.
    await E(nCrearProv,"continuar",nPrepagoCk);
    const nEsperarAdel=await N("pregunta","Esperar el adelanto",{ text:"", post_adelanto:true },false,1520,780);
    const nRespAdel=await N("ia","Responder mientras espera el adelanto",{
      operacion:"generar_texto", enviar:true, usar_conocimiento:true, detectar_opcion:false,
      prompt:"El cliente ya tiene su pedido creado y le pediste el adelanto; está por pagarlo. Responde su duda breve (cómo pagar, cuánto es, cuándo llega) sin presionar. NO ofrezcas nada nuevo: solo espera su comprobante.",
    },false,1800,920);
    await E(nPrepagoCk,"si_no_cumple",nPedirAdel);
    await E(nPrepagoCk,"ruta:yapago",nYaPago);
    await E(nPedirAdel,"continuar",nEsperarAdel);
    await E(nYaPago,"continuar",nEsperarAdel);   // ya pagó → parqueado esperando tu validación
    await E(nEsperarAdel,"continuar",nRespAdel); // escribe (aún no paga)
    await E(nRespAdel,"exito",nEsperarAdel);     // vuelve a esperar → parqueado ahí
    const nRecibido=await N("mensaje","Adelanto recibido",{ bubbles:[{ text:"¡Adelanto recibido! 🎉 Ya empiezo a preparar tu despacho." }] },false,1520,640);
    await E(nEsperarAdel,"post_adelanto",nRecibido); // el motor reanuda por acá al validar
    await buildRideAlongExtras(N,E,nRecibido,nFin,extras,catX,esperaSeg,1040);
  }
}

async function generarFlujoVenta(){
  const ops=st.versions.filter(v=>v.activo!==false && v.precio!=null && v.precio!=="");
  if(!ops.length){ toast("Primero carga al menos una presentación con precio",true); return; }
  const ya=st.receta.fVenta;
  if(!await confirmDialog({
    title: ya?"Regenerar flujo de venta":"Generar flujo de venta",
    message: ya?`Esto REESCRIBE por completo "${esc(ya.nombre)}". Si lo editaste a mano en el editor visual, esos cambios se pierden.`
               :"Se creará el flujo de venta con la IA como vendedora. Después puedes editarlo en el editor visual.",
    confirmText: ya?"Regenerar":"Generar", danger: !!ya })) return;

  toast("Generando…");
  try{
    let flowId=ya?.id;
    if(flowId){
      await supa.from("flow_edges").delete().eq("flow_id",flowId);
      await supa.from("flow_nodes").delete().eq("flow_id",flowId);
      // Al REGENERAR no se toca el estado: si el flujo ya estaba vendiendo, se
      // lo dejaba en borrador y el producto se quedaba mudo sin avisar.
      await supa.from("flows").update({ nombre:`Venta · ${st.prod.nombre}`, folder:prodFolder() }).eq("id",flowId);
    }else{
      const { data,error } = await supa.from("flows").insert({
        channel_id:st.channelId, product_id:st.prod.id, nombre:`Venta · ${st.prod.nombre}`, folder:prodFolder(),
        // ACTIVO, no borrador: el rotador de mensajes iniciales solo salta a
        // flujos activos, así que un flujo recién generado en borrador hacía que
        // el producto saludara y se quedara MUDO — sin que nada lo dijera. Los
        // mensajes iniciales ya se creaban activos: eran dos mitades del mismo
        // producto con criterios distintos. Lo que impide vender lo avisa
        // "Salud del producto"; el estado no es el lugar para esconderlo.
        role:"venta", kind:"flow", estado:"activo",
        descripcion:`Venta de ${st.prod.nombre} con IA. Generado desde la receta.`,
      }).select("id").single();
      if(error){ toast(error.message,true); return; }
      flowId=data.id;
    }

    const N=async(tipo,nombre,config,es_inicial,x,y)=>{
      const { data,error } = await supa.from("flow_nodes")
        .insert({ flow_id:flowId, tipo, nombre, config, es_inicial:!!es_inicial, pos_x:x, pos_y:y })
        .select("id").single();
      if(error) throw new Error(error.message);
      return data.id;
    };
    const E=async(from,handle,to)=>{
      const { error }=await supa.from("flow_edges")
        .insert({ flow_id:flowId, source_node:from, source_handle:handle, target_node:to });
      if(error) throw new Error(error.message);
    };

    // El físico tiene otra forma: no entrega nada por chat, termina al crear el
    // pedido. Lo demás (despacho, guía, saldo, clave) lo opera un humano.
    if((st.prod.tipo||"digital")==="fisico"){
      await generarFlujoFisico(flowId, N, E);
      await enlazarInicialesConVenta(flowId);
      toast("Flujo de venta generado ✓");
      st.tab="inicio"; renderDetail();
      return;
    }

    // El nodo inicial es ESCUCHAR, no vender: a este flujo se llega después de
    // los mensajes iniciales, así que si arrancara vendiendo el bot hablaría
    // encima de su propio saludo (y hasta se respondería sus preguntas). Nadie
    // entra acá por palabra clave: se entra desde el rotador.
    const nVender=await N("ia","La IA vende",{
      operacion:"generar_texto", enviar:true, usar_conocimiento:true, detectar_opcion:true,
      prompt:"Eres un vendedor experto por WhatsApp: cálido, seguro y orientado a CERRAR (sin ser pesado). "+
             "Continúa la conversación de forma natural. Responde sus dudas, explica el valor y guíalo a la compra.\n"+
             "CÓMO VENDER (con tacto, la venta manda):\n"+
             "· Habla en BENEFICIOS, no en características.\n"+
             "· Ante una objeción ('está caro', 'lo pienso', 'no confío'), NO te rindas ni discutas: reconoce, rebate con valor/garantía/prueba y reencamina al cierre. Usa la sección de objeciones o FAQ del producto si la tiene.\n"+
             "· CIERRE ASUMIDO: da por hecha la compra ('¿te paso los datos de pago para enviártelo al toque?') en vez de '¿lo quieres?'.\n"+
             "· UNA sola cosa a la vez: mensaje corto, una pregunta.\n"+
             "· Prueba social/urgencia/multimedia SOLO si el conocimiento del producto te la dio. NUNCA inventes datos, precios, reseñas ni escasez.\n"+
             "Cuando decida comprar, dile el precio de la opción que eligió y pásale los datos de pago ({{datos_pago}}). No inventes precios ni promesas.",
    },false,80,220);
    const nEsperar=await N("pregunta","Escuchar al cliente",{ text:"" },true,380,220);
    const nEsImg=await N("condicion","¿Mandó comprobante?",{
      rutas:[{ nombre:"Es imagen", handle:"ruta:es_imagen", match:"todas",
               condiciones:[{ op:"campo_igual", campo:"last_input_type", valor:"image" }] }],
    },false,660,220);
    // Pide el token (que es lo que mira la Condición, porque las condiciones son
    // por texto) Y el JSON de lo que leyó — el motor lo rescata a
    // {{pago_metodo}}, {{pago_operacion}}… Sin el JSON, ni el aviso ni Sheets
    // podrían decir CON QUÉ pagó.
    const nOcr=await N("ia","Validar el pago",{
      operacion:"analizar_imagen", perfil:"ocr", usar_validador:true, enviar:false, guardar_en:"pago_resultado",
      prompt:"Analiza la imagen adjunta con las reglas del validador. Si el pago es VÁLIDO y por el monto correcto, "+
             "responde exactamente PAGO_OK. Si no, responde PAGO_NO y en una frase el motivo.\n"+
             "En la línea siguiente agrega SIEMPRE un JSON con lo que leíste del comprobante: "+
             '{"banco":"Yape o el banco","operacion":"nº de operación","monto":0,"titular":"a quién le pagó"}',
    },false,960,120);
    const nPagoOk=await N("condicion","¿Pago válido?",{
      rutas:[{ nombre:"Pago OK", handle:"ruta:pago_ok", match:"todas",
               condiciones:[{ op:"campo_contiene", campo:"pago_resultado", valor:"PAGO_OK" }] }],
    },false,1240,120);
    // En digital el nombre es el de WhatsApp ({{nombre}}): no hay extractor ni
    // agencia de por medio, así que no existe {{nombre_completo}}.
    // `una_vez`: si el cliente reenvía el comprobante o el motor reintenta, la
    // venta NO se cuenta ni se avisa dos veces (requisito 6).
    // El pedido se crea también en digital: es lo que alimenta el Dashboard y
    // la fila de la hoja (que es un espejo de `orders`). Sin esto, una venta
    // digital no existía en ningún reporte.
    const nRegistrar=await N("accion","Registrar la venta",{
      acciones:[
          { tipo:"crear_pedido", una_vez:"venta_{{opcion_id}}", estado:"confirmada", monto:"{{precio}}",
          datos:{ opcion:"{{opcion}}", comprobante:"{{ultima_imagen}}" } },
        { tipo:"notify_admin", una_vez:"aviso_{{opcion_id}}", foto:"{{ultima_imagen}}",
          plantilla:"venta_digital" },
      ],
    },false,1520,120);
    // Sin nodo de Google Sheets a propósito: la hoja es un ESPEJO automático de
    // los pedidos (syncPedidoSheet en el motor), así que se escribe sola al
    // crear el pedido y en cada cambio de estado. Si dependiera de un nodo del
    // flujo, alcanzaría con que alguien lo borre al editar para que dejen de
    // registrarse ventas — y nadie se enteraría hasta fin de mes.
    const nEntregar=await N("accion","Entregar el producto",{
      // Encabezado y estilo de burbuja configurables (pestaña Entrega). incluir_buffer:
      // junta el principal con los extras "antes" que quedaron diferidos (entrega conjunta).
      acciones:[{ tipo:"entregar",
        mensaje:(st.prod.config?.entrega_mensaje||"¡Pago confirmado! 🎉 Acá tienes tu acceso:"),
        una_burbuja:!!st.prod.config?.entrega_burbuja_unica,
        incluir_buffer:true }],
    },false,1800,120);
    const nFin=await N("fin","Fin",{},false,2080,120);
    const nRe=await N("mensaje","Pedir el comprobante de nuevo",{
      // {{pago_resultado_motivo}} y no {{pago_resultado}}: el crudo trae el token
      // PAGO_NO y el JSON que el OCR agrega, y el cliente los estaba viendo.
      bubbles:[{ text:"Mmm, no pude validar ese comprobante 🤔\n\n{{pago_resultado_motivo}}\n\n¿Me lo reenvías? Si tienes alguna duda, dime nomás." }],
    },false,960,340);

    await E(nVender,"exito",nEsperar);
    await E(nEsperar,"continuar",nEsImg);
    await E(nEsImg,"ruta:es_imagen",nOcr);
    await E(nEsImg,"si_no_cumple",nVender);      // bucle: sigue conversando
    await E(nOcr,"exito",nPagoOk);
    await E(nPagoOk,"ruta:pago_ok",nRegistrar);
    await E(nPagoOk,"si_no_cumple",nRe);
    await E(nRe,"continuar",nEsperar);           // vuelve a escuchar
    // Registrar → Sheets → (pase lo que pase) seguir. Las DOS salidas del nodo
    // de Sheets van al mismo lado: sin hoja configurada el nodo falla, y eso no
    // puede dejar sin producto a quien ya pagó.
    // OJO: las aristas de salida de nEntregar y nRegistrar se crean abajo según
    // haya extras y en qué momento. Dos aristas con el MISMO handle desde el
    // mismo nodo harían que nextNode elija una al azar.

    // ── Cadena de ventas extra (order bump) ──
    // "antes"  (Método 2, el que más convierte): paga → se le ofrecen los
    //          extras → recién ahí se entrega todo.
    // "despues": paga → se entrega → se le ofrecen los extras.
    // En AMBOS, si rechaza o no contesta, se entrega lo que ya pagó: nunca se
    // retiene un producto pagado por esperar un upsell.
    const cfg=st.prod.config||{};
    const extras=(Array.isArray(cfg.extras)?cfg.extras:[]).filter(x=>x&&x.version_id);
    const antes=(cfg.extras_momento||"antes")==="antes";
    const esperaSeg=Math.max(60,(Number(cfg.extras_espera_min)||15)*60);
    // El catálogo puede no estar cargado si nunca se abrió la pestaña de extras
    // (se puede generar el flujo directo desde la Receta).
    if(extras.length && !st.extraCat) await cargarCatalogoExtras();

    if(!extras.length){
      await E(nRegistrar,"continuar",nEntregar);
      await E(nEntregar,"continuar",nFin);
    }else{
      // Dónde cae la cadena cuando termina (rechazo, timeout o extras agotados).
      const salida = antes ? nEntregar : nFin;
      const cat=st.extraCat||[];
      const ofrecs=[], entregas=[];
      for(let i=0;i<extras.length;i++){
        const x=extras[i];
        const info=cat.find(c=>c.id===x.version_id);
        const y=520+i*420;
        const precio=info?.precio ?? "";
        const nOfr=await N("mensaje",`Ofrecer extra ${i+1}`,{
          bubbles:[{ text:x.mensaje||`¿Le sumas ${info?info.label:"el extra"}? 🎁` }],
        },false,80,y);
        const nEsp=await N("pregunta",`Esperar respuesta (extra ${i+1})`,{ text:"", timeout_seg:esperaSeg },false,380,y);
        const nImg=await N("condicion",`¿Mandó pago? (extra ${i+1})`,{
          rutas:[{ nombre:"Es imagen", handle:"ruta:es_imagen", match:"todas",
                   condiciones:[{ op:"campo_igual", campo:"last_input_type", valor:"image" }] }],
        },false,660,y);
        const nOcrX=await N("ia",`Validar pago del extra ${i+1}`,{
          operacion:"analizar_imagen", perfil:"ocr", usar_validador:true, enviar:false,
          guardar_en:`pago_extra_${i+1}`, monto_esperado:String(precio),
          _extra_label:(info?info.label:`Extra ${i+1}`),
          prompt:`Analiza la imagen. Si el pago es VÁLIDO y por S/ ${precio}, responde exactamente PAGO_OK. Si no, responde PAGO_NO y el motivo en una frase.`,
        },false,940,y-90);
        const nOkX=await N("condicion",`¿Pago OK? (extra ${i+1})`,{
          rutas:[{ nombre:"Pago OK", handle:"ruta:pago_ok", match:"todas",
                   condiciones:[{ op:"campo_contiene", campo:`pago_extra_${i+1}`, valor:"PAGO_OK" }] }],
        },false,1220,y-90);
        const nDarX=await N("accion",`Entregar extra ${i+1}`,{
          acciones:[
            // Suma el extra al MISMO pedido: alimenta las "ventas extra" del
            // Dashboard y la columna "Valor Producto extra" de la hoja, en la
            // misma fila de la venta principal. (Los extras son del flujo
            // digital: acá el nombre es el de WhatsApp, no hay extractor.)
            { tipo:"actualizar_pedido", bump:{ nombre:(info?info.label:`Extra ${i+1}`), precio:String(precio) } },
            // "antes": se DIFIERE la entrega del extra para mandarla junto con el
            // principal al final. "después": ya se entregó el principal, así que el
            // extra se entrega al toque (respetando el estilo de burbuja del producto).
            (antes
              ? { tipo:"entregar", version_id:x.version_id, diferir:true }
              : { tipo:"entregar", version_id:x.version_id, una_burbuja:!!cfg.entrega_burbuja_unica, mensaje:"¡Listo! 🎉 Acá va tu extra:" }),
            { tipo:"notify_admin", una_vez:`extra_${x.version_id}`, foto:"{{ultima_imagen}}",
              plantilla:"venta_extra", datos:{ extra:(info?info.label:`Extra ${i+1}`), monto:String(precio) } },
          ],
        },false,1500,y-90);
        const nReX=await N("mensaje",`Reintentar pago (extra ${i+1})`,{
          bubbles:[{ text:`No pude validar ese pago 🤔 {{pago_extra_${i+1}_motivo}}\n\n¿Me lo reenvías?` }],
        },false,1220,y+90);
        // Corte inteligente: entiende "no gracias" / "ya tengo" / "dale" sin botones.
        const nClas=await N("ia",`¿Lo quiere? (extra ${i+1})`,{
          operacion:"clasificar", guardar_en:`extra_${i+1}_resp`, default:"duda", umbral:0.6,
          que:"Qué está diciendo el cliente sobre la oferta adicional",
          opciones:[
            { clave:"acepta", label:"Acepta", detalle:"Dice que sí, lo quiere, pregunta cómo pagarlo" },
            { clave:"rechaza", label:"Rechaza", detalle:"Dice que no, que no le interesa, que ya lo tiene, que solo quiere lo que compró" },
            { clave:"duda", label:"Duda o pregunta", detalle:"Pide más información, no decide todavía" },
          ],
        },false,940,y+90);
        const nRech=await N("condicion",`¿Dijo que no? (extra ${i+1})`,{
          rutas:[{ nombre:"Rechaza", handle:"ruta:rechaza", match:"todas",
                   condiciones:[{ op:"campo_igual", campo:`extra_${i+1}_resp`, valor:"rechaza" }] }],
        },false,1220,y+240);
        const nResp=await N("ia",`Responder sobre el extra ${i+1}`,{
          operacion:"generar_texto", enviar:true, usar_conocimiento:true, detectar_opcion:false,
          // Contexto del PROPIO extra (su "Venta con IA") para que la IA responda
          // dudas del complemento, no solo del principal. Se congela al generar.
          contexto:(info&&info.contexto)?`## Sobre el complemento que estás ofreciendo (${info.nombreProd||info.label})\n${info.contexto}`:undefined,
          prompt:`El cliente está viendo una oferta adicional (${info?info.label:"el extra"}). Responde su duda de forma breve `+
                 `y ayúdalo a decidir, sin presionar. Si quiere, pásale los datos de pago ({{datos_pago}}).`,
        },false,1500,y+240);

        primero.push(nOfr);
        await E(nOfr,"continuar",nEsp);
        await E(nEsp,"timeout",salida);          // no contestó → se entrega igual
        await E(nEsp,"continuar",nImg);
        await E(nImg,"ruta:es_imagen",nOcrX);
        await E(nImg,"si_no_cumple",nClas);
        await E(nOcrX,"exito",nOkX);
        await E(nOkX,"ruta:pago_ok",nDarX);
        await E(nOkX,"si_no_cumple",nReX);
        await E(nReX,"continuar",nEsp);
        await E(nClas,"exito",nRech);
        await E(nRech,"ruta:rechaza",salida);    // corte de TODA la cadena
        await E(nRech,"si_no_cumple",nResp);
        await E(nResp,"exito",nEsp);
        ofrecs.push(nOfr); entregas.push(nDarX);
      }
      // Encadenado: pagar un extra lleva al ofrecimiento del siguiente; el
      // último cierra la cadena por la salida.
      for(let i=0;i<entregas.length;i++){
        await E(entregas[i],"continuar", i+1<ofrecs.length ? ofrecs[i+1] : salida);
      }
      // Entrada a la cadena según el momento elegido. Se engancha DESDE Sheets,
      // no desde Registrar: Registrar ya sale hacia Sheets, y dos aristas con
      // el mismo handle harían que nextNode elija una al azar.
      if(antes){
        await E(nRegistrar,"continuar",ofrecs[0]);
        await E(nEntregar,"continuar",nFin);     // la salida de la cadena
      }else{
        await E(nRegistrar,"continuar",nEntregar);
        await E(nEntregar,"continuar",ofrecs[0]); // entregó y ahora ofrece
      }
    }

    await enlazarInicialesConVenta(flowId);
    toast("Flujo de venta generado ✓");
    st.tab="inicio"; renderDetail();
  }catch(e){ toast("Error al generar: "+(e.message||e),true); }
}

// Engancha los mensajes iniciales al flujo de venta recién generado.
//
// Nacían con "y después: nada", así que el bot saludaba, terminaba la
// conversación y el siguiente mensaje del cliente ("sí, lo quiero, ¿cómo pago?")
// ya no encontraba flujo: caía al respaldo o al silencio. Las dos piezas se
// creaban bien por separado y nadie las unía — y el desplegable para unirlas
// solo se puede usar DESPUÉS de generar el flujo, así que el orden natural
// dejaba el producto siempre roto.
//
// Solo se toca si está en "nada": si el operador eligió a propósito otro
// destino, no se le pisa.
async function enlazarInicialesConVenta(flowId){
  try{
    const fIni=st.receta?.fIni; if(!fIni) return;
    const { data:nodo } = await supa.from("flow_nodes")
      .select("id,config").eq("flow_id",fIni.id).eq("tipo","rotador").maybeSingle();
    if(!nodo) return;
    const cfg=nodo.config||{};
    const des=cfg.despues||{modo:"nada"};
    if(des.modo==="flujo" && des.flow_id) return;   // ya apunta a algo: respetarlo
    cfg.despues={ modo:"flujo", flow_id:flowId };
    await supa.from("flow_nodes").update({ config:cfg }).eq("id",nodo.id);
  }catch(e){ console.error("[enlazarInicialesConVenta]",e); }
}

// ── Opciones de compra ─────────────────────────────────────────────
// UN solo concepto que unifica lo que antes eran tres cosas sueltas:
// "versiones" (Básico/Premium), "packs" y "ofertas por cantidad". Para el
// sistema las tres tienen la misma forma: algo comprable, con nombre, precio y
// algo que entrega. Es lo que la IA detecta del texto libre del cliente y lo
// que el validador de pagos usa como MONTO ESPERADO. Ver migración 0029.
function renderOpciones(host){
  const b=host||$("tabBody");
  st._opHost=b; // para re-dibujar la sección entera (ej. al borrar y volver a simple)
  const fisico=(st.prod.tipo||"digital")==="fisico";
  const cfg=st.prod.config=st.prod.config||{};
  if(!Array.isArray(cfg.atributos)) cfg.atributos=[];
  // Siempre debe haber al menos una presentación con precio: "¿cuánto cuesta?"
  // arranca mostrando el precio, no un estado vacío.
  if(!st.versions.length) st.versions.push({ nombre:"", precio:"", cantidad:1, descripcion:"", entrega:[], activo:true, orden:0 });
  const multi = st.versions.length>1;
  const cur=cfg.moneda||"PEN";
  const sym=(CURRENCIES.find(c=>c[0]===cur)||["","S/"])[1];
  const monedaSel=`<select class="sel" id="opMoneda" style="width:auto;min-width:210px;height:36px;font-size:12.5px">${CURRENCIES.map(([cd,sy,nm])=>`<option value="${cd}" ${cur===cd?"selected":""}>${sy} · ${esc(nm)} (${cd})</option>`).join("")}</select>`;

  // ── PRODUCTO SIMPLE (1 presentación): una tarjeta limpia, precio primero ──
  if(!multi){
    const v=st.versions[0];
    b.innerHTML=`
      <div class="card">
        <div class="row" style="align-items:flex-end;gap:16px">
          <div style="flex:0 0 200px"><label style="margin-top:0;font-size:12.5px">Precio de venta</label>
            <div style="position:relative">
              <span style="position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:800;font-size:16px;pointer-events:none">${esc(sym)}</span>
              <input class="in op" type="number" step="0.01" min="0" value="${esc(v.precio??"")}" placeholder="0" style="padding-left:38px;font-size:20px;font-weight:800;height:52px"/>
            </div></div>
          <div style="flex:0 0 150px"><label style="margin-top:0;font-size:12.5px">Tu costo <span style="font-weight:400;color:var(--faint);text-transform:none">(${fisico?"por unidad":"opcional"})</span></label>
            <input class="in" id="opCosto" type="number" min="0" step="0.5" value="${esc(cfg.costo??"")}" placeholder="0" style="height:52px"/></div>
          <div id="opMargen" style="flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--green,#22c079);display:none;align-items:center;gap:7px;padding-bottom:14px"></div>
        </div>
        <div style="font-size:11.5px;color:var(--faint);margin-top:8px">El <b>costo</b> es lo que te cuesta ${fisico?"una unidad":"cada venta"} — el cliente nunca lo ve; sirve para calcular tu ganancia real.${fisico?"":" En un digital suele ser 0."}</div>
        ${fisico
          ? `<div style="font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.55">Este producto se <b>envía</b>: la venta termina cuando se crea el pedido (no entrega nada por el chat). ¿Regalar algo digital con la compra? Va en <a href="#" class="oGoExtra" style="color:var(--brand)">Ventas extra →</a>.</div>`
          : `<div style="font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.55">El <b>link o archivo</b> que recibe el cliente lo configuras en <a href="#" class="oGoEnt" style="color:var(--brand)">¿Cómo se entrega? →</a>.</div>`}
      </div>
      <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 4px 14px;font-size:12.5px;color:var(--muted)">
        <span style="font-weight:700">Moneda</span>${monedaSel}<span style="font-size:11.5px;color:var(--faint)">Aplica a todo el producto.</span>
      </div>
      <details>
        <summary style="cursor:pointer;list-style:none;font-size:13px;font-weight:700;color:var(--brand);padding:8px 4px">＋ ¿Vendes en packs o varias versiones?</summary>
        <div style="font-size:12.5px;color:var(--muted);line-height:1.6;padding:2px 4px 8px">Ej. <b>1 par / 2 pares</b>, <b>Básico / Premium</b>, packs. Cada versión con su propio precio; la IA detecta cuál pidió el cliente aunque lo escriba a su manera.
          <div style="margin-top:9px"><button class="btn" id="opAdd" style="height:34px">+ Agregar una versión</button></div>
        </div>
      </details>`;
    const opEl=b.querySelector(".op"); if(opEl) opEl.oninput=(e)=>{ v.precio=e.target.value; updateOpMargen(); };
    const oc2=$("opCosto"); if(oc2) oc2.onchange=(e)=>{ prodSetC("costo", e.target.value.trim()===""?undefined:Number(e.target.value)); updateOpMargen(); };
    const oge=b.querySelector(".oGoExtra"); if(oge) oge.onclick=(e)=>{ e.preventDefault(); accOpen("extras"); };
    const ogEnt=b.querySelector(".oGoEnt"); if(ogEnt) ogEnt.onclick=(e)=>{ e.preventDefault(); accOpen("entrega"); };
    $("opMoneda").onchange=(e)=>{ prodSetC("moneda", e.target.value); renderOpciones(b); };
    $("opAdd").onclick=()=>{ st.versions.push({ nombre:"", precio:"", cantidad:1, descripcion:"", entrega:[], activo:true, orden:st.versions.length }); renderOpciones(b); };
    updateOpMargen();
    return;
  }

  // ── VARIAS PRESENTACIONES (packs / versiones): la lista completa ──
  b.innerHTML=`
    <div class="card" style="border-color:var(--brand-border)">
      <h4 style="display:flex;align-items:center;gap:7px;margin-top:0">${icon("productos")} Presentaciones y precios</h4>

    st.versions.push({ nombre:"", precio:"", cantidad:1, descripcion:"", entrega:[], activo:true, orden:st.versions.length });

// Margen en vivo de Presentaciones (físico): precio más barato − costo del producto.
function updateOpMargen(){
  const el=document.getElementById("opMargen"); if(!el) return;
  const costoN=Number(st.prod.config?.costo);
  const prices=(st.versions||[]).filter(v=>v.activo!==false).map(v=>Number(v.precio)).filter(n=>!isNaN(n)&&n>0);
  const p=prices.length?Math.min(...prices):NaN;
  if(isNaN(p)||isNaN(costoN)){ el.style.display="none"; return; }
  const g=Math.round((p-costoN)*100)/100;
  el.style.display="flex";
  el.innerHTML=`${icon("dollar")} Ganas ~S/ ${g} por ${prices.length>1?"la presentación más barata":"unidad"} <span style="font-weight:400;color:var(--faint)">(precio − costo, antes del envío)</span>`;
}

// Slug estable para la clave de un atributo → {{clave}}, campo del contacto y
// tag de su multimedia. Debe coincidir con slugAttr() del motor (engine.ts).
function slugAttr(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,32); }

function paintOpciones(fisico){
  const box=$("opList"); box.innerHTML="";
  // Producto simple (1 sola presentación): UI reducida — solo precio (+ unidades)
  // y entrega. Sin nombre/activa/borrar ni descripción (la descripción por opción
  // el motor solo la usa cuando hay 2+; con una sola, el contexto va en Venta con IA).
  const simple = st.versions.length===1;
  if(!st.versions.length){
    box.innerHTML=`<div class="nodo-empty" style="padding:20px">Sin presentaciones todavía. Agrega al menos una con su precio.</div>`;
  }
  st.versions.forEach((v,i)=>{
    const el=document.createElement("div"); el.className="card";
    el.innerHTML=`
      <div class="row" style="align-items:flex-end;gap:10px">
        ${simple?"":`<div style="flex:1.4"><label style="margin-top:0">Nombre</label>
          <input class="in on" value="${esc(v.nombre||"")}" placeholder="${fisico?"Ej. 1 par · 2 pares · Pack familiar":"Ej. Básico · Premium · Pack completo"}"/></div>`}
        <div style="${simple?'flex:0 0 160px':'flex:0 0 110px'}"><label style="margin-top:0">Precio</label>
          <input class="in op" type="number" step="0.01" min="0" value="${esc(v.precio??"")}"/></div>
        ${simple?"":`<div style="flex:0 0 115px"><label style="margin-top:0">Costo <span style="font-weight:400;color:var(--faint);text-transform:none">opcional</span></label>
          <input class="in ocosto" type="number" step="0.01" min="0" value="${esc(v.costo??"")}" placeholder="del prod." title="Vacío = usa el costo del producto"/></div>`}
        ${fisico?`<div style="flex:0 0 120px"><label style="margin-top:0">Unidades por venta</label>
          <input class="in oc" type="number" min="1" value="${esc(v.cantidad??1)}" title="Cuántas unidades del producto lleva ESTA presentación (es lo que descuenta del stock). Producto simple: 1. Pack de 2: 2."/></div>`:""}
        ${simple?"":`<label class="chk" style="flex:0 0 auto;margin-bottom:9px"><input type="checkbox" class="oa" ${v.activo!==false?"checked":""}/> Activa</label>
        <button class="iconbtn odel" style="flex:0 0 auto;margin-bottom:6px" title="Eliminar">${icon("trash")}</button>`}
      </div>
      ${simple?"":`<div style="border:1px solid rgba(168,85,247,.32);background:rgba(168,85,247,.06);border-radius:12px;padding:12px 13px;margin-top:12px">
        <label style="margin:0;display:flex;align-items:center;gap:7px;color:var(--ia1,#a855f7);font-weight:700;text-transform:none">
          <span style="display:inline-flex"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/><path d="M12 4v4"/><circle cx="12" cy="4" r="1"/></svg></span>
          Descripción para la IA <span style="color:var(--faint);font-weight:400">(para vender y reconocer ESTA presentación)</span>
        </label>
        <input class="in odesc" value="${esc(v.descripcion||"")}" placeholder="${fisico?"Ej. Incluye medias y bolso de regalo":"Ej. Incluye las plantillas editables y el bonus"}" style="margin-top:7px;border-color:rgba(168,85,247,.35)"/>
      </div>`}
      ${fisico ? (i===0 ? `
      <div style="margin-top:12px;font-size:11.5px;color:var(--faint);line-height:1.55">
        Este producto se <b>envía</b>, así que no entrega nada por el chat: la venta termina cuando se crea el pedido.
        ¿Quieres regalar algo digital con la compra? Va en <a href="#" class="oGoExtra" style="color:var(--brand)">Ventas extra →</a>,
        que sí lo manda cuando el pedido está pagado del todo.
      </div>` : "")
      : `
      <label style="margin-top:12px">Qué entrega <span style="color:var(--faint);font-weight:400">(links, archivos, imágenes o videos — se envían al confirmar el pago)</span></label>

      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn oel" style="height:32px">${icon("link")} Link</button>
        <button class="btn oef" style="height:32px">${icon("file")} Archivo / imagen / video</button>
      </div>
      <label style="margin-top:14px">Mensaje de apertura de esta opción <span style="color:var(--faint);font-weight:400">(opcional — vacío = usa el general del producto)</span></label>
      <input class="in oemsg" value="${esc(v.entrega_mensaje||"")}" placeholder="Ej. ¡Bienvenido al Premium! 🌟 Acá tienes todo:"/>`}`;

    const ocos=el.querySelector(".ocosto"); if(ocos) ocos.oninput=(e)=>{ v.costo=e.target.value; };
    const oc=el.querySelector(".oc"); if(oc) oc.oninput=(e)=>{ v.cantidad=parseInt(e.target.value,10)||1; };
    const oa=el.querySelector(".oa"); if(oa) oa.onchange=(e)=>{ v.activo=e.target.checked; warnColision(); };
    const odesc=el.querySelector(".odesc"); if(odesc) odesc.oninput=(e)=>{ v.descripcion=e.target.value; };
    const oem=el.querySelector(".oemsg"); if(oem) oem.oninput=(e)=>{ v.entrega_mensaje=e.target.value; };
    const odel=el.querySelector(".odel"); if(odel) odel.onclick=async()=>{
      if(!await confirmDialog({title:"Eliminar opción",message:`¿Eliminar "${esc(v.nombre||"esta opción")}"? Los pedidos ya hechos con ella no se tocan.`,confirmText:"Eliminar",danger:true})) return;
      if(v.id) st.delVersions.push(v.id);

      // Si quedó 1 (o 0), volver al layout SIMPLE limpio en vez del híbrido multi.
      if(st.versions.length<=1 && st._opHost) renderOpciones(st._opHost); else paintOpciones(fisico);
    };
    // Agrega una fila vacía y pone el cursor en el link. Antes eran DOS ventanas
    // seguidas (primero el link, después el nombre) para una sola acción — y el
    // nombre ya se edita en la propia fila, así que la segunda no aportaba nada.
    // Además, si cancelabas la segunda, la primera quedaba a medias.
    // En físico no hay bloque de entrega (se envía, no se manda por chat): solo
    // el atajo a Ventas extra, que es donde sí vive un regalo digital.
    const oel=el.querySelector(".oel");
    if(oel) oel.onclick=()=>{
      v.entrega=Array.isArray(v.entrega)?v.entrega:[];
      v.entrega.push({ tipo:"link", url:"", nombre:"" });
