// ── Pestaña REMARKETING: reenganche por silencio, propio del producto ──
// El motor de remarketing vive en Secuencias (drip por silencio, lo corre el
// scheduler). Acá se ve/gestiona la secuencia de ESTE producto sin salir de su
// ficha; el editor de pasos avanzado sigue en Secuencias.
async function renderRemarketing(host){
  const b=host||$("tabBody");
  b.innerHTML=`<p class="hint" style="margin:0 0 14px">Cargando…</p>`;
  const [{ data:seqs, error }, { data:ch }, { data:angs }]=await Promise.all([
    supa.from("sequences").select("id,nombre,activo,pasos").eq("channel_id",st.channelId).order("created_at",{ascending:false}),
    supa.from("channels").select("remarketing").eq("id",st.channelId).maybeSingle(),
    supa.from("angulos").select("nombre,slug").eq("product_id",st.prod.id).order("orden"),
  ]);
  if(error){ b.innerHTML=`<div class="card"><p class="hint">No se pudieron cargar las secuencias.</p></div>`; return; }
  const list=(seqs||[]);
  // Ángulos del producto para el selector "Responde al ángulo" del editor inline de
  // pasos (dedupe por slug). Sin tabla angulos (pre-0063) o sin ángulos → vacío → el
  // selector no aparece. Lo lee el editor compartido (seq-editor.js).
  { const seen=new Set(); st.remAngulos=(angs||[]).filter(a=>a&&a.slug&&!seen.has(a.slug)&&seen.add(a.slug)); }
  const c=st.prod.config=st.prod.config||{};
  const seq=list.find(s=>s.id===c.remarketing_seq_id)||null;
  const rm=(ch?.remarketing && typeof ch.remarketing==="object") ? {...ch.remarketing} : {};
  const opciones=(st.versions||[]).filter(v=>v.precio!=null&&v.precio!=="");

  b.innerHTML=`
    <p class="hint" style="margin:0 0 14px">Reengancha a quien se interesó en <b>${esc(st.prod.nombre)}</b> y no compró. Manda mensajes por <b>silencio</b> (cada paso espera un tiempo sin respuesta): si el cliente responde, se pausa sola; si compra, sale.</p>

    <div class="card" data-noguard>
      <h4 style="display:flex;align-items:center;gap:7px;margin:0 0 8px">${icon("clock")} Horario de envío <span style="font-size:11px;color:var(--faint);font-weight:400">· aplica a TODO el remarketing del bot</span></h4>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="sw ${rm.activo?'on':''}" id="hrTog"></span>
        <span style="font-size:12.5px">Enviar solo dentro de un horario (hora de Perú)</span>
      </div>
      <div id="hrRange" style="display:${rm.activo?'flex':'none'};align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px">
        <span style="font-size:12.5px;color:var(--muted)">Desde</span>
        <input class="in" id="hrDesde" type="time" value="${esc(rm.desde||'09:00')}" style="width:120px"/>
        <span style="font-size:12.5px;color:var(--muted)">hasta</span>
        <input class="in" id="hrHasta" type="time" value="${esc(rm.hasta||'21:00')}" style="width:120px"/>
      </div>
      <div style="display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
        <span class="sw ${rm.antispam!==false?'on':''}" id="asTog" style="margin-top:2px"></span>
        <div><div style="font-size:12.5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap">Anti-spam · máximo 1 mensaje automático cada 18 h <span style="font-size:9.5px;color:var(--green,#22c079);font-weight:800;letter-spacing:.4px;border:1px solid var(--green,#22c079);border-radius:20px;padding:1px 7px">RECOMENDADO</span></div>
          <div style="font-size:11px;color:var(--faint);margin-top:3px;line-height:1.5">Protege tu número de un <b>baneo de WhatsApp</b> por sobre-envío: coordina secuencias, nudges y campañas para no encimarlos. Los avisos del pedido (va en camino, etc.) no cuentan. Apágalo solo si sabes lo que haces.</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:14px">
        <button class="btn primary" id="hrSave" style="background:var(--brand,#2b7fff);color:#fff;border:none">Guardar horario y anti-spam</button>
        <span style="font-size:11px;color:var(--faint);flex:1">Apagado = a cualquier hora. Fuera del horario el mensaje no se pierde: espera a la próxima hora permitida.</span>
      </div>
    </div>

    <div class="card">
      <h4 style="display:flex;align-items:center;gap:7px;margin:0 0 4px">${icon("secuencias")} Secuencias por audiencia</h4>
      <p class="hint" style="margin:0 0 4px">Cada tipo de cliente puede tener su propia secuencia de reenganche. Lo que dejes vacío usa la <b>General</b> (y si no hay general, ese caso no recibe remarketing).</p>
      <div id="remSlots"></div>
      <div style="font-size:11px;color:var(--faint);margin-top:12px">Los pasos de cada secuencia se editan en <a href="secuencias.html" style="color:var(--brand)">Secuencias</a>. Recuerda <b>Guardar</b> el producto para fijar los enlaces.</div>
    </div>`;

  // ── Horario (global del canal) ──
  const hrSw=$("hrTog");
  if(hrSw) hrSw.onclick=()=>{ rm.activo=!rm.activo; hrSw.classList.toggle("on",rm.activo); $("hrRange").style.display=rm.activo?"flex":"none"; };
  const asSw=$("asTog");
  if(asSw) asSw.onclick=()=>{ rm.antispam=(rm.antispam===false); asSw.classList.toggle("on",rm.antispam!==false); };
  if($("hrSave")) $("hrSave").onclick=async(e)=>{
    rm.desde=$("hrDesde")?.value||rm.desde; rm.hasta=$("hrHasta")?.value||rm.hasta;
    if(rm.activo && rm.desde && rm.hasta && rm.hasta<=rm.desde){ toast("La hora final debe ser mayor a la inicial",true); return; }
    const btn=e.target; btn.disabled=true; const old=btn.textContent; btn.textContent="Guardando…";
    const { error }=await supa.from("channels").update({ remarketing:rm }).eq("id",st.channelId);
    btn.disabled=false; btn.textContent=old;
    if(error){ toast(/remarketing|column/.test(error.message)?"Falta aplicar la migración 0031":error.message,true); return; }
    toast("Horario guardado ✓");
  };

  // ── Secuencias por audiencia (mapa por producto) ──
  // "Provincia sin adelanto" es un segmento FÍSICO (pedido a provincia con
  // adelanto). En digital no existe (se entrega al instante) → no se muestra.
  const fisicoRem=(st.prod.tipo||"digital")==="fisico";
  const REM_SEG=[
    ["general","🌐 General (comodín)","Para cualquiera que se interesó. La red de seguridad."],
    ["solo_inicio","🌱 Curioso","Solo tiró la palabra clave y no volvió."],
    ["interactuo","💬 Interactuó","Conversó o dejó un dato, pero no compró."],
    ["caliente","🔥 Caliente","Escribió 4+ mensajes y no compró — el más enganchado. Ve al grano, con más urgencia."],
    ...(fisicoRem ? [["provincia_sin_adelanto","📦 Provincia sin adelanto","Se activa apenas el cliente da su DNI (aunque todavía no complete el pedido): así también persigues al que se va antes de dar la sede. No le escribe mientras siga conversando, y sale solo apenas paga el adelanto."]] : []),
  ];
  const REM_PRESETS=[
    { nombre:"Recordatorio suave", desc:"3 toques · Día 1, 3 y 7", pasos:[
      [86400,"¡Hola {{nombre}}! ¿Aún te interesa? Cualquier duda te ayudo 😊"],
      [172800,"Te sigo guardando tu pedido 👀 ¿Lo cerramos hoy?"],
      [345600,"Última oportunidad — luego libero tu cupo. ¿Te animas?"],
    ]},
    { nombre:"Oferta directa", desc:"2 toques · Día 1 y 4", pasos:[
      [86400,"{{nombre}}, te reservé una oferta especial por hoy 🎁"],
      [259200,"Tu oferta vence hoy. ¿La aprovechas?"],
    ]},
  ];
  const remMap=()=>{ c.remarketing_seqs=(c.remarketing_seqs&&typeof c.remarketing_seqs==="object")?c.remarketing_seqs:{}; return c.remarketing_seqs; };
  // Compat: la general vieja vivía en remarketing_seq_id.
  const seqSlot=(k)=>{ const m=remMap(); const id = k==="general" ? (m.general||c.remarketing_seq_id) : m[k]; return id ? (list.find(s=>s.id===id)||{id,nombre:"(secuencia)"}) : null; };
  const setSlot=async(k,seqId)=>{
    const m=remMap();
    if(seqId) m[k]=seqId; else delete m[k];
    if(k==="general"){ if(seqId) c.remarketing_seq_id=seqId; else delete c.remarketing_seq_id; }
    prodSync();
    if(seqId){ try{ await supa.from("sequences").update({ segmento:k }).eq("id",seqId); }catch(_){} } // etiqueta para la insignia en Secuencias
    toast(seqId?"Vinculada ✓ — recuerda Guardar el producto":"Quitada — recuerda Guardar el producto");
    renderSlots();
  };
  const crearPara=async(k,label)=>{
    const nombre=`${st.prod.nombre} · ${label.replace(/[^\wáéíóúñ ]/gi,"").trim()}`.slice(0,60);
    let { data,error }=await supa.from("sequences").insert({ channel_id:st.channelId, nombre, activo:true, pasos:[], folder:prodFolder(), segmento:k }).select("id").single();
    if(error && /folder|segmento|column/.test(error.message)){ ({ data,error }=await supa.from("sequences").insert({ channel_id:st.channelId, nombre, activo:true, pasos:[] }).select("id").single()); }
    if(error||!data){ toast("No se pudo crear la secuencia",true); return; }
    list.unshift({ id:data.id, nombre, activo:true, pasos:[] });
    await setSlot(k,data.id);
    toast("Secuencia creada ✓ — edítala en Secuencias");
  };
  let abierto=null; // qué casilla tiene el editor de pasos abierto (una a la vez)
  const renderSlots=()=>{
    const box=$("remSlots"); if(!box) return;
    box.innerHTML=REM_SEG.map(([k,label,desc])=>{
      const s=seqSlot(k);
      const right = s
        ? `<span style="font-size:12.5px;color:var(--text);font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.nombre)}</span>
           <button class="btn ${abierto===k?"primary":""}" data-toggle="${k}" style="height:30px;padding:0 11px;font-size:12px${abierto===k?";background:var(--brand,#2b7fff);color:#fff;border:none":""}">${abierto===k?"Cerrar ▲":"Editar pasos ▾"}</button>
           <button class="btn" data-unlink="${k}" style="height:30px;padding:0 10px;font-size:12px;color:var(--faint)">quitar</button>`
        : `<button class="btn primary" data-new="${k}" style="height:30px;padding:0 11px;font-size:12px;background:var(--brand,#2b7fff);color:#fff;border:none">+ Crear</button>
           ${list.length?`<select class="sel" data-link="${k}" style="height:30px;font-size:12px;min-width:150px"><option value="">vincular…</option>${list.map(x=>`<option value="${x.id}">${esc(x.nombre||"(sin nombre)")}</option>`).join("")}</select>`:""}`;
      return `<div style="padding:12px 0;border-top:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:170px"><div style="font-size:13px;font-weight:600">${label}</div><div style="font-size:11px;color:var(--faint);margin-top:1px;line-height:1.4">${desc}</div></div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${right}</div>
        </div>
        ${s&&abierto===k?`<div class="remEd" data-ed="${k}" style="margin-top:12px;background:var(--surface-2,#1b222c);border:1px solid var(--border);border-radius:12px;padding:14px"></div>`:""}
      </div>`;
    }).join("");
    box.querySelectorAll("[data-new]").forEach(btn=> btn.onclick=()=>{ const k=btn.dataset.new; crearPara(k, (REM_SEG.find(x=>x[0]===k)||[])[1]||k); });
    box.querySelectorAll("[data-link]").forEach(sel=> sel.onchange=(e)=>{ if(e.target.value) setSlot(sel.dataset.link, e.target.value); });
    box.querySelectorAll("[data-unlink]").forEach(btn=> btn.onclick=()=> setSlot(btn.dataset.unlink, null));
    box.querySelectorAll("[data-toggle]").forEach(btn=> btn.onclick=()=>{ abierto=(abierto===btn.dataset.toggle?null:btn.dataset.toggle); renderSlots(); });
    const edBox=box.querySelector(".remEd");
    if(edBox){ const s=seqSlot(edBox.dataset.ed); if(s){ if(!Array.isArray(s.pasos)) s.pasos=[]; paintEditor(s, edBox); } }
  };
  // Editor de pasos INLINE de una casilla (se guarda directo a la secuencia).
  const paintEditor=(seq, wrap)=>{
    // Editor de pasos COMPARTIDO (mismo módulo que la página Secuencias). El producto
    // usa mensaje-only (actions.enabled=false) y su propio producto para el descuento.
    wrap.innerHTML=`<div class="se-mount"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center">
        <button class="btn primary" data-remsave style="background:var(--brand,#2b7fff);color:#fff;border:none">Guardar pasos</button>
      </div>`;
    if(!Array.isArray(seq.pasos)) seq.pasos=[];
    const ed=mountStepsEditor(wrap.querySelector(".se-mount"), {
      seq, channelId:st.channelId, angulos:st.remAngulos, presets:REM_PRESETS,
      ofertaProducts:[{ id:st.prod.id, nombre:st.prod.nombre, opciones }],
      actions:{ enabled:false },
    });
    wrap.querySelector("[data-remsave]").onclick=async(e)=>{
      ed.normalize();
      const btn=e.target; btn.disabled=true; const old=btn.textContent; btn.textContent="Guardando…";
      const { error }=await supa.from("sequences").update({ pasos:seq.pasos }).eq("id",seq.id);
      btn.disabled=false; btn.textContent=old;
      if(error){ toast(error.message,true); return; }
      toast("Pasos guardados ✓");
    };
  };
  renderSlots();
}


// Sube un archivo y lo agrega a config.ia_multimedia (multimedia que la IA
// enviará sola). Reusa la Edge Function media-upload igual que pickMedia.
// Sube un archivo y lo agrega a `arr` con un tag único. `tagBase` opcional fija
// el prefijo del tag (ej. "atr_talla" para la multimedia de un atributo).
function pickMediaTo(kind, arr, onDone, syncCfg, tagBase){
  const accept={image:"image/*",video:"video/*",document:"*/*"}[kind]||"*/*";
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    toast("Subiendo…");
    try{
      const dataURL=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
      const { data,error }=await supa.functions.invoke("media-upload",{ body:{ channel_id:st.channelId, filename:file.name, content_type:file.type, data:dataURL } });
      if(error||!data?.url){ toast("No se pudo subir el archivo",true); return; }
      const base=String(tagBase||(file.name||"archivo").replace(/\.[^.]+$/,"")).replace(/[^\w-]/g,"").toLowerCase().slice(0,20)||"archivo";
      let tag=base, n=2; while(arr.some(x=>x.tag===tag)) tag=base+"_"+n++;
      arr.push({ tag, media_kind:data.kind||kind, media_url:data.url, mime:file.type, filename:file.name, descripcion:"" });
      if(syncCfg) syncCfg();
      toast("Archivo agregado ✓"); if(onDone) onDone();
    }catch(e){ toast("Error al subir",true); }
  };
  inp.click();
}
function pickProdMedia(kind, onDone, syncCfg){
  const arr=st.prod.config.ia_multimedia=st.prod.config.ia_multimedia||[];
  pickMediaTo(kind, arr, onDone, syncCfg);
}

// Catálogo de lo ofrecible como extra: toda Opción de compra ACTIVA y CON
// PRECIO del bot (de este producto o de cualquier otro). Lo usan la pestaña de
// Ventas extra y el generador de flujo (que puede correr sin haberla abierto).
async function cargarCatalogoExtras(){
  let { data:prods, error } = await supa.from("products")
    .select("id,nombre,emoji,tipo,clase,config,product_versions(id,nombre,precio,activo)")
    .eq("channel_id",st.channelId).order("nombre");
  if(error){ ({ data:prods } = await supa.from("products").select("id,nombre,emoji,tipo,config,product_versions(id,nombre,precio,activo)").eq("channel_id",st.channelId).order("nombre")); }
  const cat=[];
  (prods||[]).forEach(p=>{
    // ¿Este extra FÍSICO lleva tallas/variantes con stock? Si sí, el flujo debe
    // preguntar la talla al aceptarlo (para enviar la variante correcta y
    // descontar SU stock). Espeja la condición del motor (engine.ts: físico +
    // config.stock + atributos con valores → bump.stock_pendiente).
    const atrsX=Array.isArray(p.config&&p.config.atributos)?p.config.atributos.filter(a=>a&&a.nombre&&String(a.valores||"").trim()):[];
    const stockOkX=p.config&&p.config.stock&&typeof p.config.stock==="object"&&!Array.isArray(p.config.stock);
    const tieneTallas=(p.tipo==="fisico")&&atrsX.length>0&&!!stockOkX;
    (p.product_versions||[]).forEach(v=>{
      if(v.activo!==false && v.precio!=null && v.precio!=="")
        cat.push({ id:v.id, label:`${p.emoji?p.emoji+" ":""}${p.nombre} · ${v.nombre} — S/ ${v.precio}`, precio:v.precio, tipo:p.tipo||"digital", esExtra:p.clase==="extra", tieneTallas,
          nombreProd:p.nombre, contexto:(p.config&&p.config.contexto_producto)||"" });
    });
  });
  st.extraCat=cat;
  return cat;
}

// Cadena de ventas extra "ride-along" para pedidos FÍSICOS: el extra NO se cobra
// aparte, se suma al mismo envío (sube el saldo; el adelanto no cambia). Ofrecer
// → si acepta (la IA lee el texto libre, sin botones) → sumar al pedido →
// siguiente; si rechaza o no contesta → se corta la cadena y sale por exitNode.
async function buildRideAlongExtras(N, E, entryNode, exitNode, extras, cat, esperaSeg, baseY){
  let prevExit=entryNode;
  for(let i=0;i<extras.length;i++){
    const x=extras[i];
    const info=cat.find(c=>c.id===x.version_id);
    const precio=info?.precio ?? "";
    const label=info?info.label:`Extra ${i+1}`;
    // Un extra DIGITAL viaja igual ride-along (se cobra junto), pero su link se
    // entrega recién cuando el pedido queda pagado del todo (motor:
    // entregarExtrasDigitales). El bump lleva version_id + digital para saberlo.
    const esDigital=(info?.tipo==="digital");
    const y=baseY + i*300;
    const nOfr=await N("mensaje",`Ofrecer extra ${i+1}`,{ bubbles:[{ text:x.mensaje||`¿Le sumas ${label}? Te lo mando junto 🎁` }] },false,1800,y);
    const nEsp=await N("pregunta",`Esperar respuesta (extra ${i+1})`,{ text:"", timeout_seg:esperaSeg },false,2080,y);
    const nClas=await N("ia",`¿Lo quiere? (extra ${i+1})`,{
      operacion:"clasificar", guardar_en:`extraf_${i+1}_resp`, default:"duda", umbral:0.6,
      que:"Qué dice el cliente sobre sumar el producto adicional a su pedido",
      opciones:[
        { clave:"acepta", label:"Acepta", detalle:"Dice que sí, que se lo sume, lo quiere" },
        { clave:"rechaza", label:"Rechaza", detalle:"Dice que no, que solo lo que pidió, que no le interesa" },
        { clave:"duda", label:"Duda o pregunta", detalle:"Pide más info, no decide todavía" },
      ],
    },false,2360,y);
    const nCond=await N("condicion",`¿Aceptó? (extra ${i+1})`,{
      rutas:[
        { nombre:"Acepta", handle:"ruta:acepta", match:"todas", condiciones:[{op:"campo_igual",campo:`extraf_${i+1}_resp`,valor:"acepta"}] },
        { nombre:"Rechaza", handle:"ruta:rechaza", match:"todas", condiciones:[{op:"campo_igual",campo:`extraf_${i+1}_resp`,valor:"rechaza"}] },
      ],
    },false,2640,y);
    const nAdd=await N("accion",`Sumar extra ${i+1}`,{
      acciones:[
        { tipo:"actualizar_pedido", bump:{ nombre:label, precio:String(precio), sube_saldo:true, version_id:x.version_id, ...(esDigital?{ digital:true }:{}) } },
        { tipo:"notify_admin", una_vez:`extraf_${x.version_id}`, plantilla:"venta_extra",
          datos:{ extra:`${label} (${esDigital?"digital":"físico"}, va en el mismo envío)`, monto:String(precio) } },
      ],
    },false,2920,y);
    const nConfE=await N("mensaje",`Confirmar extra ${i+1}`,{ bubbles:[{ text: esDigital?`¡Listo! Te lo sumo al pedido 🎉 Apenas se complete el pago te mando el acceso.`:`¡Genial! Te lo sumo al pedido 🎉 Lo pagas junto con el resto.` }] },false,3200,y);
    const nResp=await N("ia",`Responder sobre el extra ${i+1}`,{
      operacion:"generar_texto", enviar:true, usar_conocimiento:true, detectar_opcion:false,
      prompt:`El cliente está viendo una oferta para SUMAR ${label} a su pedido (se envía y cobra junto con lo que ya pidió). Responde su duda de forma breve y sin presionar; si quiere, dile que se lo sumas al mismo envío.`,
    },false,2640,y+140);

    await E(prevExit,"continuar",nOfr);
    await E(nOfr,"continuar",nEsp);
    await E(nEsp,"timeout",exitNode);        // no contestó → sigue sin el extra
    await E(nEsp,"continuar",nClas);
    await E(nClas,"exito",nCond);
    await E(nCond,"ruta:rechaza",exitNode);  // corta TODA la cadena
    await E(nCond,"si_no_cumple",nResp);     // duda → responder → escuchar
    await E(nResp,"exito",nEsp);
    await E(nCond,"ruta:acepta",nAdd);
    // Extra FÍSICO con tallas/variantes: al sumarlo, el motor deja el bump
    // stock_pendiente, así que hay que PREGUNTAR su talla (para enviar la
    // variante correcta y descontar SU stock). Antes se saltaba directo al
    // mensaje fijo "te lo sumo" — un mensaje FIJO no es turno de IA, así que la
    // talla nunca se preguntaba y su stock no bajaba. Insertamos: pedir talla →
    // escuchar (con timeout, no colgar) → capturar (la IA la extrae y
    // reconciliarStockExtras descuenta) → confirmar. Extras sin tallas / digitales
    // siguen con el mensaje fijo directo.
    const preguntarTalla = !esDigital && !!(info && info.tieneTallas);
    if(preguntarTalla){
      const nAskT=await N("ia",`Pedir talla del extra ${i+1}`,{
        operacion:"generar_texto", enviar:true, usar_conocimiento:true, detectar_opcion:false,
        prompt:`El cliente aceptó sumar ${label} a su pedido. Como ${label} viene en tallas/variantes, pregúntale con naturalidad cuál quiere para enviarle la correcta. Una sola pregunta, breve. No repreguntes datos que ya tienes.`,
      },false,3200,y);
      const nEspT=await N("pregunta",`Esperar talla del extra ${i+1}`,{ text:"", timeout_seg:esperaSeg },false,3480,y);
      const nCapT=await N("ia",`Anotar talla del extra ${i+1}`,{
        operacion:"generar_texto", enviar:true, usar_conocimiento:true, detectar_opcion:false,
        prompt:`El cliente acaba de indicar la talla/variante de ${label}. Responde SOLO con un OK muy corto (ej. «¡Anotado! 👍»). No vuelvas a preguntar.`,
      },false,3760,y);
      await E(nAdd,"continuar",nAskT);
      await E(nAskT,"exito",nEspT);
      await E(nEspT,"continuar",nCapT);
      await E(nEspT,"timeout",nConfE);   // no dio talla → igual confirma la suma
      await E(nCapT,"exito",nConfE);
    }else{
      await E(nAdd,"continuar",nConfE);
    }
    prevExit=nConfE;                          // el siguiente ofrecimiento cuelga de acá
  }
  await E(prevExit,"continuar",exitNode);
}

// Catálogo de productos de clase "regalo" (todas sus versiones activas, sin
// importar precio — un regalo vale 0). Alimenta el selector de "Regalo con la compra".
async function cargarCatalogoRegalos(){
  let { data:prods } = await supa.from("products")
    .select("id,nombre,emoji,tipo,clase,config,product_versions(id,nombre,activo)")
    .eq("channel_id",st.channelId).eq("clase","regalo").order("nombre");
  const cat=[];
  (prods||[]).forEach(p=>(p.product_versions||[]).forEach(v=>{
    if(v.activo!==false) cat.push({ version_id:v.id, product_id:p.id, tipo:p.tipo||"digital",
      nombre:`${p.emoji?p.emoji+" ":""}${p.nombre}${v.nombre&&v.nombre!=="Estándar"?" · "+v.nombre:""}`,
      desc:(p.config&&p.config.regalo_desc)||"" });
  }));
  st.regCat=cat; return cat;
}
function paintRegalos(){
  const cfg=st.prod.config; const cat=st.regCat||[]; const box=$("regList"); if(!box) return;
  box.innerHTML="";
  if(!cfg.regalos.length){ box.innerHTML=`<div style="font-size:12px;color:var(--faint)">Sin regalo por ahora.</div>`; return; }
  cfg.regalos.forEach((r,i)=>{
    // Refresca desde el catálogo (nombre/tipo/descripción actuales del regalo) para
    // que la descripción que ve la IA no quede vieja si se editó en el regalo.
    const cur=cat.find(x=>x.version_id===r.version_id);
    if(cur) cfg.regalos[i]=r={ version_id:cur.version_id, product_id:cur.product_id, nombre:cur.nombre, tipo:cur.tipo, desc:cur.desc };
    const row=document.createElement("div"); row.style.cssText="display:flex;gap:8px;align-items:center;margin-bottom:8px";
    const sel=document.createElement("select"); sel.className="in"; sel.style.flex="1";
    sel.innerHTML=cat.map(c=>`<option value="${esc(c.version_id)}" ${c.version_id===r.version_id?"selected":""}>${esc(c.nombre)} · ${c.tipo==="fisico"?"físico":"digital"}</option>`).join("");
    sel.onchange=()=>{ const c=cat.find(x=>x.version_id===sel.value); if(c) cfg.regalos[i]={ version_id:c.version_id, product_id:c.product_id, nombre:c.nombre, tipo:c.tipo, desc:c.desc }; };
    const del=document.createElement("button"); del.className="btn"; del.textContent="Quitar"; del.onclick=()=>{ cfg.regalos.splice(i,1); paintRegalos(); };
    row.appendChild(sel); row.appendChild(del); box.appendChild(row);
  });
}

                   + (pr.length?`<optgroup label="Productos principales">${pr.map(opt).join("")}</optgroup>`:""); })()}
          </select></div>
        <button class="iconbtn exu" style="flex:0 0 auto;margin-bottom:6px" title="Subir">▲</button>
        <button class="iconbtn exd" style="flex:0 0 auto;margin-bottom:6px" title="Bajar">▼</button>
        <button class="iconbtn exdel" style="flex:0 0 auto;margin-bottom:6px">${icon("trash")}</button>
      </div>
      <label style="margin-top:12px">Mensaje del ofrecimiento</label>
      <textarea class="in exm" rows="3" style="min-height:70px;line-height:1.5;font-family:var(--font);resize:vertical"
        placeholder="Ej. ¡Antes de enviarte todo! 🎁 ¿Le sumas los Planos Premium por solo S/ 49? Te los mando junto con tu curso.">${esc(x.mensaje||"")}</textarea>`;
    el.querySelector(".exv").onchange=(e)=>{ x.version_id=e.target.value; };
    el.querySelector(".exm").oninput=(e)=>{ x.mensaje=e.target.value; };
    el.querySelector(".exdel").onclick=()=>{ cfg.extras.splice(i,1); paintExtras(); };
    el.querySelector(".exu").onclick=()=>{ if(i===0)return; [cfg.extras[i-1],cfg.extras[i]]=[cfg.extras[i],cfg.extras[i-1]]; paintExtras(); };
    el.querySelector(".exd").onclick=()=>{ if(i>=cfg.extras.length-1)return; [cfg.extras[i+1],cfg.extras[i]]=[cfg.extras[i],cfg.extras[i+1]]; paintExtras(); };
    box.appendChild(el);
  });
}
