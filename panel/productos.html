<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nodo.theme")||"dark"}catch(e){}</script>
<title>Nodo · Productos</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
<link rel="stylesheet" href="shell.css" />
<style>
  :root{
    --bg:#0e1116; --surface:#151a21; --surface-2:#1b222c; --border:#232b36;
    --text:#e7ecf2; --muted:#8a97a8; --faint:#5c6675;
    --brand:#2b7fff; --brand-2:#1e6ff0; --brand-bg:#12233f;
    --green:#22c079; --green-bg:#10281d; --amber:#f0a92b; --red:#e2564a;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .pcard .c-tt{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
  /* Hub "Inicio": fases clickeables */
  .ini-ph{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:14px}
  .ini-ph-hd{display:flex;align-items:center;gap:12px;padding:12px 12px 10px;cursor:pointer;border-radius:10px}
  .ini-ph-hd:hover{background:var(--surface-2)}
  .ini-ph-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-bg,rgba(43,127,255,.12));color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .ini-ph-tt{font-weight:700;font-size:15px}
  .ini-ph-sub{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.4}
  .ini-ph-prog{flex:none;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:2px 10px}
  .ini-items{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px}
  .ini-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:none;border-radius:9px;padding:10px;cursor:pointer;font:inherit;color:var(--text)}
  .ini-item:hover{background:var(--surface-2)}
  .ini-item-nm{font-size:13.5px;font-weight:600;flex:none}
  .ini-item-msg{font-size:12px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ini-chev{flex:none;color:var(--faint);font-size:18px;line-height:1}
  .ini-ico{flex:none;width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .ini-ico svg{width:17px;height:17px}
  .ini-ico.done{background:rgba(34,192,121,.14);border-color:rgba(34,192,121,.32);color:var(--green,#22c079)}
  .ini-item{transition:background .12s}
  .ini-item:hover .ini-chev{color:var(--brand)}
  /* Sección COMPLETADA: brilla en el color de SU grupo. Las pendientes van neutras.
     Tu producto = verde · Tu venta = violeta IA · Opcionales = dorado.
     Base = tema OSCURO (tinte + aro interior de color + glow para que resalte
     sobre la superficie oscura). El tema claro lo suaviza más abajo. */
  .ini-item.ok-green{background:rgba(34,192,121,.15);box-shadow:inset 0 0 0 1px rgba(34,192,121,.30),0 0 16px -5px rgba(34,192,121,.60)}
  .ini-item.ok-green:hover{background:rgba(34,192,121,.22)}
  .ini-item.ok-ia{background:rgba(168,85,247,.17);box-shadow:inset 0 0 0 1px rgba(168,85,247,.34),0 0 16px -5px rgba(168,85,247,.65)}
  .ini-item.ok-ia:hover{background:rgba(168,85,247,.24)}
  .ini-item.ok-gold{background:rgba(230,168,20,.16);box-shadow:inset 0 0 0 1px rgba(230,168,20,.36),0 0 16px -5px rgba(230,168,20,.60)}
  .ini-item.ok-gold:hover{background:rgba(230,168,20,.23)}
  /* Tema CLARO: sobre superficie blanca el tinte ya se lee, sin glow; solo el aro define. */
  html[data-theme="light"] .ini-item.ok-green{background:rgba(34,192,121,.10);box-shadow:inset 0 0 0 1px rgba(34,192,121,.28)}
  html[data-theme="light"] .ini-item.ok-green:hover{background:rgba(34,192,121,.16)}
  html[data-theme="light"] .ini-item.ok-ia{background:rgba(168,85,247,.10);box-shadow:inset 0 0 0 1px rgba(168,85,247,.30)}
  html[data-theme="light"] .ini-item.ok-ia:hover{background:rgba(168,85,247,.16)}
  html[data-theme="light"] .ini-item.ok-gold{background:rgba(230,168,20,.13);box-shadow:inset 0 0 0 1px rgba(230,168,20,.34)}
  html[data-theme="light"] .ini-item.ok-gold:hover{background:rgba(230,168,20,.20)}
  /* Caja del emoji del encabezado: blanca en claro (se despega), superficie
     elevada en oscuro (evita el cuadrado blanco chillón). */
  .emoji-head{background:var(--surface-2)}
  html[data-theme="light"] .emoji-head{background:#fff}
  /* Nombre editable inline en el encabezado del hub */
  .hdr-name{cursor:text;border-radius:7px;padding:1px 5px;margin-left:-5px;transition:background .12s}
  .hdr-name:hover{background:var(--surface-2)}
  #emojiBtn{transition:transform .1s}
  #emojiBtn:hover{transform:scale(1.04)}
  /* Acordeón: cada fila del hub despliega su sección debajo (varias a la vez) */
  .acc-hd .ini-chev{transition:transform .18s}
  .acc.open>.acc-hd .ini-chev{transform:rotate(90deg);color:var(--brand)}
  .acc-body{display:none}
  .acc.open>.acc-body{display:block;padding:8px 6px 14px;animation:accIn .28s cubic-bezier(.22,.61,.36,1)}
  @keyframes accIn{from{opacity:0;transform:translateY(-10px) scale(.99)}to{opacity:1;transform:none}}
  .acc-hd{transition:background .15s}
  .acc-body .card:last-child{margin-bottom:0}
  .acc-body>.hint:first-child{margin-top:0}
  /* Cabecera de sección (sin barra de pestañas) */
  .pdet-h1{margin:0 0 18px;font-size:23px;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:10px}
  .pdet-xbadge{font-size:11px;font-weight:700;color:#0e9f6e;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.35);padding:3px 10px;border-radius:20px}
  .pdet-secbar{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .pdet-back{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;padding:8px 13px 8px 10px;border-radius:10px;cursor:pointer;transition:border-color .12s,color .12s}
  .pdet-back:hover{border-color:var(--brand);color:var(--brand)}
  .pdet-back svg{width:16px;height:16px}
  .pdet-crumb{font-size:13.5px;color:var(--muted);font-weight:600}
  .pdet-crumb-sep{color:var(--faint)}
  .pdet-crumb-cur{font-size:17px;font-weight:700;letter-spacing:-.2px}
  /* Poner a vender: tarjeta destacada */
  .sell-card{border:1.5px solid var(--brand-border,rgba(43,127,255,.35))!important;background:linear-gradient(180deg,rgba(43,127,255,.05),transparent 60%),var(--surface)}
  .sell-hd{display:flex;align-items:center;gap:10px;margin-bottom:2px}
  .sell-ico{flex:none;width:34px;height:34px;border-radius:10px;background:var(--brand-bg,rgba(43,127,255,.12));color:var(--brand);display:flex;align-items:center;justify-content:center}
  .sell-ico svg{width:19px;height:19px}
  .sell-tt{font-weight:700;font-size:16px;letter-spacing:-.1px}
  /* Asistente "Armar con IA": botón flotante + drawer lateral */
  .armfab{position:fixed;right:22px;bottom:22px;z-index:80;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;border:none;border-radius:26px;background:linear-gradient(90deg,var(--ia1,#a855f7),var(--ia2,#ec4899));color:#fff;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 8px 24px rgba(168,85,247,.35)}
  .armfab svg{width:19px;height:19px}
  .armfab:hover{filter:brightness(1.06)}
  .armov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);display:none}
  .armov.on{display:block}
  .armdr{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.3)}
  .armhd{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px}
  .armhd .gl{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(135deg,var(--ia1,#a855f7),var(--ia2,#ec4899));color:#fff;display:flex;align-items:center;justify-content:center}
  .armhd .gl svg{width:18px;height:18px}
  .armbody{flex:1;overflow-y:auto;padding:16px 18px}
  .armft{padding:12px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
  .armchip{font-size:12px;border:1px solid var(--border);border-radius:20px;padding:6px 11px;color:var(--muted);cursor:pointer;background:transparent}
  .armchip:hover{border-color:var(--ia1,#a855f7);color:var(--ia1,#a855f7)}
  .armhero{border:1px solid var(--ia-brd,rgba(168,85,247,.4));background:radial-gradient(120% 140% at 0% 0%,rgba(168,85,247,.12),transparent 60%),var(--surface);border-radius:14px;padding:15px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center}
  .armhero .hg{width:38px;height:38px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--ia1,#a855f7),var(--ia2,#ec4899));color:#fff;display:flex;align-items:center;justify-content:center}
  .armhero .hg svg{width:20px;height:20px}
  .hint{color:var(--muted);font-size:12.5px;line-height:1.55}
  label{display:block;font-size:11.5px;color:var(--muted);margin:16px 0 6px;font-weight:700}
  .in,.ta{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:13.5px;outline:none;font-family:var(--font)}
  .ta{min-height:90px;font-family:monospace;font-size:12px}
  .sel{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);height:40px;padding:0 12px;font-size:13.5px;outline:none}
  .in:focus,.ta:focus{border-color:var(--brand)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .card h4{margin:0 0 4px;font-size:14px;font-weight:700}
  .row{display:flex;gap:12px;align-items:center} .row>*{flex:1}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:14px}
  .flowrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}
  .badge{font-size:10px;padding:3px 10px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-weight:700}
  .badge.on{background:var(--green-bg);color:var(--green);border-color:transparent}
  .linkbtn{font-size:12.5px;padding:6px 12px;border:1px solid var(--border);border-radius:9px;color:var(--text);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .ico{width:16px;height:16px;flex:none}
  .linkbtn .ico{width:14px;height:14px}
  #emojiBtn .ico{width:20px;height:20px}
  .nodo-pill .ico{width:12px;height:12px;vertical-align:-1px;margin-right:3px}
  .nodo-folder .ico{width:13px;height:13px;vertical-align:-2px;margin-right:4px}
  h4 .ico{width:15px;height:15px;vertical-align:-2px;margin-right:5px}
  .empty{color:var(--faint);text-align:center;padding:40px}
  .sw{position:relative;width:38px;height:22px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);flex:none;cursor:pointer;transition:.15s}
  .sw.on{background:var(--green,#22c079);border-color:var(--green,#22c079)}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
  .sw.on::after{transform:translateX(16px)}
  .iconbtn{width:30px;height:30px;flex:none;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .iconbtn:hover{color:var(--text);border-color:var(--brand)}
  .btn{height:40px;padding:0 16px;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13.5px;font-weight:600}
  .btn.primary{background:var(--brand);border:none;color:#fff} .btn.primary:hover{background:var(--brand-2)}
  /* Eliminar producto: acción destructiva que NO debe competir con "Guardar".
     Ícono sutil en gris; solo se pone rojo al pasar el mouse. */
  .del-btn{width:40px;height:40px;flex:none;border-radius:11px;border:1px solid var(--border);background:transparent;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .del-btn:hover{color:var(--red,#e2564a);border-color:var(--red,#e2564a);background:rgba(226,86,74,.09)}
  .del-btn svg{width:17px;height:17px}

  /* ══ Identidad de la sección IA (violeta/fucsia) — pestaña "Cómo lo vende la IA" ══
     Mismo sello que la sección IA y el IA Router (gradiente a855f7→ec4899 + robot). */
  :root{ --ia1:#a855f7; --ia2:#ec4899; --ia-bg:rgba(168,85,247,.14); --ia-brd:rgba(168,85,247,.42); }
  /* Cabecera de identidad del panel (glyph robot en gradiente) */
  .ia-hd{display:flex;align-items:flex-start;gap:12px;margin:2px 0 16px}
  .ia-hd .glyph{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--ia1),var(--ia2));color:#fff;
    box-shadow:0 8px 20px -6px rgba(168,85,247,.6),inset 0 1px 0 rgba(255,255,255,.25)}
  .ia-hd .glyph svg{width:19px;height:19px}
  .ia-hd .tt{font-size:15px;font-weight:750;letter-spacing:-.01em;
    background:linear-gradient(90deg,var(--ia1),var(--ia2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .ia-hd .ds{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .ia-hd .ds a{color:var(--ia1)}
  /* Tarjeta del pane IA: borde + nebulosa sutil violeta sobre el glass (ID gana al glass !important) */
  #tabBody .ia-card{
    border-color:var(--ia-brd)!important;
    background:
      radial-gradient(130% 130% at 0% 0%, rgba(168,85,247,.12), transparent 55%),
      radial-gradient(130% 130% at 100% 100%, rgba(236,72,153,.08), transparent 55%),
      var(--glass,var(--surface))!important;
    box-shadow:0 10px 34px -14px rgba(168,85,247,.4);
  }
  .ia-card .in:focus,.ia-card .ta:focus,.ia-card textarea:focus,.ia-card .sel:focus{
    border-color:var(--ia1);box-shadow:0 0 0 3px var(--ia-bg)}
  /* Hub de Ángulos */
  .hub-prod{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px}
  .hub-prod-hd{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .hub-prod-em{flex:none;width:40px;height:40px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:21px}
  .hub-prod-nm{font-weight:750;font-size:16px;letter-spacing:-.2px}
  .hub-prod-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .hub-count{flex:none;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 11px}
  .hub-ang{border:1px solid var(--border);border-radius:11px;padding:12px;margin-top:10px;background:var(--surface-2)}
  .hub-ang.dup{border-color:var(--amber);box-shadow:inset 0 0 0 1px rgba(240,169,43,.3)}
  .hub-warn{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--amber);background:rgba(240,169,43,.08);border:1px solid rgba(240,169,43,.28);border-radius:10px;padding:10px 12px;line-height:1.5;margin-top:10px}
  .hub-warn svg{width:15px;height:15px;flex:none;margin-top:1px}
  .hub-empty-ads{font-size:11.5px;color:var(--faint);margin-top:8px}
  .ad-chip2{display:inline-flex;align-items:center;gap:6px;background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:20px;padding:3px 6px 3px 11px;font-size:12px;color:var(--brand-2)}
  .ad-chip2.dup{background:rgba(240,169,43,.14);border-color:rgba(240,169,43,.4);color:var(--amber)}
  /* Campo "Gancho para la IA": destacado con el color/diseño de la sección IA */
  .ia-gancho{margin-top:9px;border:1px solid var(--ia-brd);border-radius:11px;padding:10px 11px;
    background:radial-gradient(130% 140% at 0% 0%,rgba(168,85,247,.12),transparent 58%),var(--surface)}
  .ia-gancho-hd{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
  .ia-gancho-gl{width:22px;height:22px;flex:none;border-radius:6px;display:grid;place-items:center;font-size:13px;line-height:1;
    background:linear-gradient(135deg,var(--ia1),var(--ia2));box-shadow:0 3px 8px -3px rgba(168,85,247,.6)}
  .ia-gancho-gl svg{width:12px;height:12px}
  .ia-gancho-tt{font-size:11.5px;font-weight:800;letter-spacing:-.01em;
    background:linear-gradient(90deg,var(--ia1),var(--ia2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .ia-gancho-ds{font-size:10.5px;color:var(--muted)}
  .ia-in{width:100%;background:var(--surface-2)}
  .ia-in:focus{border-color:var(--ia1);box-shadow:0 0 0 3px var(--ia-bg)}
</style>
</head>
<body>
<div class="nodo-page">
  <div class="nodo-wrap">
    <!-- VISTA TARJETAS -->
    <div id="gridView">
      <div class="nodo-head">
        <div class="grow">
          <h1 class="nodo-title">Productos</h1>
          <p class="nodo-lead">Tu catálogo de productos digitales y físicos. Cada producto define sus versiones, precios, entrega o envío, y los flujos que lo venden.</p>
        </div>
        <div class="nodo-actions">
          <button class="nodo-btn primary" id="addProduct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg> Nuevo producto</button>
        </div>
      </div>
      <div id="gvToggle" style="display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;margin:0 0 16px"></div>
      <div id="pSearchWrap" style="position:relative;max-width:340px;margin:0 0 13px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint);pointer-events:none"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="pSearch" placeholder="Buscar producto…" autocomplete="off" style="width:100%;height:40px;background:var(--surface);border:1px solid var(--border);border-radius:11px;color:var(--text);padding:0 12px 0 36px;font-size:13.5px;outline:none;font-family:inherit"/>
      </div>
      <div id="claseSeg" style="display:inline-flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;margin:0 0 14px"></div>
      <div class="nodo-folders" id="folders"></div>
      <div class="nodo-cards" id="cards"></div>
      <div id="angHub" style="display:none"></div>
    </div>
    <!-- VISTA DETALLE -->
    <div id="detailView" style="display:none">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <button class="nodo-back" id="backBtn" style="margin-bottom:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver a productos</button>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="del-btn" id="delBtn" title="Eliminar producto" aria-label="Eliminar producto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg></button>
          <button class="btn primary" id="saveBtn">Guardar cambios</button>
        </div>
      </div>
      <div id="detail" style="margin-top:18px"></div>
    </div>
  </div>
</div>

<button class="armfab" id="armFab" style="display:none">

// ── Hub de Ángulos: todos los productos principales + sus ángulos y anuncios en
//    un solo lugar. Comparte la tabla `angulos` con el editor por-producto de
//    "Cómo llegan" (mismos campos/slug/guardado), así no divergen. ──
const HUB_WARN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
async function loadAngHub(){
  const host=$("angHub"); if(!host) return;
  host.innerHTML=`<div class="empty">Cargando ángulos…</div>`;
  const gen=(st.hubGen=(st.hubGen||0)+1);
  const prods=(st.list||[]).filter(p=>p.clase!=="extra"&&p.clase!=="regalo");
  let angs=[], angOk=true, adsMeta=[];
  try{
    const { data, error }=await supa.from("angulos").select("id,product_id,nombre,slug,ad_ids,gancho_ia,orden").eq("channel_id",st.channelId).order("orden");
    if(error) throw error;
    angs=(data||[]).map(a=>({...a, ad_ids:Array.isArray(a.ad_ids)?a.ad_ids.map(String):[]}));
  }catch(_){ angOk=false; }
  try{
    const { data }=await supa.from("ads_meta").select("ad_id,ad_name,campaign_name").eq("channel_id",st.channelId).order("campaign_name");
    adsMeta=(data||[]).map(m=>({...m, ad_id:String(m.ad_id)}));
  }catch(_){ adsMeta=[]; }
  if(gen!==st.hubGen) return;
  const byProd={}, orig={};
  prods.forEach(p=>{ byProd[p.id]=[]; });
  angs.forEach(a=>{ (byProd[a.product_id]=byProd[a.product_id]||[]).push(a); });
  prods.forEach(p=>{ orig[p.id]=(byProd[p.id]||[]).map(a=>a.id).filter(Boolean); });
  st.hub={ prods, byProd, adsMeta, angOk, orig };
  renderAngHub();
}
function renderAngHub(){
  const host=$("angHub"); if(!host||!st.hub) return;
  const { prods, byProd, adsMeta, angOk }=st.hub;
  const adName=(id)=>{ const m=adsMeta.find(x=>x.ad_id===String(id)); return m?(m.ad_name||m.ad_id):id; };
  let html=`<div class="card" style="display:flex;gap:12px;align-items:flex-start;margin-bottom:16px">
    <span style="font-size:26px;line-height:1">🎯</span>
    <div><div style="font-weight:750;font-size:15px;letter-spacing:-.2px">Ángulos de tus anuncios</div>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:3px">Un <b>ángulo</b> agrupa los anuncios que atacan la misma idea (ej. “Dolor / calambres”). Cuando un cliente llega desde uno de esos anuncios —aunque no escriba tu palabra clave— el bot lo rutea al producto correcto y lo saluda con el mensaje de ese ángulo.</div></div>
  </div>`;
  if(!angOk){ host.innerHTML=html+`<div class="hub-warn">${HUB_WARN}Para usar los ángulos falta aplicar la migración <b>0063</b> en la base de datos.</div>`; return; }
  if(!prods.length){ host.innerHTML=html+`<div class="nodo-empty"><p>Aún no tienes productos principales. Crea uno en el Catálogo para configurar sus ángulos.</p></div>`; return; }
  // Colisiones: un mismo anuncio en 2+ ángulos hace el ruteo ambiguo.
  const adMap={};
  prods.forEach(p=> (byProd[p.id]||[]).forEach(a=> (a.ad_ids||[]).forEach(id=>{ (adMap[id]=adMap[id]||[]).push({ ang:a.nombre||a.slug||"(sin nombre)" }); })));
  const dups=Object.entries(adMap).filter(([,arr])=>arr.length>1);
  const dupIds=new Set(dups.map(([id])=>id));
  if(dups.length){
    html+=`<div class="hub-warn" style="margin-bottom:14px">${HUB_WARN}<div><b>Anuncios repetidos en varios ángulos.</b> El bot rutea al primero que encuentre; conviene que cada anuncio viva en un solo ángulo:${dups.map(([id,arr])=>`<div style="margin-top:4px;color:var(--text)">· <span class="mono">${esc(adName(id))}</span> → ${arr.map(x=>esc(x.ang)).join(" · ")}</div>`).join("")}</div></div>`;
  }
  prods.forEach(p=>{
    const angs=byProd[p.id]||[];
    const nAds=angs.reduce((s,a)=>s+(a.ad_ids||[]).length,0);
    const em = p.emoji ? esc(p.emoji) : "📦";
    html+=`<div class="hub-prod" data-prod="${p.id}">
      <div class="hub-prod-hd">
        <div class="hub-prod-em">${em}</div>
        <div style="flex:1;min-width:0"><div class="hub-prod-nm">${esc(p.nombre)}</div><div class="hub-prod-sub">${angs.length?`${angs.length} ángulo${angs.length>1?"s":""} · ${nAds} anuncio${nAds!==1?"s":""}`:"Sin ángulos todavía"}</div></div>
        <span class="hub-count">${angs.length}</span>
      </div>`;
    if(!angs.length){
      html+=`<div class="hub-warn">${HUB_WARN}Este producto no tiene ángulos: un cliente que llegue de un anuncio suyo sin escribir la palabra clave caerá en el menú de respaldo o en la IA. Agrega al menos uno.</div>`;
    }
    angs.forEach((a,ai)=>{
      const adsUI = adsMeta.length
        ? `<div style="font-size:11px;color:var(--muted);margin:9px 0 5px">Anuncios de este ángulo</div><div style="max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);border-radius:8px;padding:8px">${adsMeta.map(m=>`<label style="display:flex;gap:7px;align-items:center;font-size:12.5px;cursor:pointer"><input type="checkbox" class="hub-ad-ck" value="${esc(m.ad_id)}"${(a.ad_ids||[]).includes(m.ad_id)?" checked":""}/> <span>${esc(m.ad_name||m.ad_id)}${m.campaign_name?` <span style="color:var(--faint)">· ${esc(m.campaign_name)}</span>`:''}${dupIds.has(m.ad_id)&&(a.ad_ids||[]).includes(m.ad_id)?` <span style="color:var(--amber);font-size:11px">· repetido</span>`:''}</span></label>`).join("")}</div>`
        : `<div style="font-size:11px;color:var(--muted);margin:9px 0 5px">Anuncios de este ángulo — pega el <b>ID</b> y Enter. <span style="color:var(--faint)">(Conecta Meta Ads en Ajustes para elegirlos por su nombre.)</span></div>
           <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:7px;min-height:38px;background:var(--surface)">
             ${(a.ad_ids||[]).map(id=>`<span class="ad-chip2${dupIds.has(id)?" dup":""}"><span class="mono">${esc(id)}</span><button class="hub-ad-x" data-id="${esc(id)}" title="Quitar" style="border:0;background:transparent;color:inherit;cursor:pointer;font-size:13px;line-height:1;padding:0;opacity:.7">✕</button></span>`).join("")}
             <input class="hub-ad-in" style="border:0;outline:none;background:transparent;font-size:12.5px;flex:1;min-width:150px;color:var(--text);height:24px" placeholder="Pega un ID y Enter"/>
           </div>`;
      html+=`<div class="hub-ang${(a.ad_ids||[]).some(id=>dupIds.has(id))?" dup":""}" data-pid="${p.id}" data-ai="${ai}">
        <div style="display:flex;gap:8px;align-items:center">
          <input class="in hub-nombre" style="flex:1;font-weight:600" placeholder="Nombre del ángulo (ej. Dolor / calambres)" value="${esc(a.nombre||'')}"/>
          <button class="iconbtn hub-del" title="Eliminar ángulo">${icon("trash")}</button>
        </div>
        ${ganchoIAHtml(a.gancho_ia, "hub-gancho")}
        ${adsUI}
      </div>`;
    });
    html+=`<div style="display:flex;gap:10px;align-items:center;margin-top:12px">
        <button class="btn hub-add" style="height:34px;padding:0 13px;font-size:12.5px;background:transparent;border:1px dashed var(--border);color:var(--text)">＋ Ángulo</button>
        <button class="btn primary hub-save" style="height:34px;padding:0 16px;font-size:12.5px;margin-left:auto">Guardar</button>
      </div>
    </div>`;
  });
  host.innerHTML=html;

  host.querySelectorAll(".hub-prod").forEach(card=>{
    const pid=card.dataset.prod;
    card.querySelector(".hub-add").onclick=async()=>{
      hubHarvest();
      const nombre=await askText({title:"Nuevo ángulo", placeholder:"Ej. Dolor / calambres", confirmText:"Crear"});
      if(!nombre) return;
      (st.hub.byProd[pid]=st.hub.byProd[pid]||[]).push({ nombre, gancho_ia:"", ad_ids:[], slug:anguloSlug(nombre) });
      renderAngHub();
    };
    card.querySelector(".hub-save").onclick=()=>hubSaveProduct(pid);
  });
  host.querySelectorAll(".hub-ang[data-pid]").forEach(row=>{
    const pid=row.dataset.pid, ai=+row.dataset.ai;
    const a=(st.hub.byProd[pid]||[])[ai]; if(!a) return;
    row.querySelector(".hub-del").onclick=()=>{ hubHarvest(); st.hub.byProd[pid].splice(ai,1); renderAngHub(); };
    row.querySelectorAll(".hub-ad-ck").forEach(ck=> ck.onchange=()=>{
      hubHarvest(); a.ad_ids=a.ad_ids||[];
      if(ck.checked){ if(!a.ad_ids.includes(ck.value)) a.ad_ids.push(ck.value); }
      else a.ad_ids=a.ad_ids.filter(id=>id!==ck.value);
      renderAngHub();
    });
    const inp=row.querySelector(".hub-ad-in");
    if(inp) inp.onkeydown=(e)=>{
      if(e.key!=="Enter") return; e.preventDefault();
      const val=inp.value.trim(); if(!val) return; hubHarvest(); a.ad_ids=a.ad_ids||[];
      val.split(/[\s,]+/).map(x=>x.trim()).filter(Boolean).forEach(id=>{ if(!a.ad_ids.includes(id)) a.ad_ids.push(id); });
      renderAngHub(); const rows=host.querySelectorAll(`.hub-ang[data-pid="${pid}"][data-ai="${ai}"] .hub-ad-in`); if(rows[0]) rows[0].focus();
    };
    row.querySelectorAll(".hub-ad-x").forEach(btn=> btn.onclick=()=>{ hubHarvest(); a.ad_ids=(a.ad_ids||[]).filter(id=>id!==btn.dataset.id); renderAngHub(); });
  });
}
// Lee nombre+gancho de las filas del hub a memoria (los ad_ids ya se mantienen en memoria).
function hubHarvest(){
  if(!st.hub) return;
  document.querySelectorAll("#angHub .hub-ang[data-pid]").forEach(row=>{
    const a=(st.hub.byProd[row.dataset.pid]||[])[+row.dataset.ai]; if(!a) return;
    const nm=row.querySelector(".hub-nombre"); if(nm) a.nombre=nm.value.trim();
    const gn=row.querySelector(".hub-gancho"); if(gn) a.gancho_ia=gn.value.trim();
  });
}
// Persiste los ángulos de un producto (mismo upsert/delete que saveAngulos).
async function hubSaveProduct(pid){
  hubHarvest();
  const angs=(st.hub.byProd[pid]||[]).filter(a=>a.nombre);
  const usados=new Set();
  angs.forEach((a,i)=>{ let s=a.slug||anguloSlug(a.nombre); let base=s,n=2; while(usados.has(s)){ s=base+"-"+(n++); } usados.add(s); a.slug=s; a.orden=i; });
  try{
    for(const a of angs){
      const payload={ channel_id:st.channelId, product_id:pid, nombre:a.nombre, slug:a.slug, ad_ids:a.ad_ids||[], gancho_ia:a.gancho_ia||null, orden:a.orden };
      if(a.id){ const {error}=await supa.from("angulos").update(payload).eq("id",a.id); if(error) throw error; }
      else { const {data:ins,error}=await supa.from("angulos").insert(payload).select("id").single(); if(error) throw error; if(ins) a.id=ins.id; }
    }
    const vivos=new Set(angs.map(a=>a.id).filter(Boolean));
    for(const id of (st.hub.orig[pid]||[])){ if(!vivos.has(id)) await supa.from("angulos").delete().eq("id",id); }
    st.hub.byProd[pid]=angs; st.hub.orig[pid]=angs.map(a=>a.id);
    toast("Ángulos guardados ✓"); renderAngHub();
  }catch(e){ toast(e.message||"No se pudo guardar los ángulos",true); }
}
function showDetail(){ $("gridView").style.display="none"; $("detailView").style.display=""; window.scrollTo(0,0); /* el FAB lo controla renderDetail según si estás en el hub */ }

async function loadProducts(){
  const gen=(st.loadGen=(st.loadGen||0)+1); // anti-carrera al cambiar de bot
  // Las opciones de compra son la verdad: si un producto tiene más de una, ES
  // multi-opción. Ya no hace falta un checkbox aparte que lo declare.
  const full="id,nombre,config,folder,emoji,tipo,clase,product_versions(id,precio,activo)";
  let { data, error } = await supa.from("products").select(full).eq("channel_id",st.channelId).order("created_at");
  if(error){ ({ data, error } = await supa.from("products").select("id,nombre,config,folder,emoji,tipo").eq("channel_id",st.channelId).order("created_at")); }
  if(error){ ({ data } = await supa.from("products").select("id,nombre,config").eq("channel_id",st.channelId).order("created_at")); }
  if(gen!==st.loadGen) return; // otra carga (otro bot) la reemplazó
  st.list=data||[]; st.hub=null; // los productos cambiaron → recargar el hub de ángulos
  if(!Fbar){
    Fbar=await mountFolders({ el:$("folders"), tipo:"product", table:"products", channelId:st.channelId, items:()=>st.list, onChange:renderCards });
  } else if(Fbar.channelId()!==st.channelId){
    await Fbar.setChannel(st.channelId);
  } else {
    await Fbar.reload();
  }
  renderGvToggle(); applyGvMode();
}
// Opciones activas de un producto (para las tarjetas del grid).
function opcionesDe(p){ return (p.product_versions||[]).filter(v=>v.activo!==false); }
function renderCards(){
  // Control Todos / Principales / Extras (los extras son complementos de ventas extra).
  const esEx=(p)=>p.clase==="extra";
  const esReg=(p)=>p.clase==="regalo";
  const esPrin=(p)=>!esEx(p)&&!esReg(p);
  const counts={ todos:st.list.length, principal:st.list.filter(esPrin).length, extra:st.list.filter(esEx).length, regalo:st.list.filter(esReg).length };
  const segEl=$("claseSeg");
  if(segEl){
    const seg=(v,l)=>`<button data-clase="${v}" style="border:none;background:${st.claseFilter===v?'var(--brand)':'transparent'};color:${st.claseFilter===v?'#fff':'var(--muted)'};font:inherit;font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer">${l} <span style="opacity:.7">${counts[v]}</span></button>`;
    segEl.innerHTML=seg("todos","Todos")+seg("principal","Principales")+seg("extra","Extras")+(counts.regalo?seg("regalo","Regalos"):"");
    segEl.querySelectorAll("[data-clase]").forEach(b=> b.onclick=()=>{ st.claseFilter=b.dataset.clase; renderCards(); });
  }
  const sw=$("pSearchWrap"); if(sw) sw.style.display=st.list.length?"":"none";
  let list=st.list;
  if(st.claseFilter==="principal") list=list.filter(esPrin);
  else if(st.claseFilter==="extra") list=list.filter(esEx);
  else if(st.claseFilter==="regalo") list=list.filter(esReg);
  if(Fbar) list=Fbar.filter(list);
  const query=($("pSearch")?.value||"").trim().toLowerCase();
  if(query) list=list.filter(p=>(p.nombre||"").toLowerCase().includes(query));
  const box=$("cards");
  if(!st.list.length){
    box.innerHTML=`<div class="nodo-empty" style="grid-column:1/-1"><div class="e-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></div><h3>Aún no hay productos</h3><p>Crea tu primer producto para configurar sus versiones, precios y flujos de venta.</p></div>`;
    return;
  }
  if(!list.length){ box.innerHTML=`<div class="nodo-empty" style="grid-column:1/-1"><p>${query?`Nada coincide con “${esc(query)}”.`:"Sin productos en esta vista."}</p></div>`; return; }
  box.innerHTML="";
  list.forEach(p=>{
    const el=document.createElement("div"); el.className="nodo-card pcard";
    // El precio y el nº de opciones salen de las Opciones de compra reales.
    const ops=opcionesDe(p);
    const precios=ops.map(o=>o.precio).filter(x=>x!=null&&x!=="");
    const precio = precios.length>1
      ? `S/ ${Math.min(...precios.map(Number))} – ${Math.max(...precios.map(Number))}`
      : precios.length===1 ? `S/ ${esc(precios[0])}`
      : (p.config&&p.config.precio?`S/ ${esc(p.config.precio)}`:"");
    const multi=ops.length>1;
    const emIc = p.emoji ? `<span style="font-size:24px;line-height:1">${esc(p.emoji)}</span>` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>`;
    el.innerHTML=`
      <div class="c-ic">${emIc}</div>
      <div class="c-tt">${esc(p.nombre)}</div>
      <div class="c-sub">${esReg(p)?"Regalo · gratis con la compra":esEx(p)?"Complemento · para ventas extra":(p.tipo==="fisico"?"Producto físico":"Producto digital")}</div>
      <div class="c-foot">${esReg(p)?`<span class="nodo-pill" style="background:rgba(168,85,247,.14);color:#a855f7;border-color:rgba(168,85,247,.3)">🎁 Regalo</span>`:esEx(p)?`<span class="nodo-pill" style="background:rgba(16,185,129,.14);color:#0e9f6e;border-color:rgba(16,185,129,.3)">🟩 Extra</span>`:''}<span class="nodo-pill neutral">${p.tipo==="fisico"?icon("box")+"Físico":icon("download")+"Digital"}</span><span class="nodo-pill neutral">${multi?`${ops.length} opciones`:'1 opción'}</span>${precio?`<span class="nodo-pill neutral">${precio}</span>`:''}<span data-cardfolder style="margin-left:auto"></span></div>`;
    const fslot=el.querySelector("[data-cardfolder]");
    if(fslot && Fbar){
      const pk=Fbar.picker({ current:p.folder||null, onPick:async(v)=>{
        const { error }=await supa.from("products").update({ folder:v }).eq("id",p.id);
        if(error){ toast(error.message,true); return; }
        p.folder=v; toast(v?`Movido a "${v}" ✓`:"Quitado de la carpeta ✓"); await Fbar.reload(); renderCards();
      }});
      pk.addEventListener("click",e=>e.stopPropagation());
      fslot.appendChild(pk);
    }
    el.onclick=()=>openProduct(p.id); box.appendChild(el);
  });
  const add=document.createElement("div"); add.className="nodo-card new";
  add.innerHTML=`<div class="c-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div><div class="c-tt" style="font-size:14px;font-weight:700">Nuevo producto</div>`;
  add.onclick=createProduct; box.appendChild(add);
}
// Modal de creación: primero ELIGES qué vendes (físico o digital) — es lo que
// decide cómo se ve toda la ficha —, luego el nombre. Devuelve {tipo,nombre} o null.
function nuevoProductoModal(){

    let tipo=null, clase="principal";
    const ov=document.createElement("div");

      <div style="font-size:19px;font-weight:800;letter-spacing:-.3px">Nuevo producto</div>
      <div style="font-size:13px;color:var(--muted);margin:4px 0 14px">Primero, ¿es un producto que vendes de frente o un complemento?</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">
        <button class="npc" data-c="principal" style="flex:1;min-width:180px;text-align:left;border:1.5px solid var(--brand);background:var(--brand-bg,rgba(43,127,255,.12));border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:5px">
          <span style="font-weight:800;font-size:14px;color:var(--text)">🟦 Principal</span>
          <span style="font-size:11.5px;color:var(--muted);line-height:1.45">Se vende solo: tiene su gancho (palabra clave / anuncio) y su conversación de venta con IA.</span></button>
        <button class="npc" data-c="extra" style="flex:1;min-width:180px;text-align:left;border:1.5px solid var(--border);background:var(--surface-2);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:5px">
          <span style="font-weight:800;font-size:14px;color:var(--text)">🟩 Extra (complemento)</span>
          <span style="font-size:11.5px;color:var(--muted);line-height:1.45">No se vende solo — se engancha como <b>venta extra</b> a un principal. Solo lo esencial: precio, entrega y cómo lo vende la IA.</span></button>
        <button class="npc" data-c="regalo" style="flex:1;min-width:180px;text-align:left;border:1.5px solid var(--border);background:var(--surface-2);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:5px">
          <span style="font-weight:800;font-size:14px;color:var(--text)">🎁 Regalo</span>
          <span style="font-size:11.5px;color:var(--muted);line-height:1.45">No se vende: se <b>regala gratis</b> al comprar un principal. Digital o físico. Solo configuras qué es y su entrega.</span></button>
      </div>
      <div style="font-size:13px;color:var(--muted);margin:0 0 18px">¿Cómo se entrega? Esto adapta la ficha.</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        ${card("fisico","📦","Producto físico","Se envía: Lima contraentrega o provincia por agencia con adelanto. La logística la hereda de Negocio.")}
        ${card("digital","💻","Producto digital","Se entrega al instante por un link o archivo al confirmar el pago.")}
      </div>

    okBtn().onclick=done;

}

async function createProduct(){
  const r=await nuevoProductoModal(); if(!r) return;
  const { tipo, nombre, clase }=r;
  const folder=(Fbar&&Fbar.current!=="__all"&&Fbar.current!=="__none")?Fbar.current:null;
  let { data,error } = await supa.from("products").insert({ channel_id:st.channelId, nombre, tipo, clase, folder }).select("id").single();
  if(error && /clase|column/.test(error.message)){ ({ data,error } = await supa.from("products").insert({ channel_id:st.channelId, nombre, tipo, folder }).select("id").single()); }
  if(error && /tipo|folder|column/.test(error.message)){ ({ data,error } = await supa.from("products").insert({ channel_id:st.channelId, nombre, tipo }).select("id").single()); }
  if(error && /tipo|column/.test(error.message)){ ({ data,error } = await supa.from("products").insert({ channel_id:st.channelId, nombre }).select("id").single()); }
  if(error){ toast(error.message,true); return; }
  // Todo producto nace con al menos UNA opción de compra: así el modelo no
  // tiene casos especiales (la migración 0029 hizo lo mismo con los viejos) y
  // un producto simple no obliga a configurar nada extra.
  await supa.from("product_versions")
    .insert({ product_id:data.id, nombre:"Única", orden:0, activo:true, cantidad:1, entrega:[] })
    .then(r=>{ if(r.error) console.warn("[productos] sin opción inicial:", r.error.message); });
  await loadProducts(); openProduct(data.id);
}
async function openProduct(id){
  const { data:p } = await supa.from("products").select("*").eq("id",id).maybeSingle();
  const { data:vs } = await supa.from("product_versions").select("*").eq("product_id",id).order("orden");
  st.prod=p; st.versions=vs||[]; st.delVersions=[]; st.tab="inicio";
  // Migración: el "precio base" viejo (config.precio) pasa a la 1ª presentación
  // si esta no tiene precio, para que el precio viva en un solo lugar
  // (Presentaciones y precios). Al guardar se persiste; config.precio se queda
  // como respaldo inofensivo (la presentación manda).
  try{
    const bp=st.prod&&st.prod.config&&st.prod.config.precio;
    if(bp!=null && String(bp).trim()!=="" && st.versions.length){
      const v0=st.versions[0];
      if(v0 && (v0.precio==null || String(v0.precio).trim()==="")) v0.precio=bp;
    }
  }catch(_){}
  // Migración de entrega digital: el link viejo (config.link_entrega) pasa a la
  // 1ª presentación si esta no tiene entrega, para que el link viva en un solo
  // lugar (Presentaciones → Qué entrega). config.link_entrega queda de respaldo.
  try{
    if((st.prod&&st.prod.tipo||"digital")==="digital"){
      const lk=st.prod&&st.prod.config&&st.prod.config.link_entrega;
      if(lk && String(lk).trim()!=="" && st.versions.length){
        const v0=st.versions[0];
        const tiene=v0&&Array.isArray(v0.entrega)&&v0.entrega.some(it=>it&&String(it.url||"").trim());
        if(v0 && !tiene){ v0.entrega=Array.isArray(v0.entrega)?v0.entrega:[]; v0.entrega.push({ tipo:"link", url:String(lk), nombre:"" }); }
      }
    }
  }catch(_){}
  // Con qué tipo se abrió: si lo cambia, el flujo YA GENERADO sigue vendiendo
  // como el tipo viejo (un digital pediría dirección, un físico entregaría un
  // link) y eso no se nota hasta que un cliente lo sufre.
  st.tipoGuardado=p?.tipo||"digital";
  renderDetail(); showDetail();
}
async function deleteProduct(){
  if(!st.prod) return;
  if(!await confirmDialog({title:"Eliminar producto",message:`¿Eliminar "${esc(st.prod.nombre)}"? Se eliminarán también sus versiones. Esta acción no se puede deshacer.`,confirmText:"Eliminar",danger:true})) return;
  await supa.from("product_versions").delete().eq("product_id",st.prod.id);
  const { error }=await supa.from("products").delete().eq("id",st.prod.id);
  if(error){ toast(error.message,true); return; }
  st.prod=null; toast("Producto eliminado ✓"); showGrid(); await loadProducts();
}

function renderDetail(){
  const d=$("detail"); if(!st.prod) return;
  const esExtra = st.prod.clase==="extra";
  const esRegalo = st.prod.clase==="regalo";
  const EXTRA_TABS=["inicio","producto","opciones","entrega","ia","stock"];
  // Un regalo NO se vende: no lleva "venta con IA", activación, ventas extra ni
  // remarketing. Solo qué es (producto) y qué entrega (opciones → Qué entrega).
  const REGALO_TABS=["inicio","producto"];
  if(esExtra && !EXTRA_TABS.includes(st.tab)) st.tab="inicio";
  if(esRegalo && !REGALO_TABS.includes(st.tab)) st.tab="inicio";
  // Sin barra de pestañas: el producto vive en el hub "Inicio" y cada sección se
  // abre a pantalla completa con un botón para volver (navegación hub ↔ sección).
  const SEC={ producto:"Producto", opciones:"Presentaciones y precios", entrega:"Entrega",
    ia:"Venta con IA", activacion:"Cómo llegan los clientes", extras:"Ventas extra",
    remarketing:"Reenganche", flujos:"Flujos", stock:"Stock (inventario)" };
  if(esRegalo) SEC.opciones="Qué se entrega";
  // En físico la sección "producto" ya no tiene identidad (se edita en el
  // encabezado): solo variantes + stock, así que el breadcrumb lo refleja.
  if((st.prod.tipo||"digital")==="fisico") SEC.producto="Variantes y stock"; else SEC.producto="Detalles a preguntar";
  const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  const onHub = st.tab==="inicio";
  // "¿Lo armo por ti?" es este FAB de abajo a la derecha, visible en todo el editor.
  const _fab=$("armFab"); if(_fab) _fab.style.display="inline-flex";
  d.innerHTML = onHub
    ? `<div id="tabBody"></div>`
    : `<div class="pdet-secbar">
         <button class="pdet-back" id="backHub">${CHEV}Inicio</button>
         <span class="pdet-crumb">${esc(st.prod.nombre)}</span><span class="pdet-crumb-sep">›</span><span class="pdet-crumb-cur">${SEC[st.tab]||""}</span>
       </div>
       <div id="tabBody"></div>`;
  const bh=$("backHub"); if(bh) bh.onclick=()=>{ st.tab="inicio"; renderDetail(); };
  if(st.tab==="inicio") renderInicio();
  else if(st.tab==="producto") renderProducto();
  else if(st.tab==="entrega") renderEntrega();
  else if(st.tab==="ia") renderProductoIA();
  else if(st.tab==="opciones") renderOpciones();
  else if(st.tab==="extras") renderExtras();
  else if(st.tab==="remarketing") renderRemarketing();
  else if(st.tab==="flujos") renderFlujos();
  else if(st.tab==="stock") renderStock();
  else renderActivacion();
}
// FAQ del producto: editor de pares P/R que compila a config.faq (texto que
// lee el motor). Se conserva config.faq_items para poder re-editarlo.
function parseFaq(txt){
  if(!txt||!txt.trim()) return [];
  const items=[]; const re=/P(?:regunta)?\s*:?\s*([\s\S]*?)\s*R(?:espuesta)?\s*:?\s*([\s\S]*?)(?=(?:\n\s*P(?:regunta)?\s*:)|$)/gi;
  let m; while((m=re.exec(txt))){ const q=(m[1]||"").trim(), a=(m[2]||"").trim(); if(q||a) items.push({q,a}); }
  if(!items.length) items.push({q:"", a:txt.trim()});
  return items;
}
function compileFaq(items){ return (items||[]).filter(x=>x&&(x.q||x.a)).map(x=>`P: ${(x.q||"").trim()}\nR: ${(x.a||"").trim()}`).join("\n\n"); }
// Objeciones estructuradas ↔ texto "«objeción» → respuesta" (lo que ya lee el prompt).
function parseObj(txt){
  if(!txt||!txt.trim()) return [];
  return txt.split(/\n+/).map(line=>{
    const m=line.match(/^\s*[«"']?\s*(.*?)\s*[»"']?\s*(?:→|->|=>|:)\s*([\s\S]*)$/);
    if(m && m[1]) return { o:m[1].trim(), r:(m[2]||"").trim() };
    const t=line.trim(); return t?{o:t,r:""}:null;
  }).filter(Boolean);
}
function compileObj(items){ return (items||[]).filter(x=>x&&(x.o||x.r)).map(x=>`«${(x.o||"").trim()}» → ${(x.r||"").trim()}`).join("\n"); }

function compileConfirmaciones(c,tipo){
  if(tipo!=="fisico") return "";
  const cf=(c.envio&&c.envio.confirmaciones)||{};
  const on=(arr)=>arr.filter(([k])=>cf[k]).map(([,l])=>"- "+l);
  const cod=on(CONFIRM_COD), ag=on(CONFIRM_AG);
  if(!cod.length&&!ag.length) return "";
  // "Verifica antes de confirmar" se leía como "pídele que te lo confirme": con
  // el DNI ya capturado y válido, la IA respondía "confírmame cuál es el DNI
  // correcto" — repreguntaba un dato bueno justo cuando el pedido ya estaba
  // creado. Es una lista de lo que NO puede faltar, no un pedido de confirmación.
  const L=["## Requisitos para confirmar el pedido",
    "Es lo que no puede FALTAR para cerrar el pedido. Si el cliente ya te lo dio, dalo por bueno: no se lo vuelvas a pedir ni le pidas que lo confirme."];
  if(cod.length) L.push("Para pedidos contraentrega, no cierres el pedido sin tener:\n"+cod.join("\n"));
  if(ag.length) L.push("Para pedidos por agencia, no cierres el pedido sin tener:\n"+ag.join("\n"));
  return L.join("\n\n");
}
function compileProductoIA(c,tipo){
  const ia=c.ia||{}; const L=[];
  const add=(t,v)=>{ if(v&&String(v).trim()) L.push(`## ${t}\n${String(v).trim()}`); };
  const cv=[];
  if(ia.estilo_venta&&ESTILOS_VENTA[ia.estilo_venta]) cv.push("Estilo de venta: "+ESTILOS_VENTA[ia.estilo_venta]+".");
  if(ia.proceso&&ia.proceso.trim()) cv.push("Proceso de venta:\n"+ia.proceso.trim());
  if(ia.tecnicas&&ia.tecnicas.trim()) cv.push("Técnicas de venta:\n"+ia.tecnicas.trim());
  if(cv.length) L.push("## Cómo vender este producto\n"+cv.join("\n\n"));
  // Objeciones: la munición del vendedor. Se compila prominente para que la IA
  // las tenga a la mano y rebata con tacto (no discutir), sin inventar.
  if(ia.objeciones&&ia.objeciones.trim()) L.push("## Objeciones frecuentes y cómo responderlas\nCuando el cliente ponga una de estas dudas o pegas, responde en esta línea (con tacto, nunca discutas ni presiones de más; si no aplica, sé honesto):\n"+ia.objeciones.trim());
  add("Resumen del producto",ia.resumen);
  add("Descripción / detalle",ia.detalle);
  add("Reglas del producto",ia.reglas_producto);
  add("Límites (nunca hacer / no prometer)",ia.limites);
  add("Reglas del precio",ia.reglas_precio);
  // Las ofertas por cantidad ya NO se compilan acá: son Opciones de compra
  // reales (migración 0029) y el motor le inyecta a la IA el catálogo con sus
  // precios de verdad. Tenerlas en dos lados se contradecía.
  add("Precios con descuento",ia.descuentos);
  add("Formas de pago de este producto (tienen PRIORIDAD sobre las generales)",ia.metodos_pago);
  const ej=(ia.ejemplos||[]).filter(e=>e&&(e.sit||e.resp));
  if(ej.length) L.push("## Ejemplos de respuesta\n"+ej.map(e=>`- Si el cliente ${(e.sit||"").trim()} → responde: ${(e.resp||"").trim()}`).join("\n"));
  if(ia.emojis_prohibidos&&ia.emojis_prohibidos.trim()) L.push("## Emojis prohibidos\nNunca uses estos emojis ni de ese estilo: "+ia.emojis_prohibidos.trim());
  const mm=(c.ia_multimedia||[]).filter(m=>m&&m.media_url);
  if(mm.length) L.push("## Archivos que puedes enviar\nCuando la situación lo pida, envía el archivo escribiendo `[[media:TAG]]` en una línea aparte.\n"+mm.map(m=>`- [[media:${m.tag||"archivo"}]] — ${m.descripcion||m.filename||"archivo"}`).join("\n"));
  const req=compileConfirmaciones(c,tipo); if(req) L.push(req);
  // 🎁 Regalo con la compra: si está activado "mencionar", la IA lo usa de gancho.
  const regs=(c.regalos||[]).filter(r=>r&&r.nombre);
  if(c.regalo_mencionar && regs.length){
    const lista=regs.map(r=> (r.desc&&String(r.desc).trim()) ? `- ${r.nombre}: ${String(r.desc).trim()}` : `- ${r.nombre}`).join("\n");
    L.push("## 🎁 Regalo con la compra\nAl comprar, el cliente se lleva GRATIS de regalo:\n"+lista+"\nPuedes mencionarlo con naturalidad para incentivar el cierre (\"y de regalo te incluyo…\"). Si el cliente pregunta qué es, explícaselo con su descripción. No lo cobres, no lo prometas dos veces ni exageres; se entrega solo al cerrar la compra.");
  }
  return L.join("\n\n");
}
// Asegura la forma nueva de config.envio (tabs por agencia + confirmaciones),
// migrando desde la forma vieja (checkboxes) sin perder el adelanto anterior.
function normalizeEnvio(c){
  let e=c.envio;
  const blankAg=(over)=>Object.assign({ modo:"cliente", precio_min:"", precio_max:"", monto_fijo:"", gratis_desde:"", adelanto_valor:"", adelanto_moneda:"PEN", adelanto_cond:false, rangos:[] }, over||{});
  if(!e || typeof e!=="object") e={};
  if(!e.agencias || Array.isArray(e.agencias) || !e.agencias.shalom){
    const oldVal=e.adelanto_valor ?? 20;
    const oldModo=e.gratis===false?"cliente":"gratis";
    e={ agencia_activa:"shalom",
        agencias:{ shalom:blankAg({adelanto_valor:oldVal,modo:oldModo}), olva:blankAg({adelanto_valor:oldVal,modo:oldModo}) },
        confirmaciones: e.confirmaciones || { referencia:false, mapa:true, rango_fecha:false, agencia_def:true, adelanto:true, dni:true } };
  }
  for(const [k] of AGENCIAS){ e.agencias[k]=blankAg(e.agencias[k]); if(!Array.isArray(e.agencias[k].rangos)) e.agencias[k].rangos=[]; }
  if(!e.agencia_activa) e.agencia_activa="shalom";
  if(!e.confirmaciones) e.confirmaciones={ referencia:false, mapa:true, rango_fecha:false, agencia_def:true, adelanto:true, dni:true };
  c.envio=e; return e;
}

// Ejes del stock = atributos que tienen VALORES declarados (talla, color…).
// Un atributo de texto libre (sin valores) no entra a la matriz.
function stockAxes(atributos){ return (atributos||[]).filter(a=>a&&a.nombre&&String(a.valores||"").trim()); }
// Producto cartesiano de los valores → todas las variantes [{Talla:"38",Color:"negro"},…].
function variantCombos(atributos){
  const axes=stockAxes(atributos).map(a=>({ nombre:a.nombre, vals:String(a.valores).split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean) }));
  if(!axes.length || axes.some(a=>!a.vals.length)) return [];
  let combos=[{}];
  axes.forEach(ax=>{ const nx=[]; combos.forEach(cm=> ax.vals.forEach(v=> nx.push({ ...cm, [ax.nombre]:v }))); combos=nx; });
  return combos;
}
// Clave estable de una variante (normalizada). DEBE coincidir con la del motor.
function stockKey(atributos, vals){
  const parts=stockAxes(atributos).map(a=>a.nombre+"="+String((vals&&vals[a.nombre])??"").trim().toLowerCase());
  return parts.length?parts.join("|"):"_";
}

    const k="_"; const val=c.stock[k];
    cuerpo=`<div class="card">
      <h4 style="margin-top:0;display:flex;align-items:center;gap:7px">${icon("box")} Unidades disponibles</h4>
      <div style="font-size:12px;color:var(--faint);margin-bottom:8px">Este producto no tiene variantes (talla/color), así que es un solo número. ${(c.atributos||[]).length?"Si quieres llevar el stock por talla/color, agrega esos atributos con sus valores en <b>Producto → Detalles a preguntar</b>.":""}</div>
      <input class="in stkV" data-k="_" type="number" step="1" value="${val==null?"":esc(val)}" placeholder="—" style="width:140px"/>
      ${val!=null&&Number(val)<=0?'<div style="color:var(--red,#e2564a);font-weight:700;font-size:12.5px;margin-top:6px">Agotado</div>':(val!=null&&Number(val)<=Number(umbral)?'<div style="color:var(--amber,#f0a92b);font-weight:700;font-size:12.5px;margin-top:6px">Stock bajo</div>':'')}${umbralRow}</div>`;
  }
  b.innerHTML=explic+cuerpo;
  const um=b.querySelector("#stkUmbral"); if(um) um.onchange=(e)=>{ const v=e.target.value.trim(); if(v==="") delete c.stock_umbral; else c.stock_umbral=Math.max(0,parseInt(v,10)||0); stockUI(b,c,explicOn); };
  b.querySelectorAll(".stkV").forEach(inp=> inp.onchange=(e)=>{
    const k=inp.dataset.k, v=e.target.value.trim();
    if(v==="") delete c.stock[k]; else c.stock[k]=Math.round(Number(v)||0);
    stockUI(b,c,explicOn); // re-pinta para actualizar los sellos agotado/bajo
  });
}

// Selector de emoji del producto (compartido). Requiere #emojiBtn y #emojiPop.
function wireEmojiPicker(){
  const pop=$("emojiPop"), ebtn=$("emojiBtn"); if(!pop||!ebtn) return;
  pop.style.flexDirection="column";
  pop.innerHTML=`
    <input id="emojiAny" placeholder="Escribe o pega cualquier emoji…" maxlength="8"
      style="width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:16px;outline:none;margin-bottom:6px"/>
    <div style="font-size:11px;color:var(--faint);margin-bottom:6px">Tip: <b>Win + .</b> (o <b>Ctrl+Cmd+Espacio</b> en Mac) abre el teclado de emojis.</div>
    <div style="max-height:230px;overflow-y:auto;margin:0 -2px">
      ${EMOJI_CATS.map(c=>`<div style="font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:700;padding:8px 4px 3px">${c.n}</div><div style="display:flex;flex-wrap:wrap;gap:1px">${splitEmojis(c.e).map(e=>`<button type="button" data-e="${e}" style="width:32px;height:32px;font-size:19px;padding:0;border:none;background:transparent;cursor:pointer;border-radius:8px;line-height:1">${e}</button>`).join("")}</div>`).join("")}
    </div>
    <button type="button" data-e="" title="Sin emoji" style="margin-top:6px;width:100%;height:30px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;font-size:12px">Sin emoji</button>`;
  pop.style.display="none";
  ebtn.onclick=(ev)=>{ ev.stopPropagation(); pop.style.display=pop.style.display==="none"?"flex":"none"; if(pop.style.display==="flex"){ const inp=$("emojiAny"); if(inp){ inp.value=st.prod.emoji||""; inp.focus(); } } };
  pop.onclick=(ev)=>ev.stopPropagation();
  const setEmoji=(v)=>{ st.prod.emoji=(v&&v.trim())||null; ebtn.innerHTML=st.prod.emoji?esc(st.prod.emoji):icon("plus"); };
  pop.querySelectorAll("button[data-e]").forEach(b=> b.onclick=()=>{ setEmoji(b.dataset.e); pop.style.display="none"; });
  const any=$("emojiAny");
  any.oninput=(e)=>setEmoji(e.target.value);
  any.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); pop.style.display="none"; } };
  document.addEventListener("click",()=>{ pop.style.display="none"; },{ once:true });
}

// ── Pestaña ENTREGA: cómo le llega al cliente ──────────────────────
function renderEntrega(host){
  const b=host||$("tabBody");
  const c=st.prod.config=st.prod.config||{};
  const tipo=st.prod.tipo||"digital";
  if(tipo==="digital"){
    const simple = st.versions.length<=1;
    let v = st.versions[0]; if(!v){ v={ nombre:"", precio:"", cantidad:1, descripcion:"", entrega:[], activo:true, orden:0 }; st.versions.push(v); }
    b.innerHTML=`
      <p class="hint" style="margin:0 0 14px">Cómo recibe el cliente lo que compró, apenas confirma el pago.</p>
      ${simple ? `
      <div class="card">
        <h4 style="display:flex;align-items:center;gap:7px;margin-top:0">${icon("link")} Qué recibe el cliente</h4>
        <div style="font-size:12px;color:var(--faint);margin:2px 0 8px">El <b>link, archivo, imagen o video</b> que se envía al confirmar el pago. Disponible en flujos como <b style="color:var(--brand)">{{link_entrega}}</b>.</div>
        <div class="oe"></div>
        <div style="display:flex;gap:6px;margin-top:8px">
          <button class="btn oel" style="height:32px">${icon("link")} Link</button>
          <button class="btn oef" style="height:32px">${icon("file")} Archivo / imagen / video</button>
        </div>
      </div>` : `
      <div class="card"><div style="font-size:12.5px;color:var(--muted);line-height:1.6">Tienes <b>varias presentaciones</b> y cada una entrega lo suyo. Configura el link/archivo de cada una en <a href="#" id="goEntOpc" style="color:var(--brand)">¿Cuánto cuesta? →</a>.</div></div>`}
      <div class="card">
        <h4 style="display:flex;align-items:center;gap:7px;margin-top:0">${icon("message")} El mensaje de entrega</h4>
        <label style="margin-top:6px">Mensaje que abre la entrega</label>
        <input class="in" id="pEntMsg" value="${esc(c.entrega_mensaje||"")}" placeholder="¡Pago confirmado! 🎉 Acá tienes tu acceso:"/>
        <label class="chk" style="margin-top:16px;justify-content:space-between">
          <span style="font-weight:600;font-size:13px">Entregar todo en una sola burbuja</span>
          <span class="sw ${c.entrega_burbuja_unica?'on':''}" id="pEntUna"></span>
        </label>
        <div style="font-size:11px;color:var(--faint);margin-top:7px">Junta el saludo + todos los links en un mismo mensaje. Los <b>archivos adjuntos</b> salen aparte (regla de WhatsApp).</div>
      </div>
      <div class="card">
        <h4 style="display:flex;align-items:center;gap:7px;margin-top:0">${icon("shield")} Validación del pago <span style="font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:20px">ajuste de pago</span></h4>
        <div style="font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.55">Cuándo se entrega tras cobrar. Por defecto sigue lo del canal en <a href="pagos.html" style="color:var(--brand)">Pagos y avisos</a>; acá lo cambias <b>solo para este producto</b>.</div>
        <select class="in" id="pValPago" style="max-width:320px">
          <option value="" ${!c.validacion_pago?"selected":""}>Usar el default del canal</option>
          <option value="auto" ${c.validacion_pago==="auto"?"selected":""}>⚡ Automático — entrega al toque si el monto cuadra</option>
          <option value="manual" ${c.validacion_pago==="manual"?"selected":""}>👁 Manual — me avisa para aprobarlo yo</option>
        </select>
      </div>`;
    const em=$("pEntMsg"); if(em) em.onchange=(e)=>prodSetC("entrega_mensaje", e.target.value.trim()||undefined);
    const eu=$("pEntUna"); if(eu) eu.onclick=()=>{ const on=!c.entrega_burbuja_unica; c.entrega_burbuja_unica=on; prodSetC("entrega_burbuja_unica", on||undefined); eu.classList.toggle("on", on); };
    const vp=$("pValPago"); if(vp) vp.onchange=(e)=>prodSetC("validacion_pago", e.target.value||undefined);
    if(simple){
      const oel=b.querySelector(".oel"); if(oel) oel.onclick=()=>{ v.entrega=Array.isArray(v.entrega)?v.entrega:[]; v.entrega.push({tipo:"link",url:"",nombre:""}); paintEntrega(b,v,false); const f=b.querySelectorAll(".oe .eu"); if(f[f.length-1]) f[f.length-1].focus(); };
      const oef=b.querySelector(".oef"); if(oef) oef.onclick=()=>pickEntregaFile(v,()=>paintEntrega(b,v,false));
      if(b.querySelector(".oe")) paintEntrega(b,v,false);
    } else { const g=$("goEntOpc"); if(g) g.onclick=(e)=>{ e.preventDefault(); accOpen("opciones"); }; }
    return;
  }
  // Físico: TODA la logística (zonas, agencias, envío gratis, costos, adelanto
  // por defecto) vive en Negocio → Entrega y logística, igual para todos los
  // productos. Acá solo el ADELANTO override, por si ESTE producto necesita otro.
  b.innerHTML=`
    <p class="hint" style="margin:0 0 14px">La entrega física —zonas de Lima, agencias, envío gratis, corte y el <b>adelanto por defecto</b>— se configura una vez en <a href="negocio.html" style="color:var(--brand)">Negocio → Entrega y logística</a> y vale para todos tus productos.</p>
    ${st.prod.clase==="extra"
      ? `<div style="display:flex;gap:8px;align-items:flex-start;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);border-radius:11px;padding:12px 13px;font-size:12.5px;color:var(--muted);line-height:1.55"><span style="color:#0e9f6e;flex:none;display:inline-flex;margin-top:1px">${icon("box")}</span><div>Este es un <b>complemento</b>: se despacha <b>junto con el pedido principal</b>, en el mismo envío. No lleva adelanto ni envío propios — usa los del pedido al que se sume.</div></div>`
      : `
    <div class="card">
      <h4 style="display:flex;align-items:center;gap:7px"><span style="color:var(--green);display:inline-flex">${icon("dollar")}</span> Adelanto de este producto</h4>
      <div style="font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.55">Solo si <b>este</b> producto pide una seña distinta a la de tu negocio. Si lo dejas <b>vacío</b>, usa el adelanto por defecto de Negocio.</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="color:var(--muted);font-size:13px">S/</span>
        <input class="in" id="pAdelOv" type="number" min="0" step="0.5" value="${esc(c.adelanto_override??"")}" placeholder="por defecto de Negocio" style="width:150px"/>
        <span id="adelHint" style="font-size:11.5px;color:var(--faint);flex:1;min-width:200px">Disponible en los flujos como <b style="color:var(--brand)">{{adelanto}}</b>.</span>
      </div>
    </div>
    <div class="card">
      <h4 style="display:flex;align-items:center;gap:7px"><span style="color:var(--green);display:inline-flex">${icon("truck")}</span> Envío de este producto</h4>
      <div style="font-size:12.5px;color:var(--muted);margin:6px 0 12px;line-height:1.55">Solo si <b>este</b> producto se cobra distinto al resto (por ejemplo, uno grande donde sí cobras el envío aparte).</div>
      <select class="in" id="pEnvModo" style="max-width:420px">
        <option value="">Como diga mi negocio${c.envio_modo?"":" (actual)"}</option>
        <option value="incluido" ${c.envio_modo==="incluido"?"selected":""}>Incluido en el precio — el cliente no paga envío</option>
        <option value="suma" ${c.envio_modo==="suma"?"selected":""}>Se suma al total — el cliente paga producto + envío</option>
        <option value="agencia" ${c.envio_modo==="agencia"?"selected":""}>Lo paga en la agencia — no pasa por tu caja</option>
      </select>
      <div id="pEnvMontos"></div>
      <div id="envHint" style="font-size:11.5px;color:var(--faint);margin-top:10px"></div>
    </div>`}`;
  const ov=$("pAdelOv"); if(ov) ov.onchange=(e)=>prodSetC("adelanto_override", e.target.value.trim()===""?undefined:Number(e.target.value));
  const pintarEnvMontos=()=>{
    const box=$("pEnvMontos"); if(!box) return;
    if(c.envio_modo!=="suma"){ box.innerHTML=""; return; }
    box.innerHTML=`
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px">
        <label style="margin:0;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600">Lima
          <span style="color:var(--muted)">S/</span>
          <input class="in" id="pEnvLima" type="number" min="0" step="0.5" placeholder="el de Negocio" value="${esc(c.envio_cobro_lima??"")}" style="width:110px"/></label>
        <label style="margin:0;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600">Provincia
          <span style="color:var(--muted)">S/</span>
          <input class="in" id="pEnvProv" type="number" min="0" step="0.5" placeholder="el de Negocio" value="${esc(c.envio_cobro_provincia??"")}" style="width:110px"/></label>
        <span style="font-size:11.5px;color:var(--faint);flex:1;min-width:180px">Vacío = usa el monto de Negocio.</span>
      </div>`;
    $("pEnvLima").onchange=(e)=>prodSetC("envio_cobro_lima", e.target.value.trim()===""?undefined:Number(e.target.value));
    $("pEnvProv").onchange=(e)=>prodSetC("envio_cobro_provincia", e.target.value.trim()===""?undefined:Number(e.target.value));
  };
  const em2=$("pEnvModo"); if(em2) em2.onchange=(e)=>{ c.envio_modo=e.target.value||undefined; prodSetC("envio_modo", c.envio_modo); pintarEnvMontos(); };
  pintarEnvMontos();
  // Mostrar el default de Negocio como referencia (carga perezosa).
  supa.from("channels").select("entregas").eq("id",st.channelId).maybeSingle()
    .then(({data})=>{
      const E=data?.entregas||{};
      const def=E.adelanto_default; const h=$("adelHint");
      if(h && def!=null && def!==""){ h.innerHTML=`Por defecto de Negocio: <b>S/ ${esc(def)}</b>. Disponible en los flujos como <b style="color:var(--brand)">{{adelanto}}</b>.`; }
      const eh=$("envHint");
      if(eh){
        const modo=E.envio_modo || (E.envio_gratis!==false?"incluido":"suma");
        const txt={incluido:"incluido en el precio",suma:"se suma al total",agencia:"lo paga en la agencia"}[modo]||modo;
        eh.innerHTML=`Tu negocio hoy dice: <b>${esc(txt)}</b>. <a href="negocio.html" style="color:var(--brand)">Cambiarlo para todos →</a>`;
      }
    }).catch(()=>{});
}

  const paintMM=()=>{

          <div style="font-size:10.5px;color:var(--faint);margin-top:4px">${esc(m.filename||"")}</div>

      el.querySelector(".mmdesc").oninput=(e)=>{ m.descripcion=e.target.value; prodSync(); };

  b.querySelectorAll(".mmAdd").forEach(btn=> btn.onclick=()=>pickProdMedia(btn.dataset.k, paintMM, prodSync));

        <div style="display:flex;align-items:flex-start;gap:8px;margin-top:8px"><span style="flex:0 0 66px;font-size:11px;font-weight:700;color:var(--ia1,#a855f7);text-transform:uppercase;letter-spacing:.03em;margin-top:10px">Respondes</span><textarea class="in orr" rows="2" style="flex:1;min-height:52px;line-height:1.5;font-family:var(--font);resize:vertical" placeholder="${esc(objEx[1])}">${esc(ob.r||"")}</textarea></div>`;
      const sync=()=>{ ia.objeciones=compileObj(ia.objeciones_items); prodSync(); };
      el.querySelector(".oo").oninput=(e)=>{ ob.o=e.target.value; sync(); };
      el.querySelector(".orr").oninput=(e)=>{ ob.r=e.target.value; sync(); };
      el.querySelector(".odl").onclick=()=>{ ia.objeciones_items.splice(i,1); ia.objeciones=compileObj(ia.objeciones_items); prodSync(); paintObj(); };
      box.appendChild(el);
    });
  };
  paintObj();
  $("objAdd").onclick=()=>{ ia.objeciones_items.push({o:"",r:""}); paintObj(); };
  const paintFaq=()=>{
    const box=$("faqList"); box.innerHTML="";
    if(!c.faq_items.length){ box.innerHTML=`<div style="font-size:12px;color:var(--faint);padding:4px 0">Sin preguntas todavía.</div>`; }
    c.faq_items.forEach((qa,i)=>{
      const el=document.createElement("div"); el.style.cssText="border:1px solid var(--border);border-radius:11px;padding:11px;margin-bottom:8px";
      el.innerHTML=`<div class="row" style="align-items:flex-start"><input class="in fq" value="${esc(qa.q||"")}" placeholder="Pregunta (ej. ${fisico?"¿Hacen envíos a provincia?":"¿Cómo recibo el acceso?"})"/><button class="iconbtn fdel" style="flex:0 0 auto">${icon("trash")}</button></div>
        <textarea class="in fa" rows="2" style="margin-top:8px;min-height:52px;line-height:1.5;font-family:var(--font);resize:vertical" placeholder="Respuesta ideal">${esc(qa.a||"")}</textarea>`;
      const sync=()=>{ c.faq=compileFaq(c.faq_items); prodSync(); };
      el.querySelector(".fq").oninput=(e)=>{ qa.q=e.target.value; sync(); };
      el.querySelector(".fa").oninput=(e)=>{ qa.a=e.target.value; sync(); };
      el.querySelector(".fdel").onclick=()=>{ c.faq_items.splice(i,1); c.faq=compileFaq(c.faq_items); prodSync(); paintFaq(); };
      box.appendChild(el);

  paintFaq();

}
