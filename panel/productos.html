    if(el.querySelector(".oe")) paintEntrega(el,v,fisico);
    box.appendChild(el);
  });
  warnColision();
}

function paintEntrega(el,v,fisico){
  const box=el.querySelector(".oe"); box.innerHTML="";
  const items=v.entrega=Array.isArray(v.entrega)?v.entrega:[];
  if(!items.length){ box.innerHTML=`<div style="font-size:12px;color:var(--faint);padding:2px 0">Sin entrega configurada.</div>`; return; }
  items.forEach((it,j)=>{
    const r=document.createElement("div"); r.style.cssText="margin-bottom:10px;padding:8px 9px;border:1px solid var(--border);border-radius:10px";
    // Miniatura para imagen/video subidos; icono para link o archivo (pdf/zip…).
    const prev = (it.tipo==="archivo" && it.media_kind==="image")
      ? `<img src="${esc(it.url)}" style="width:38px;height:38px;object-fit:cover;border-radius:7px;flex:0 0 auto"/>`
      : (it.tipo==="archivo" && it.media_kind==="video")
      ? `<video src="${esc(it.url)}" muted style="width:38px;height:38px;object-fit:cover;border-radius:7px;flex:0 0 auto"></video>`
      : `<span style="flex:0 0 auto;color:var(--muted);display:inline-flex">${icon(it.tipo==="archivo"?"file":"link")}</span>`;
    const kindLabel = it.tipo!=="archivo" ? "" : (it.media_kind==="image"?" · imagen":it.media_kind==="video"?" · video":it.media_kind==="audio"?" · audio":" · archivo");
    r.innerHTML=`<div class="row" style="align-items:center;gap:7px">
        ${prev}
        <input class="in en" style="flex:0 0 170px" value="${esc(it.nombre||"")}" placeholder="Nombre"/>
        <input class="in eu" style="flex:1" value="${esc(it.tipo==="archivo"?((it.filename||it.nombre||"archivo subido")+kindLabel):(it.url||""))}" ${it.tipo==="archivo"?"readonly":`placeholder="Pega el link — Drive, curso, acceso…"`}/>
        <button class="iconbtn edel" style="flex:0 0 auto">${icon("trash")}</button>
      </div>
      <input class="in emsg" style="margin-top:6px" value="${esc(it.mensaje||"")}" placeholder="Mensaje al entregar est${it.media_kind==="image"?"a imagen":it.media_kind==="video"?"e video":it.tipo==="archivo"?"e archivo":"e link"} (opcional) — ej. “Acá está tu curso 🎥”"/>`;
    r.querySelector(".en").oninput=(e)=>{ it.nombre=e.target.value; };
    r.querySelector(".eu").oninput=(e)=>{ it.url=e.target.value; };
    r.querySelector(".emsg").oninput=(e)=>{ it.mensaje=e.target.value; };
    r.querySelector(".edel").onclick=()=>{ items.splice(j,1); paintEntrega(el,v,fisico); };
    box.appendChild(r);
  });
}

// Sube un archivo de entrega (PDF, zip…) y lo agrega a la opción.
function pickEntregaFile(v,onDone){
  const inp=document.createElement("input"); inp.type="file";
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    toast("Subiendo…");
    try{
      const dataURL=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
      const { data,error }=await supa.functions.invoke("media-upload",{ body:{ channel_id:st.channelId, filename:file.name, content_type:file.type, data:dataURL } });
      if(error||!data?.url){ toast("No se pudo subir el archivo",true); return; }
      v.entrega=Array.isArray(v.entrega)?v.entrega:[];
      v.entrega.push({ tipo:"archivo", url:data.url, nombre:(file.name||"").replace(/\.[^.]+$/,""), filename:file.name, media_kind:data.kind||"document" });
      toast("Archivo agregado ✓"); if(onDone) onDone();
    }catch(e){ toast("Error al subir",true); }
  };
  inp.click();
}

// Si dos opciones ACTIVAS cuestan lo mismo, el monto pagado no alcanza para
// saber cuál eligió el cliente y la IA tendrá que confirmarlo por texto. Se
// avisa acá, al configurar — no en producción con una venta a medias.
function warnColision(){
  const box=$("opWarn"); if(!box) return;
  const act=st.versions.filter(v=>v.activo!==false && v.precio!=="" && v.precio!=null && !isNaN(Number(v.precio)));
  const seen={}, dup=[];
  act.forEach(v=>{ const k=String(Number(v.precio)); if(seen[k] && !dup.includes(k)) dup.push(k); seen[k]=true; });
  box.innerHTML = dup.length ? `
    <div class="card" style="border-color:#f0a92b;background:rgba(240,169,43,.07)">
      <div style="display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.6">
        <span style="color:#f0a92b;display:inline-flex;flex:none">${icon("alert")}</span>
        <div>Hay opciones activas con el <b>mismo precio</b> (${dup.map(d=>"S/ "+d).join(", ")}).
        El monto que pague no alcanzará para saber cuál eligió, así que la IA tendrá que
        <b>confirmárselo por texto</b> antes de entregar. Si prefieres que el pago lo resuelva solo,
        dales precios distintos.</div>
      </div>
    </div>` : "";
}

// Los ejemplos cambian con el tipo: pedirle la "talla" a quien vende un ebook
// no solo sobra, hace dudar de si el producto está bien configurado.
const EJ_ATRIBUTO = {
  fisico:  { nombre:"Ej. Talla, Color, Modelo", valores:"Ej. 38, 39, 40, 41, 42, 43, 44",
             ayuda:"Ej. Si no sabe su talla, ofrécele la guía de medidas",
             media:"guía de tallas, carta de colores…", vacio:"la talla, el color, etc.",
             donde:" y en el rótulo" },

             ayuda:"Ej. Si duda del idioma, dile que el material viene en los dos",
             media:"una muestra, un índice…", vacio:"algún dato antes de entregar (nombre, idioma, etc.)",
             donde:"" },
};

// Valores de un atributo como arreglo (el dato vive en a.valores como CSV).
function valsArr(a){ return String(a.valores||"").split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean); }
// Editor de valores en CASILLAS (chips): cada valor su etiqueta con ×; se agrega
// escribiendo + Enter (o coma). onChange corre tras cada cambio (guarda + refresca).
function paintVals(box, a, onChange){
  const arr=valsArr(a);
  box.innerHTML=arr.map((v,idx)=>`<span class="valchip" style="display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 6px 4px 10px;font-size:13px">${esc(v)}<button type="button" class="valx" data-i="${idx}" title="Quitar" style="border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:0 2px">×</button></span>`).join("")
    +`<input class="valnew" placeholder="${arr.length?"Otro…":"Ej. 38"}" style="border:none;background:transparent;outline:none;color:var(--text);font:inherit;flex:1;min-width:70px;padding:4px 2px"/>`;
  box.querySelectorAll(".valx").forEach(bx=> bx.onclick=()=>{ arr.splice(+bx.dataset.i,1); a.valores=arr.join(", "); onChange&&onChange(); paintVals(box,a,onChange); });
  const inp=box.querySelector(".valnew");
  const add=()=>{ const v=inp.value.trim(); if(!v) return false; inp.onblur=null; inp.value=""; arr.push(v); a.valores=arr.join(", "); onChange&&onChange(); paintVals(box,a,onChange); const ni=box.querySelector(".valnew"); if(ni) ni.focus(); return true; };
  inp.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===","){ e.preventDefault(); add(); } else if(e.key==="Backspace" && !inp.value && arr.length){ arr.pop(); a.valores=arr.join(", "); onChange&&onChange(); paintVals(box,a,onChange); const ni=box.querySelector(".valnew"); if(ni) ni.focus(); } };
  inp.onblur=()=>{ add(); };
  // Al tocar la caja (no un chip), enfoca el input para escribir.
  box.onclick=(e)=>{ if(e.target===box) inp.focus(); };
}
function paintAtributos(){
  const cfg=st.prod.config; const box=$("atList"); box.innerHTML="";

  if(!cfg.atributos.length){ box.innerHTML=`<div style="font-size:12px;color:var(--faint);padding:2px 0">Sin detalles todavía. Agrega uno si la IA debe preguntar ${EJ.vacio}</div>`; }
  cfg.atributos.forEach((a,i)=>{
    if(!Array.isArray(a.media)) a.media=[];
    if(!a.clave) a.clave=slugAttr(a.nombre)||("atributo"+(i+1));
    const el=document.createElement("div"); el.className="card"; el.style.marginBottom="10px";
    el.innerHTML=`
      <div class="row" style="align-items:flex-end;gap:10px">
        <div style="flex:1"><label style="margin-top:0">Nombre</label>
          <input class="in an" value="${esc(a.nombre||"")}" placeholder="${EJ.nombre}"/></div>
        <label class="chk" style="flex:0 0 auto;margin-bottom:9px"><input type="checkbox" class="ao" ${a.obligatorio!==false?"checked":""}/> Obligatorio</label>
        <button class="iconbtn adel" style="flex:0 0 auto;margin-bottom:6px" title="Eliminar">${icon("trash")}</button>
      </div>
      <div class="clhint" style="font-size:11px;color:var(--faint);margin-top:5px">La IA guarda lo que elija el cliente en <b style="color:var(--brand)">{{${esc(a.clave||"atributo")}}}</b> — aparece en el pedido${EJ.donde}.</div>
      <label>Valores posibles <span style="color:var(--faint);font-weight:400">(opcional — ej. las tallas)</span></label>
      <div class="avalbox" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);border-radius:10px;padding:7px;min-height:44px;background:var(--surface-2)"></div>
      <div style="font-size:11px;color:var(--faint);margin-top:4px">Escribe un valor y pulsa <b>Enter</b> para agregarlo como casilla. La IA los ofrece y confirma. Vacío = respuesta libre.</div>
      <label>Ayuda para la IA <span style="color:var(--faint);font-weight:400">(opcional)</span></label>
      <input class="in ahelp" value="${esc(a.ayuda||"")}" placeholder="${EJ.ayuda}"/>
      <label style="margin-top:12px">Multimedia de apoyo <span style="color:var(--faint);font-weight:400">— la IA lo envía cuando ayuda a decidir (${EJ.media})</span></label>
      <div class="atmm" style="margin-top:5px"></div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn atmadd" data-k="image" style="height:32px">${icon("image")} Imagen</button>
        <button class="btn atmadd" data-k="video" style="height:32px">Video</button>
        <button class="btn atmadd" data-k="document" style="height:32px">${icon("file")} Archivo</button>
      </div>`;
    const anI=el.querySelector(".an");
    anI.oninput=(e)=>{ a.nombre=e.target.value; a.clave=slugAttr(e.target.value); const h=el.querySelector(".clhint b"); if(h) h.textContent="{{"+(a.clave||"atributo")+"}}"; };
    anI.onblur=()=>{ prodSync(); };
    el.querySelector(".ao").onchange=(e)=>{ a.obligatorio=e.target.checked; prodSync(); };
    // Valores como CASILLAS (chips). Guarda internamente en a.valores CSV (el
    // motor y la grilla de stock lo siguen leyendo igual). Dispara 'change' para
    // que la grilla de stock (si el producto es físico) se regenere.
    const avalBox=el.querySelector(".avalbox");
    if(avalBox) paintVals(avalBox, a, ()=>{ prodSync(); avalBox.dispatchEvent(new Event("change",{bubbles:true})); });

function newVariant(idx){
  return { id:crypto.randomUUID(), nombre:"Variante "+String.fromCharCode(65+(idx||0)), activo:true, peso:1, bubbles:[{text:""}] };
}
async function renderActivacion(host){
  const b=host||$("tabBody");
  b.innerHTML=`<div id="actroot"><div class="empty">Cargando…</div></div>`;
  const root=$("actroot");
  const { data:flow } = await supa.from("flows").select("id,nombre,estado,role")
    .eq("product_id",st.prod.id).eq("role","mensajes_iniciales").eq("kind","flow").maybeSingle();
  st.act={ flow:flow||null, node:null, kw:null, ad:null, others:[] };
  if(!flow){
    root.innerHTML=`<div class="card">

    $("createWelcome").onclick=createWelcome;
    return;
  }
  const { data:nodes } = await supa.from("flow_nodes").select("id,tipo,config,es_inicial").eq("flow_id",flow.id);
  let node=(nodes||[]).find(n=>n.tipo==="rotador")||(nodes||[]).find(n=>n.es_inicial);
  if(!node){
    const { data:nn } = await supa.from("flow_nodes").insert({ flow_id:flow.id, tipo:"rotador", nombre:"Mensajes iniciales", es_inicial:true, config:{activo:true,variantes:[newVariant(0)],despues:{modo:"nada"}}, pos_x:80, pos_y:80 }).select("id,tipo,config,es_inicial").single();
    node=nn;
  }
  const { data:trigs } = await supa.from("flow_triggers").select("id,tipo,config,activo").eq("flow_id",flow.id);
  const { data:others } = await supa.from("flows").select("id,nombre,estado,role").eq("product_id",st.prod.id).eq("kind","flow").neq("id",flow.id).order("created_at");
  node.config=node.config||{};
  if(!Array.isArray(node.config.variantes)) node.config.variantes=[];
  if(!node.config.variantes.length) node.config.variantes.push(newVariant(0));
  if(node.config.activo===undefined) node.config.activo=true;
  node.config.despues=node.config.despues||{modo:"nada"};
  st.act={ flow, node, kw:(trigs||[]).find(t=>t.tipo==="keyword")||null, ad:(trigs||[]).find(t=>t.tipo==="referral")||null, others:others||[] };
  // Ángulos del producto + anuncios reales de Meta (para elegirlos por nombre).
  // Defensivo: si la migración 0063 aún no está, quedan vacíos (la card lo avisa).
  st.act.angulos=[]; st.act.angulosOrig=[]; st.act.adsMeta=[]; st.act.angulosOk=true;
  try {
    const { data:angs, error:ea } = await supa.from("angulos").select("id,nombre,slug,ad_ids,gancho_ia,orden").eq("product_id",st.prod.id).order("orden");
    if(ea) throw ea;
    st.act.angulos=(angs||[]).map(a=>({...a, ad_ids:Array.isArray(a.ad_ids)?a.ad_ids:[]}));
    st.act.angulosOrig=(angs||[]).map(a=>a.id);
  } catch(_){ st.act.angulosOk=false; }
  try {
    const { data:adsm } = await supa.from("ads_meta").select("ad_id,ad_name,campaign_name").eq("channel_id",st.channelId).order("campaign_name");
    st.act.adsMeta=adsm||[];
  } catch(_){ st.act.adsMeta=[]; }
  renderComposer();
}

// slug estable a partir del nombre del ángulo.
function anguloSlug(nombre){ return String(nombre||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||("ang"+Date.now()); }
// Pinta las filas de ángulos (nombre + gancho IA + anuncios). Los anuncios se
// eligen de ads_meta (por nombre) si Meta está conectado; si no, se pegan IDs.
function renderAngList(){
  const host=$("angList"); if(!host) return;
  const angs=st.act.angulos||[]; const adsMeta=st.act.adsMeta||[];
  if(!angs.length){ host.innerHTML=`<div style="font-size:12px;color:var(--faint);padding:4px 0 10px">Aún no hay ángulos. Agrega el primero (ej. "Dolor / calambres").</div>`; return; }
  host.innerHTML=angs.map((a,i)=>{
    const adsHtml = adsMeta.length
      ? `<div style="font-size:11px;color:var(--muted);margin:8px 0 5px">Anuncios de este ángulo</div><div style="max-height:150px;overflow:auto;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);border-radius:8px;padding:8px">${adsMeta.map(m=>`<label style="display:flex;gap:7px;align-items:center;font-size:12.5px;cursor:pointer"><input type="checkbox" class="ang-ad" value="${esc(m.ad_id)}"${(a.ad_ids||[]).map(String).includes(String(m.ad_id))?" checked":""}/> <span>${esc(m.ad_name||m.ad_id)}${m.campaign_name?` <span style="color:var(--faint)">· ${esc(m.campaign_name)}</span>`:''}</span></label>`).join("")}</div>`
      : `<div style="font-size:11px;color:var(--muted);margin:8px 0 5px">Anuncios de este ángulo — pega el <b>ID</b> y presiona Enter. (Conecta Meta Ads en Ajustes para elegirlos por su nombre.)</div>
         <div class="ang-chips" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:7px;min-height:40px">
           ${(a.ad_ids||[]).map(id=>`<span class="ad-chip" style="display:inline-flex;align-items:center;gap:6px;background:var(--brand-bg);border:1px solid var(--brand-border);border-radius:20px;padding:3px 6px 3px 11px;font-size:12px;color:var(--brand-2)"><span class="mono">${esc(id)}</span><button class="ad-chip-x" data-id="${esc(id)}" title="Quitar" style="border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:0">✕</button></span>`).join("")}
           <input class="ad-chip-in" style="border:0;outline:none;background:transparent;font-size:12.5px;flex:1;min-width:160px;color:var(--text);height:24px" placeholder="Pega un ID de anuncio y Enter"/>
         </div>`;
    return `<div class="ang-row" data-ai="${i}" style="border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="display:flex;gap:8px;align-items:center">
        <input class="in ang-nombre" style="flex:1;font-weight:600" placeholder="Nombre del ángulo (ej. Dolor / calambres)" value="${esc(a.nombre||'')}"/>
        <button class="iconbtn ang-del" title="Eliminar ángulo">${icon("trash")}</button>
      </div>
      ${ganchoIAHtml(a.gancho_ia, "ang-gancho")}
      ${adsHtml}
    </div>`;
  }).join("");
  host.querySelectorAll(".ang-del").forEach(btn=> btn.onclick=()=>{
    harvest(); harvestAngulos();
    const ai=+btn.closest(".ang-row").dataset.ai;
    const elim=st.act.angulos[ai]; st.act.angulos.splice(ai,1);
    // Limpia las variantes que apuntaban al ángulo borrado (si no, el selector
    // "Responde al ángulo" seguía ofreciéndolo). renderComposer re-pinta los selects.
    if(elim&&elim.slug) (st.act.node.config.variantes||[]).forEach(v=>{ if(v.angulo===elim.slug) v.angulo=""; });
    renderComposer();
  });
  // Chips de anuncios (fallback sin Meta): agregar con Enter, quitar con ✕.
  host.querySelectorAll(".ad-chip-in").forEach(inp=> inp.onkeydown=(e)=>{
    if(e.key!=="Enter") return; e.preventDefault();
    const ai=+inp.closest(".ang-row").dataset.ai, val=inp.value.trim(); if(!val) return;
    harvestAngulos(); const a=st.act.angulos[ai]; a.ad_ids=a.ad_ids||[];
    val.split(/[\s,]+/).map(x=>x.trim()).filter(Boolean).forEach(id=>{ if(!a.ad_ids.includes(id)) a.ad_ids.push(id); });

  host.querySelectorAll(".ad-chip-x").forEach(btn=> btn.onclick=()=>{

  });

// Lee las filas de ángulos del DOM a st.act.angulos (preserva id/slug por índice).
// Lee del DOM el ángulo ACTIVO (solo se renderiza uno a la vez en el rediseño por
// pestañas) y lo actualiza EN SITIO en st.act.angulos (los demás viven en memoria).
// Los ad_ids por chips ya se mantienen en memoria; solo los checkboxes se leen acá.
function harvestAngulos(){
  document.querySelectorAll("#actroot .ang-row[data-ai]").forEach(row=>{
    const ai=+row.dataset.ai; const a=st.act.angulos[ai]; if(!a) return;
    const nm=row.querySelector(".ang-nombre"); if(nm) a.nombre=nm.value.trim();
    const gn=row.querySelector(".ang-gancho"); if(gn) a.gancho_ia=gn.value.trim();
    const checks=row.querySelectorAll(".ang-ad");
    if(checks.length) a.ad_ids=[...checks].filter(c=>c.checked).map(c=>c.value);
  });
}
// Persiste los ángulos: upsert de los que tienen nombre, delete de los borrados.
async function saveAngulos(){
  harvestAngulos();
  const angs=st.act.angulos.filter(a=>a.nombre);
  const usados=new Set();
  angs.forEach((a,i)=>{ let s=a.slug||anguloSlug(a.nombre); let base=s,n=2; while(usados.has(s)){ s=base+"-"+(n++); } usados.add(s); a.slug=s; a.orden=i; });
  try{
    for(const a of angs){
      const payload={ channel_id:st.channelId, product_id:st.prod.id, nombre:a.nombre, slug:a.slug, ad_ids:a.ad_ids||[], gancho_ia:a.gancho_ia||null, orden:a.orden };
      if(a.id){ const {error}=await supa.from("angulos").update(payload).eq("id",a.id); if(error) throw error; }
      else { const {data:ins,error}=await supa.from("angulos").insert(payload).select("id").single(); if(error) throw error; if(ins) a.id=ins.id; }
    }
    const vivos=new Set(angs.map(a=>a.id).filter(Boolean));
    for(const id of (st.act.angulosOrig||[])){ if(!vivos.has(id)) await supa.from("angulos").delete().eq("id",id); }
    st.act.angulos=angs; st.act.angulosOrig=angs.map(a=>a.id);
    toast("Ángulos guardados ✓"); renderComposer();
  }catch(e){ toast(e.message||"No se pudo guardar los ángulos",true); }
}

//    ángulo (une ángulos + mensajes iniciales en pestañas) + un solo Guardar. ──
function renderComposer(){
  const root=$("actroot"); const cfg=st.act.node.config;

// Guardado ÚNICO de la sección: ángulos + nodo de mensajes iniciales + disparadores.
async function saveActivacion(){
  harvest(); harvestAngulos();
  if(st.act.angulosOk){
    try{
      const angs=st.act.angulos.filter(a=>a.nombre);
      const usados=new Set();
      angs.forEach((a,i)=>{ let s=a.slug||anguloSlug(a.nombre); let base=s,n=2; while(usados.has(s)){ s=base+"-"+(n++); } usados.add(s); a.slug=s; a.orden=i; });
      for(const a of angs){
        const payload={ channel_id:st.channelId, product_id:st.prod.id, nombre:a.nombre, slug:a.slug, ad_ids:a.ad_ids||[], gancho_ia:a.gancho_ia||null, orden:a.orden };
        if(a.id){ const {error}=await supa.from("angulos").update(payload).eq("id",a.id); if(error) throw error; }
        else { const {data:ins,error}=await supa.from("angulos").insert(payload).select("id").single(); if(error) throw error; if(ins) a.id=ins.id; }
      }
      const vivos=new Set(angs.map(a=>a.id).filter(Boolean));
      for(const id of (st.act.angulosOrig||[])){ if(!vivos.has(id)) await supa.from("angulos").delete().eq("id",id); }
      st.act.angulos=angs; st.act.angulosOrig=angs.map(a=>a.id);
    }catch(e){ toast(e.message||"No se pudieron guardar los ángulos",true); return; }
  }
  const cfg=st.act.node.config;
  cfg.variantes.forEach(v=>{ v.bubbles=limpiaBotones((v.bubbles||[]).filter(b=> b.media_url || (b.text&&b.text.trim()))); });
  cfg.variantes=cfg.variantes.filter(v=> v.bubbles.length);
  if(!cfg.variantes.length) cfg.variantes.push(newVariant(0));
  const { error:eN }=await supa.from("flow_nodes").update({ config:cfg }).eq("id",st.act.node.id);
  if(eN){ toast(eN.message,true); return; }
  const kwArr=(($("actKw")?.value)||"").split(",").map(s=>s.trim()).filter(Boolean);
  const matchV=($("actMatch")?.value)||"contiene";
  await saveTrigger("keyword","kw", kwArr.length?{keywords:kwArr,match:matchV}:null);
  const adArr=(($("actAds")?.value)||"").split(",").map(s=>s.trim()).filter(Boolean);
  await saveTrigger("referral","ad", adArr.length?{ad_ids:adArr}:null);
  toast("Guardado ✓"); accRerender("activacion"); refreshActivacionRow();
}

function renderBubble(v,vi,bub,bi){
  const el=document.createElement("div"); el.dataset.bi=bi;
  el.style.cssText="border:1px solid var(--border);border-radius:9px;padding:9px 10px;background:var(--surface)";
  const isMedia=!!bub.media_url;
  const kind=bub.media_kind||"text";
  const tIco={text:"note",image:"image",video:"video",audio:"mic",document:"file"}[kind]||"note";
  let preview="";
  if(kind==="image") preview=`<img src="${esc(bub.media_url)}" style="max-width:140px;max-height:100px;border-radius:7px;display:block;margin-bottom:7px"/>`;
  else if(kind==="video") preview=`<video src="${esc(bub.media_url)}" style="max-width:180px;max-height:120px;border-radius:7px;display:block;margin-bottom:7px" controls></video>`;
  else if(kind==="audio") preview=`<audio src="${esc(bub.media_url)}" style="height:34px;margin-bottom:7px;display:block" controls></audio>`;
  else if(kind==="document") preview=`<div style="font-size:12px;margin-bottom:7px;display:flex;align-items:center;gap:5px">${icon("file")} ${esc(bub.filename||"documento")}</div>`;
  el.innerHTML=`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:${isMedia?'8px':'6px'}">
      <span style="display:inline-flex;color:var(--muted)">${icon(tIco)}</span>
      <span style="font-size:11px;color:var(--muted);font-weight:600;flex:1">${kind==="text"?"Texto":kind.charAt(0).toUpperCase()+kind.slice(1)}</span>
      <button class="iconbtn bup" title="Subir">▲</button>
      <button class="iconbtn bdown" title="Bajar">▼</button>
      <button class="iconbtn bdel" title="Quitar">${icon("trash")}</button>
    </div>
    ${preview}
    ${kind==="text"
      ? `<textarea class="in btext" style="field-sizing:content;min-height:58px;max-height:320px;overflow:auto;padding:8px 10px;line-height:1.45;font-family:var(--font);resize:vertical" placeholder="Escribe el mensaje… puedes usar {{nombre}}, {{precio}}…">${esc(bub.text||"")}</textarea>${botonesHtml(bub)}`
      : (kind!=="audio"?`<input class="in bcap" placeholder="Texto/caption (opcional)" value="${esc(bub.caption||"")}"/>`:``)}`;
  if(kind==="text") wireBotones(el,bub,()=>{ harvest(); renderComposer(); });
  el.querySelector(".bdel").onclick=()=>{ harvest(); v.bubbles.splice(bi,1); if(!v.bubbles.length) v.bubbles.push({text:""}); renderComposer(); };
  el.querySelector(".bup").onclick=()=>{ if(bi===0)return; harvest(); [v.bubbles[bi-1],v.bubbles[bi]]=[v.bubbles[bi],v.bubbles[bi-1]]; renderComposer(); };
  el.querySelector(".bdown").onclick=()=>{ if(bi>=v.bubbles.length-1)return; harvest(); [v.bubbles[bi+1],v.bubbles[bi]]=[v.bubbles[bi],v.bubbles[bi+1]]; renderComposer(); };
  return el;
}

function pickMedia(vi,kind){
  const accept={image:"image/*",video:"video/*",audio:"audio/*"}[kind]||"*/*";
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept;
  inp.onchange=async()=>{
    const file=inp.files&&inp.files[0]; if(!file) return;
    toast("Subiendo…");
    try{
      const dataURL=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); });
      const { data,error }=await supa.functions.invoke("media-upload",{ body:{ channel_id:st.channelId, filename:file.name, content_type:file.type, data:dataURL } });
      if(error||!data?.url){ toast("No se pudo subir el archivo",true); return; }
      st.act.node.config.variantes[vi].bubbles.push({ media_kind:data.kind||kind, media_url:data.url, mime:file.type, filename:file.name, caption:"" });
      toast("Archivo agregado ✓"); renderComposer();
    }catch(e){ toast("Error al subir",true); }
  };
  inp.click();
}

// Palabras que arrancan una venta sola. Una clave demasiado común o corta hace
// que el bot salte a vender en medio de una conversación que no venía a eso —
// y eso se descubre tarde, con un cliente real. Se avisa, no se impide: puede
// haber un caso donde de verdad la quieras.
const KW_COMUNES = new Set([
  "hola","buenas","info","informacion","información","precio","precios","cuanto","cuánto",
  "si","sí","no","ok","gracias","ayuda","quiero","comprar","pedido","envio","envío",
  "pago","pagar","activar","hey","alo","aló","buenos dias","buenas tardes","buenas noches",
]);
function avisarKeywords(){
  const box=$("kwAviso"); if(!box) return;
  const modo=($("actMatch")?.value)||"contiene";
  const kws=(($("actKw")?.value)||"").split(",").map(s=>s.trim()).filter(Boolean);
  const avisos=[];
  for(const k of kws){
    const n=k.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    if(modo==="exacta") continue;                       // exacta no se dispara sola
    if(KW_COMUNES.has(n) || KW_COMUNES.has(k.toLowerCase()))
      avisos.push(`<b>${esc(k)}</b> es una palabra muy común: un cliente puede escribirla sin querer comprar esto.`);
    else if(n.length<=3)
      avisos.push(`<b>${esc(k)}</b> tiene solo ${n.length} letras: es fácil que aparezca dentro de otra frase.`);
  }
  box.innerHTML = avisos.length
    ? `<div style="margin-top:9px;border:1px solid var(--amber);border-radius:10px;padding:9px 11px;background:rgba(240,169,43,.08)">
         <div style="font-size:12px;font-weight:700;color:var(--amber);margin-bottom:3px">Ojo con estas palabras</div>
         <div style="font-size:11.5px;color:var(--muted);line-height:1.55">${avisos.join("<br>")}
         <div style="margin-top:5px">Si igual la quieres, prueba el modo <b>Exacta</b>: solo dispara si el mensaje es justo esa palabra.</div></div>
       </div>`
    : "";
}

async function saveWelcome(){
  harvest();
  const cfg=st.act.node.config;
  // Limpia burbujas de texto vacías; descarta variantes sin burbujas.
  cfg.variantes.forEach(v=>{ v.bubbles=limpiaBotones((v.bubbles||[]).filter(b=> b.media_url || (b.text&&b.text.trim()))); });
  cfg.variantes=cfg.variantes.filter(v=> v.bubbles.length);
  if(!cfg.variantes.length) cfg.variantes.push(newVariant(0));
  const { error:eN }=await supa.from("flow_nodes").update({ config:cfg }).eq("id",st.act.node.id);
  if(eN){ toast(eN.message,true); return; }
  // Disparadores
  const kwArr=($("actKw").value||"").split(",").map(s=>s.trim()).filter(Boolean);
  const match=$("actMatch").value;
  await saveTrigger("keyword", "kw", kwArr.length?{keywords:kwArr,match}:null);
  const adArr=($("actAds").value||"").split(",").map(s=>s.trim()).filter(Boolean);
  await saveTrigger("referral", "ad", adArr.length?{ad_ids:adArr}:null);
  toast("Guardado ✓"); accRerender("activacion"); refreshActivacionRow();
}
async function saveTrigger(tipo, key, config){
  const existing=st.act[key];
  if(config){
    if(existing){ await supa.from("flow_triggers").update({config}).eq("id",existing.id); }
    else { await supa.from("flow_triggers").insert({ channel_id:st.channelId, flow_id:st.act.flow.id, tipo, config, activo:true }); }
  } else if(existing){ await supa.from("flow_triggers").delete().eq("id",existing.id); }
}

async function saveProduct(){
  if(!st.prod){ return; }
  // Recompila el conocimiento del producto a config.contexto_producto (lo que
  // el motor inyecta) por si se guarda sin haber tocado el formulario.
  if(st.prod.config){
    const c=st.prod.config; c.ia=c.ia||{};
    // MIGRACIÓN DE SEGURIDAD (antes de recompilar): si el conocimiento viejo vive
    // en contexto_producto pero nunca se migró a la ficha nueva (config.ia) —porque
    // no se abrió la pestaña "Cómo lo vende la IA"—, migrarlo AHORA. Sin esto, el
    // recompile de abajo produciría vacío y BORRARÍA el conocimiento (pérdida de
    // datos silenciosa al guardar desde cualquier otra pestaña). Espeja la
    // migración de renderProductoIA.
    if(!c.ia.detalle && c.contexto_producto && !c.ia._migrado){ c.ia.detalle=c.contexto_producto; c.ia._migrado=true; }
    const cx=compileProductoIA(c, st.prod.tipo||"digital");
    if(cx) c.contexto_producto=cx; else delete c.contexto_producto;
    // Atributos: descarta los sin nombre y asegura una clave estable (la usa el
    // motor para {{clave}}, el campo del contacto y el tag de su multimedia).
    if(Array.isArray(c.atributos)){
      c.atributos=c.atributos.filter(a=>a&&String(a.nombre||"").trim());
      const usadas=new Set();
      c.atributos.forEach((a,i)=>{
        let k=slugAttr(a.nombre)||("atributo"+(i+1)); let base=k, n=2;
        while(usadas.has(k)) k=base+"_"+n++;
        usadas.add(k); a.clave=k;
        if(!Array.isArray(a.media)) a.media=[];
      });
    }
  }
  const base={ nombre:st.prod.nombre, config:st.prod.config||{}, updated_at:new Date().toISOString() };
  let { error:e1 } = await supa.from("products").update({ ...base, folder:st.prod.folder||null, emoji:st.prod.emoji||null, tipo:st.prod.tipo||"digital" }).eq("id",st.prod.id);
  if(e1 && /tipo|column/.test(e1.message)){ ({ error:e1 } = await supa.from("products").update({ ...base, folder:st.prod.folder||null, emoji:st.prod.emoji||null }).eq("id",st.prod.id)); if(!e1) toast("Guardado (aplica 0022 para el tipo físico)"); }
  if(e1 && /folder|emoji|column/.test(e1.message)){ ({ error:e1 } = await supa.from("products").update(base).eq("id",st.prod.id)); if(!e1) toast("Guardado (aplica 0018 para carpeta/emoji)"); }
  if(e1){ toast(e1.message,true); return; }
  // ── Opciones de compra (migración 0029) ──
  // Primero las eliminadas: antes se marcaba v._delete pero nunca se borraban
  // de la base, así que "eliminar" no eliminaba nada al recargar.
  for(const id of (st.delVersions||[])){
    const { error } = await supa.from("product_versions").delete().eq("id",id);
    if(error){ toast(error.message,true); return; }
  }
  st.delVersions=[];
  for(let i=0;i<st.versions.length;i++){
    const v=st.versions[i]; v.orden=i; v.product_id=st.prod.id;
    const row={
      product_id:st.prod.id, nombre:v.nombre||"Única", orden:i,
      precio:(v.precio===""||v.precio==null)?null:Number(v.precio),
      costo:(v.costo===""||v.costo==null)?null:Number(v.costo),
      cantidad:Number(v.cantidad)||1,
      descripcion:v.descripcion||null,
      // Se descartan las filas de entrega sin link: no entregan nada y harían
      // que "Salud del producto" diera el visto bueno a una opción rota.
      entrega:(Array.isArray(v.entrega)?v.entrega:[]).filter(it=>it&&String(it.url||"").trim()),
      entrega_mensaje:(v.entrega_mensaje||"").trim()||null,
      activo:v.activo!==false,
      price_list:v.price_list||[], drive_link:v.drive_link||null, // legado
    };
    if(v.id) row.id=v.id;
    let { data, error } = await supa.from("product_versions").upsert(row).select("id").single();
    if(error && /precio|costo|entrega|descripcion|activo|cantidad|entrega_mensaje|column/.test(error.message)){
      // Resiliente: si 0029 no está aplicada, guarda al menos lo viejo.
      const legacy={ product_id:st.prod.id, nombre:v.nombre||"Única", price_list:v.price_list||[], drive_link:v.drive_link||null, orden:i };
      if(v.id) legacy.id=v.id;
      ({ data, error } = await supa.from("product_versions").upsert(legacy).select("id").single());
      if(!error) toast("Guardado (aplica 0029 para las opciones de compra)");
    }
    if(error){ toast(error.message,true); return; }
    if(!v.id && data) v.id=data.id;
  }
  markClean(); toast("Guardado ✓"); loadProducts();
}

// ASISTENTE "Armar con IA" (capa Crea): brief → borrador del producto.
// Llama a la función armar-producto (Claude u OpenAI, el activo del canal),
// muestra el borrador (verde = lo que llenó, ámbar = lo que falta) y lo
// aplica a los formularios EN MEMORIA. No guarda: el dueño revisa y Guarda.
// ════════════════════════════════════════════════════════════════════
let armDraft=null;
const ARM_CHK='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const ARM_ALERT='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
function armOpen(){
  if(!st.prod) return;
  armDraft=null;
  const sub=$("armSub"); if(sub) sub.textContent=`Producto · ${st.prod.nombre||"nuevo"}`;
  armRenderBrief();
  $("armOv").classList.add("on");
  setTimeout(()=>{ const t=$("armBrief"); if(t) t.focus(); },80);
}
function armClose(){ const o=$("armOv"); if(o) o.classList.remove("on"); }
function armRenderBrief(){
  const tipo=st.prod?.tipo||"digital";
  const ej = tipo==="fisico"
    ? "Ej. Vendo zapatillas Runner para correr, físicas. Envío por Shalom a todo el Perú, tallas 38 al 44, varios colores. Hago pack de 2 pares con descuento."
    : "Ej. Vendo un curso de Excel en video (digital), acceso por Drive de por vida, con plantillas y certificado. Tengo versión Básica y Premium.";
  $("armBody").innerHTML=`
    <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 12px">Cuéntame de tu producto en tus palabras (o pega una descripción). La IA arma un <b>borrador</b> de toda la ficha; tú lo revisas y guardas. <b>No inventa</b> precios ni tu Yape — esos los marca para que los completes.</p>
    <textarea class="in" id="armBrief" rows="6" style="min-height:130px;line-height:1.55;font-family:var(--font);resize:vertical" placeholder="${esc(ej)}"></textarea>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
      <button class="armchip" data-ins="Es un producto físico, lo envío por agencia a provincia.">+ físico / envío</button>
      <button class="armchip" data-ins="Tengo variantes con distinto precio (básico y premium).">+ variantes</button>
      <button class="armchip" data-ins="Ofrezco un descuento si compran 2 o más.">+ oferta</button>
    </div>`;
  $("armFt").innerHTML=`<button id="armGo" style="width:100%;height:44px;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(90deg,var(--ia1,#a855f7),var(--ia2,#ec4899));color:#fff;font-size:14px;font-weight:700">Armar borrador ✨</button>`;
  $("armGo").onclick=armGenerar;
  $("armBody").querySelectorAll("[data-ins]").forEach(bt=> bt.onclick=()=>{ const t=$("armBrief"); t.value=(t.value.trim()?t.value.trim()+" ":"")+bt.dataset.ins; t.focus(); });
}
async function armGenerar(){
  const brief=($("armBrief")?.value||"").trim();
  if(brief.length<10){ toast("Escribe un poco más sobre tu producto",true); return; }
  $("armFt").innerHTML=`<button disabled style="width:100%;height:44px;border:1px solid var(--border);border-radius:11px;background:var(--surface-2);color:var(--muted);font-weight:600">Armando… ✨</button>`;
  let data,error;
  try{ ({ data, error } = await supa.functions.invoke("armar-producto",{ body:{ channel_id:st.channelId, brief, tipo:st.prod?.tipo } })); }
  catch(e){ error=e; }
  if(error || !data?.ok || !data?.draft){
    const msg=data?.error||error?.message||"No se pudo armar. Intenta de nuevo.";
    toast(msg,true); armRenderBrief(); const t=$("armBrief"); if(t) t.value=brief; return;
  }
  armDraft=data.draft; armRenderDraft();
}
function armRenderDraft(){
  const d=armDraft||{};
  const done=[];
  if(d.nombre) done.push("Producto · "+esc(String(d.nombre))+(d.tipo?` (${esc(String(d.tipo))})`:""));
  if(Array.isArray(d.presentaciones)&&d.presentaciones.length) done.push(`Presentaciones · ${d.presentaciones.length}`);
  if(d.ia&&(d.ia.resumen||d.ia.detalle)) done.push("Venta con IA · pitch y detalle");
  if(Array.isArray(d.atributos)&&d.atributos.length) done.push(`Detalles a preguntar · ${d.atributos.length}`);
  if(Array.isArray(d.faq)&&d.faq.length) done.push(`Preguntas frecuentes · ${d.faq.length}`);
  const faltan=Array.isArray(d.faltan)?d.faltan:[];
  const chk=(t)=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px"><span style="color:var(--green,#22c079);flex:none;display:inline-flex">${ARM_CHK}</span>${t}</div>`;
  const amb=(t)=>`<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:6px"><span style="color:#f0a92b;flex:none;display:inline-flex">${ARM_ALERT}</span>${esc(String(t))}</div>`;
  $("armBody").innerHTML=`
    <div style="font-size:13.5px;font-weight:700;margin-bottom:4px">Borrador listo 🎉</div>
    <div style="font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:12px">${esc(String(d.resumen_cambios||"Revisa lo que llené y ajústalo. Nada se guarda hasta que toques Guardar cambios."))}</div>
    <div style="border:1px solid var(--border);border-radius:11px;padding:12px">${done.map(chk).join("")||"<div style='font-size:12px;color:var(--faint)'>Sin campos</div>"}</div>
    ${faltan.length?`<div style="margin:12px 0 6px;font-size:12px;font-weight:700;color:#f0a92b">Te toca completar (no lo invento):</div><div style="border:1px solid rgba(240,169,43,.4);background:rgba(240,169,43,.06);border-radius:11px;padding:12px">${faltan.map(amb).join("")}</div>`:""}`;
  $("armFt").innerHTML=`
    <button id="armApply" style="width:100%;height:44px;border:none;border-radius:11px;cursor:pointer;background:linear-gradient(90deg,var(--ia1,#a855f7),var(--ia2,#ec4899));color:#fff;font-size:14px;font-weight:700">Aplicar borrador</button>
    <button class="btn" id="armBack" style="width:100%">Volver a escribir</button>`;
  $("armApply").onclick=()=>armAplicar(armDraft);
  $("armBack").onclick=armRenderBrief;
}
function armAplicar(d){
  if(!d||!st.prod) return;
  const p=st.prod; const c=p.config=p.config||{};
  if(d.nombre) p.nombre=String(d.nombre);
  if(d.emoji) p.emoji=String(d.emoji);
  if(d.tipo==="fisico"||d.tipo==="digital") p.tipo=d.tipo;
  if(Array.isArray(d.atributos)&&d.atributos.length){
    c.atributos=d.atributos.filter(a=>a&&a.nombre).map(a=>({ nombre:String(a.nombre), clave:slugAttr(a.nombre), obligatorio:true, valores:a.valores?String(a.valores):"", ayuda:"", media:[] }));
  }
  const dia=d.ia||{}; c.ia=c.ia||{};
  ["resumen","detalle","reglas_producto","limites","estilo_venta","proceso","tecnicas"].forEach(k=>{ if(dia[k]) c.ia[k]=String(dia[k]); });
  if(Array.isArray(d.faq)&&d.faq.length){
    c.faq_items=d.faq.filter(f=>f&&f.q&&f.a).map(f=>({q:String(f.q),a:String(f.a)}));
    c.faq=compileFaq(c.faq_items);
  }
  // Presentaciones: solo si aún no hay precios (no pisar lo que ya pusiste).
  if(Array.isArray(d.presentaciones)&&d.presentaciones.length){
    const tienePrecio=(st.versions||[]).some(v=>Number(v.precio)>0);
    if(!tienePrecio){
      (st.versions||[]).forEach(v=>{ if(v.id) st.delVersions.push(v.id); });
      st.versions=d.presentaciones.filter(x=>x&&x.nombre).map((x,i)=>({ nombre:String(x.nombre), precio:"", cantidad:Number(x.cantidad)||1, descripcion:x.descripcion?String(x.descripcion):"", entrega:[], activo:true, orden:i }));
    }
  }
  prodSync(); st.tab="inicio"; renderDetail(); armClose();
  toast("Borrador aplicado ✓ — revisa y Guarda cambios");
}
// Wiring del asistente (los elementos son HTML estático, ya existen).
if($("armFab")) $("armFab").onclick=armOpen;
if($("armClose")) $("armClose").onclick=armClose;
if($("armOv")) $("armOv").onclick=(e)=>{ if(e.target===$("armOv")) armClose(); };

boot();
</script>
