<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nodo.theme")||"dark"}catch(e){}</script>
<title>Nodo · Rendimiento</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
<link rel="stylesheet" href="shell.css" />
<style>
  :root{
    --bg:#0e1116; --surface:#151a21; --surface-2:#1b222c; --border:#232b36; --border-2:#2b3644;
    --text:#e7ecf2; --muted:#8a97a8; --faint:#5c6675;
    --brand:#2b7fff; --brand-2:#1e6ff0; --brand-bg:#12233f;
    --green:#22c079; --green-bg:#10281d; --amber:#f0a92b; --amber-bg:#2c2311; --red:#e2564a; --red-bg:#2c1615;
    --violet:#8b5cf6; --violet-bg:#1e1633;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .num{font-variant-numeric:tabular-nums}

  .demopill{display:inline-flex;align-items:center;gap:7px;background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
  .demopill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
  .okpill{display:inline-flex;align-items:center;gap:7px;background:var(--green-bg);color:var(--green);border:1px solid var(--green);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:700;white-space:nowrap}
  /* «Actualizar» va AL LADO de la píldora de estado, así que comparte su forma y su altura:
     un botón de formulario ahí rompía la línea y pesaba más que el dato que acompaña. Es una
     acción secundaria — se nota al pasar el mouse, no antes. */
  .pillbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--muted);
           border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11.5px;
           font-weight:700;white-space:nowrap;cursor:pointer;line-height:1.25;padding-top:4px;padding-bottom:4px;
           transition:color .15s,border-color .15s,background .15s}
  .pillbtn:hover:not(:disabled){color:var(--text);border-color:var(--border-strong,var(--muted));background:var(--surface-2)}
  .pillbtn:disabled{opacity:.55;cursor:default}
  .pillbtn .ico{width:13px;height:13px}
  /* Gira mientras baja el gasto: sin esto, una corrida de varios segundos no se distinguía
     de un botón que no hizo nada. */
  .pillbtn.cargando .ico{animation:girar .9s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}

  .notice{margin:2px 0 18px;display:flex;gap:11px;align-items:flex-start;background:var(--brand-bg);border:1px solid #2b7fff55;border-radius:13px;padding:12px 15px;font-size:12.5px;line-height:1.5}
  .notice svg{width:17px;height:17px;color:var(--brand);flex:none;margin-top:1px}
  .notice a{color:var(--brand);font-weight:700;text-decoration:none}

  /* Toolbar */
  .toolbar{display:flex;gap:9px 14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .tlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700}
  .chips{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px}
  .chip{border:none;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:8px;cursor:pointer}
  .chip.on{background:var(--brand);color:#fff;font-weight:700}
  /* Sin margin-left:auto A PROPÓSITO: con él, el grupo de vistas quedaba pegado a la
     derecha y su posición dependía de lo que hubiera después (Tipo, Cuenta, Columnas).
     Como esos grupos no se pintan en "Por copy", al cambiar de vista los botones se
     corrían ~80px y el que ibas a tocar ya no estaba ahí. Ahora fluye desde la izquierda
     junto al periodo: quieto en las cuatro vistas. */
  .seg{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px}
  .seg button{border:none;background:none;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .seg button.on{background:var(--brand);color:#fff}
  .seg svg{width:14px;height:14px}
  .colbtn{position:relative;margin-left:auto}
  .colbtn>button{height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
  .colbtn>button:hover{border-color:var(--brand)}
  .colbtn svg{width:14px;height:14px}
  .colpop{position:absolute;top:calc(100% + 6px);right:0;z-index:40;width:230px;max-height:320px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 14px 36px rgba(0,0,0,.45);display:none;flex-direction:column;gap:1px}
  .colpop.show{display:flex}
  .colpop .gl{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:800;padding:8px 8px 3px}
  .colpop label{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer}
  .colpop label:hover{background:var(--surface-2)}
  .colpop input{accent-color:var(--brand);width:15px;height:15px}

  /* El selector de rango de fechas trae su propio CSS (date-range.js) */

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
  .kpi .kd{width:8px;height:8px;border-radius:2px}
  .kpi .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:5px}
  .kpi .s{font-size:11px;color:var(--faint);margin-top:2px}
  /* 💸 Mensajes que Meta cobra: encabezado + tarifa a la derecha + tabla corta */
  .vent{padding:14px 16px 6px}
  .vh{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
  .vh h3{margin:0 0 3px;font-size:15px;font-weight:650;letter-spacing:-.2px}
  .vh p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5;max-width:640px}
  .vt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .vt label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .vt input{width:150px;padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
  .vt button{padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .vent .scroll{margin:0 -16px}
  .vent tbody td:first-child,.vent thead th:first-child,.vent tfoot td:first-child{text-align:left}
  .vn{margin:10px 0 6px;font-size:12px;color:var(--faint);line-height:1.5}
  .ml{color:var(--faint);font-size:11px;margin-left:4px;font-weight:400}

  /* Table */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  thead th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:700;text-align:right;padding:12px 13px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);position:sticky;top:0}
  thead th:first-child{text-align:left}
  tbody td{padding:11px 13px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;font-size:13px}
  tbody tr:last-child td{border-bottom:none}
  tbody td:first-child{text-align:left}
  .nm{display:flex;align-items:center;gap:9px}
  .nm .em{font-size:16px}
  .nm .t1{font-weight:600;font-size:13px}
  .tag{font-size:9px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:11px;flex:none}
  .tag.digital{background:var(--violet-bg);color:var(--violet)}
  .tag.lima{background:var(--brand-bg);color:var(--brand)}
  .tag.provincia{background:var(--amber-bg);color:var(--amber)}
  .tag.fisico{background:var(--green-bg);color:var(--green)}
  tr.camp{background:var(--surface-2)}
  tr.camp td{border-bottom:1px solid var(--border-2);font-weight:700;cursor:pointer}
  tr.camp .t1{font-weight:800}
  .caret{display:inline-flex;width:15px;height:15px;color:var(--muted);transition:transform .15s}
  tr.camp.closed .caret{transform:rotate(-90deg)}
  tr.adset .adname{font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;color:var(--muted);padding-left:25px}
  tr.ad td:first-child{padding-left:25px}
  tr.ad{cursor:pointer}
  tr.ad:hover{background:var(--surface-2)}
  tr.ad .drill{opacity:0;color:var(--brand)}
  tr.ad:hover .drill{opacity:1}
  .hide{display:none}
  .money{font-weight:700}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .roas{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;font-weight:800}
  .roas .rd{width:7px;height:7px;border-radius:50%;background:currentColor}
  .roas.g{color:var(--green)} .roas.a{color:var(--amber)} .roas.r{color:var(--red)}
  td .sub{color:var(--faint);font-size:10.5px;font-weight:600;margin-left:3px}
  /* Efectividad del bot: el violeta de la IA del Dashboard (tarjeta «Efectividad de cierre») */
  .efb{font-weight:800;background:linear-gradient(120deg,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .iab{width:15px;height:15px;border-radius:5px;background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-right:5px;vertical-align:-3px;box-shadow:0 2px 6px rgba(168,85,247,.4)}
  .iab svg{width:10px;height:10px}
  /* Embudo de los anuncios: chats → contestaron → calientes → compraron, con el paso donde más se pierde */
  .embudo{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:18px}
  .embudo:empty{display:none}
  .embudo .eh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .embudo .eh b{font-size:12.5px}
  .embudo .eh span{font-size:11.5px;color:var(--muted)}
  .embudo .ep{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .embudo .es{position:relative;padding:9px 11px;border-radius:10px;background:var(--surface-2);overflow:hidden}
  .embudo .es .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);border-radius:0 2px 2px 0}
  .embudo .es .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
  .embudo .es .n{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-top:3px}
  .embudo .es .p{font-size:11px;color:var(--faint);margin-top:1px}
  .embudo .es.fuga{box-shadow:inset 0 0 0 1.5px var(--amber)}
  .embudo .es.fuga .p{color:var(--amber);font-weight:700}
  @media (max-width:760px){ .embudo .ep{grid-template-columns:repeat(2,1fr)} }
  tfoot td{padding:12px 13px;border-top:2px solid var(--border-2);font-weight:800;text-align:right;background:var(--surface-2);font-size:13px}
  tfoot td:first-child{text-align:left;text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;color:var(--muted)}

  /* Drill-down */
  .back{display:inline-flex;align-items:center;gap:7px;background:none;border:none;color:var(--brand);font-size:13px;font-weight:700;padding:0;margin-bottom:14px}
  .back svg{width:16px;height:16px}
  .dhd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .dhd .em{font-size:26px}
  .dhd h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
  .dhd .ctx{font-size:12px;color:var(--muted);margin-top:2px}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
  .chartcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px}
  .chartcard h3{margin:0 0 3px;font-size:13px;font-weight:700}
  .chartcard .cs{font-size:11.5px;color:var(--faint);margin-bottom:10px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);font-weight:600;margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  svg.chart{width:100%;height:150px;display:block;overflow:visible}
  @media (max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)} .dgrid{grid-template-columns:1fr} .colbtn{margin-left:0} }
  /* (10-oct) resumen en una línea, títulos de grupo, estado del anuncio y mensajes de Meta plegados */
  .resumen{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:4px 0 14px;font-size:13.5px;color:var(--muted)}
  .resumen b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums} .resumen b.pos{color:var(--green)} .resumen b.neg{color:var(--red)}
  .resumen .sep{font-style:normal;color:var(--faint)}
  tr.grp td{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px;background:transparent;cursor:default}
  tr.grp.sub td{padding-top:8px;padding-left:22px;text-transform:none;letter-spacing:0;font-size:11.5px}
  .stdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--disabled,#98A2B3);margin-right:8px;vertical-align:2px;float:left;margin-top:6px}
  .stdot.on{background:#12B76A}
  .adctx{font-size:11px;color:var(--faint);margin-top:2px;padding-left:15px}
  .dnota{font-size:12px;color:var(--faint);margin:-4px 0 10px}
  .dtab-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px;font-size:13.5px;font-weight:600}
  .dch-wrap svg{max-height:210px}
  tr.prenodo td{color:var(--faint)} tr.prenodo td.neg,tr.prenodo td.pos{color:var(--faint)}
  .dchart{padding:14px 18px 10px}
  .dch-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .dch-sum{font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap} .dch-sum b{color:var(--text);font-weight:600} .dch-sum b.pos{color:var(--green)} .dch-sum b.neg{color:var(--red)}
  .dch-sum .lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .dch-wrap{position:relative} .dhit{cursor:default}
  .bc-tip{position:absolute;z-index:5;pointer-events:none;min-width:190px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.22);padding:10px 12px;font-size:12.5px}
  .bc-tip .t{font-weight:600;margin-bottom:6px;text-transform:capitalize}
  .bc-tip .r{display:flex;justify-content:space-between;gap:16px;padding:2px 0;color:var(--muted)} .bc-tip .r b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .bc-tip .r.pos b{color:var(--green)} .bc-tip .r.neg b{color:var(--red)}
  details.vdet{margin-top:18px;padding:0}
  details.vdet>summary{list-style:none;cursor:pointer;padding:14px 18px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  details.vdet>summary::-webkit-details-marker{display:none}
  details.vdet>summary .vsum{margin-left:auto;font-weight:500;color:var(--muted);font-size:12.5px}
  details.vdet>summary::after{content:"›";color:var(--faint);font-size:16px;transition:transform .15s}
  details.vdet[open]>summary::after{transform:rotate(90deg)}
  details.vdet>.vent{padding:0 18px 16px}
</style>
</head>
<body>
<div class="nodo-page">
  <!-- Todo el ancho (Rodrigo, 7-oct): con 1280 px la tabla se cortaba y sobraba espacio a los lados. -->
  <div class="nodo-wrap" style="--nodo-max:none">
    <div class="nodo-head">
      <div class="grow">
        <h1 class="nodo-title">Rendimiento</h1>
      </div>
      <div class="nodo-actions" id="statusSlot"></div>
    </div>

    <div id="noticeSlot"></div>
    <div id="view"></div>
  </div>
</div>

<script type="module">
import { supa, getChannel, mountShell, icon, pageAll, factorAds, getUsdRate, toast, updateChannel, adsDeCuentasQuitadas } from "./shell.js";
import * as O from "./orders.js";
import { mountDateRange, computePreset, rangeLabel, startOfDayTZ as startOfDayLima, endOfDayTZ as endOfDayLima, ymdTZ } from "./date-range.js";
const $=(id)=>document.getElementById(id);
const st={ channelId:null, adAccounts:[], syncError:null, vista:"anuncio", tipo:"all", account:"all", cols:new Set(), sel:null, range:null, rows:[], loaded:false };
function visibleRows(){ return st.rows.filter(r=>(st.tipo==="all"||r.tag===st.tipo) && (st.account==="all"||r.account_id===st.account)); }

// Moneda del canal (símbolo por código ISO), igual que el Dashboard.
const CUR_SYM={PEN:"S/",USD:"$",MXN:"$",COP:"$",ARS:"$",CLP:"$",BOB:"Bs",EUR:"€",BRL:"R$",UYU:"$U",PYG:"₲",VES:"Bs",GTQ:"Q",CRC:"₡",DOP:"RD$",HNL:"L",NIO:"C$",PAB:"B/.",GBP:"£",CAD:"$"};
let CUR="PEN"; let USD_RATE=0; const curSym=()=>CUR_SYM[CUR]||CUR;
const money=(v)=>{ const s=v<0?"-":""; return s+curSym()+" "+Math.abs(v).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2}); };
const money0=(v)=>curSym()+" "+Math.round(v).toLocaleString("es-PE");
const nf=(v,d=0)=>Number(v).toLocaleString("es-PE",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v)=>nf(v*100,2)+"%";
const esc=(s)=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TAGLBL={digital:"DIGITAL",lima:"LIMA",provincia:"PROVINCIA",fisico:"FÍSICO"};

// ── Datos REALES ────────────────────────────────────────────────────
// El gasto/entrega sale de ads_insights + ads_meta (los baja ads-sync desde
// Meta); las ventas/margen salen de orders atribuidos por shipping.ad_id (ya
// los tiene Nodo). Se cruzan por ad_id. Mientras no haya sincronización, las
// tablas están vacías → la sección muestra su estado vacío.
const ymd=(d)=>{ const x=new Date(d); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; };
// Día de un INSTANTE en hora de Lima (ver dashboard.html): `ymd` usa la zona del
// navegador y corría las ventas de la noche al día siguiente.
// Día calendario en la zona del NEGOCIO (date-range.js), no Lima fija: había una copia
// local acá que ignoraba la zona elegida en Ajustes.
const ymdLima = ymdTZ;
async function loadData(){
  st.rows=[]; st.loaded=false;
  const cid=st.channelId; if(!cid){ st.loaded=true; return; }
  const gen=(st.loadGen=(st.loadGen||0)+1); // anti-carrera al cambiar de bot/cuenta
  const r=st.range||computePreset("hoy"); const from=ymd(r.from), to=ymd(r.to);
  // Los pedidos van por created_at (timestamptz): hay que comparar contra el
  // INSTANTE UTC real del día LOCAL (Lima), no contra la fecha naive que la
  // sesión UTC de Postgres leería corrida ~5h → así se perdían las ventas de la
  // tarde-noche (horario pico) del último día del rango. El gasto sí va con ymd()
  // porque ads_insights.fecha es columna `date` (sin hora, por día calendario).
  const ordDesde=startOfDayLima(r.from).toISOString(); // inicio del día en hora de Lima (UTC-5), no del navegador
  const ordHasta=endOfDayLima(r.to).toISOString();     // fin del día de Lima (inclusive .999) → se usa con .lte
  // 💸 Mensajes que Meta cobra (desde el 1-oct-2026), por origen del contacto. Va aparte y
  // best-effort: no depende de Meta (mide lo que manda el bot) y si falta la migración 0092
  // no debe tumbar la carga del gasto. La tarifa se lee directo de channels (grant 0093).
  st.ventana=null; st.tarifaMsg=null;
  try{
    const [{data:vr,error:ve},{data:ch}]=await Promise.all([
      supa.rpc("gasto_meta_por_origen",{ p_channel_id:cid, p_desde:from, p_hasta:to }),
      supa.from("channels").select("tarifa_msg_usd").eq("id",cid).maybeSingle(),
    ]);
    if(!ve) st.ventana=vr||[];
    st.tarifaMsg=ch&&Number(ch.tarifa_msg_usd)>0?Number(ch.tarifa_msg_usd):null;
  }catch(_){ st.ventana=null; }

// Sin denominador → null (se pinta «—»), no 0: «CPA real S/ 0.00» en un anuncio con S/500 de
// gasto y 0 ventas se leía como «no me cuesta nada vender», y «ROAS 0.00×» en rojo sobre un
// anuncio que sí vendió pero sin gasto en el rango. El detalle por día ya hacía lo correcto.
function metrics(a){
  return {
    gasto:a.gasto, impr:a.impr, alcance:a.alcance, frec:a.alcance?a.impr/a.alcance:null,
    clics:a.clics, ctr:a.impr?a.clics/a.impr:null, cpm:a.impr?a.gasto/a.impr*1000:null, cpc:a.clics?a.gasto/a.clics:null,
    clicsWA:a.clicsWA, conf:a.conf, cpaConf:a.conf?a.gasto/a.conf:null,
    ventas:a.ventas, cpaReal:a.ventas?a.gasto/a.ventas:null, ingresos:a.ingresos,
    neta:a.neta, roas:a.gasto?a.ingresos/a.gasto:null,
    chats:a.chats||0, cpr:a.chats?a.gasto/a.chats:null, interes:a.interes||0, calientes:a.calientes||0, compraron:a.compraron||0,
    pInteres:a.chats?(a.interes||0)/a.chats:null, pCalientes:a.chats?(a.calientes||0)/a.chats:null, conv:a.chats?(a.compraron||0)/a.chats:null,
    // Efectividad del BOT (igual que el Dashboard): de los que se interesaron de verdad —más los que llegaron a tener
    // pedido y se cayeron—, cuántos cerró. El Conv% juzga al anuncio; esto, a la conversación.
    efect:((a.interes||0)+(a.perdidos||0))?(a.compraron||0)/((a.interes||0)+(a.perdidos||0)):null, baseEfect:(a.interes||0)+(a.perdidos||0),
    vRemarketing:a.vRemarketing||0, vDirectas:Math.max(0,a.ventas-(a.vRemarketing||0)),

}

  {k:"neta",   l:"Ganancia neta", g:"Dinero",    cell:m=>m.neta==null?`<td class="num money" title="Hay ventas físicas sin costo o flete registrado: sin eso no se puede afirmar la ganancia">—</td>`:`<td class="num money ${m.neta<0?'neg':'pos'}">${money(m.neta)}</td>`},

const DEFAULT_ON=new Set(["chats","cpr","ventas","cpaReal","roas","neta"]);   // (10-oct) tabla corta; el resto en «Columnas»

function visibleCols(){ return COLS.filter(c=>c.fix||st.cols.has(c.k)); }
function headRow(first){ return `<th>${first}</th>`+visibleCols().map(c=>`<th${c.t?` title="${esc(c.t)}"`:""}>${c.h||c.l}</th>`).join(""); }
function cells(m){ return visibleCols().map(c=>c.cell(m)).join(""); }

function boot(){
  supa.auth.getSession().then(async({data:{session}})=>{
    if(!session){ location.href="index.html"; return; }
    const shell=await mountShell({ active:"rendimiento" });
    st.channelId=shell.channelId;
    st.cols=new Set(DEFAULT_ON); st.range=computePreset("hoy");
    shell.onChannel(id=>{ st.channelId=id; st.sel=null; st.selId=null; st.rangoAntes=null; loadAccount(); });
    await loadAccount();
  });
}
async function loadAccount(){
  st.adAccounts=[]; st.syncError=null;
  try{ const { data }=await supa.from("ad_accounts").select("account_id,nombre").eq("channel_id",st.channelId).eq("activo",true); st.adAccounts=data||[]; }catch(_){}
  if(st.account!=="all" && !st.adAccounts.some(a=>a.account_id===st.account)) st.account="all";
  try{ const data=await getChannel(st.channelId); st.syncError=data?.ads_sync_error||null; CUR=(data&&data.moneda)||"PEN"; }catch(_){}
  // Cuanto vale el dolar, para convertir el gasto si la cuenta de Meta factura en USD.
  USD_RATE = CUR==="USD" ? 1 : await getUsdRate(st.channelId);
  renderStatus(); await reload();
}
function renderStatus(){
  // Se llama después de varios await: si ya cambiaste de sección, estos huecos no
  // existen (y peor, un id igual en la sección nueva se llevaría este texto).
  if(!$("statusSlot")) return;
  const n=st.adAccounts.length;
  // En "Por copy" no se mide gasto de Meta: ni la pastilla de conexión ni el texto de CPA/
  // ganancia vienen a cuento — con la pastilla en "SIN CONECTAR" encima parecía que la vista
  // estaba vacía por falta de conexión cuando sus números estaban ahí, completos.
  const _lead=$("lead");
  if(_lead) _lead.innerHTML = st.vista==="copy"
    ? `Qué versión de los mensajes que manda tu bot funciona mejor. Mide el <b>texto</b>, no los anuncios: no necesita Meta conectado.`
    : `El gasto de tus anuncios de Meta cruzado con la venta <b>real</b> de Nodo — tu CPA de confirmación, tu CPA real y tu ganancia neta, por anuncio y por producto. Toca un anuncio para ver su detalle día por día.`;
  // En "Por copy" la pastilla no se VACÍA: se cambia por lo que esa vista sí puede decir.
  // Vaciarla hacía desaparecer un elemento del encabezado al cambiar de vista —el mismo
  // salto que ya molestaba en la barra— y dejaba la duda de si el dato faltaba. Y dejar
  // "SIN CONECTAR" era peor: con la tabla vacía parecía que era por falta de Meta cuando
  // en realidad es que todavía no hay copys medidos. El aviso de token roto tampoco viene
  // a cuento acá: esta vista no lee nada de Meta.
  if(st.vista==="copy"){
    $("statusSlot").innerHTML=`<span class="demopill" title="Esta vista mide los mensajes de tu bot, no tus anuncios: funciona con o sin Meta conectado" style="background:var(--surface-2);color:var(--muted);border-color:var(--border)"><span class="d" style="background:var(--faint)"></span>NO NECESITA META</span>`;
    $("noticeSlot").innerHTML="";
    return;
  }
  // El botón de forzar la bajada: Ajustes → Meta lo prometía («puedes forzarlo desde
  // Rendimiento») y no existía. Sin él, el que acaba de conectar su cuenta tiene que esperar
  // a la próxima corrida del cron para saber si quedó bien — y si quedó mal, se entera una
  // hora tarde. Solo aparece cuando hay una cuenta conectada: sin eso no hay nada que bajar.
  $("statusSlot").innerHTML = n
    ? `<span class="okpill">${icon("megaphone")} ${n} cuenta${n>1?'s':''} conectada${n>1?'s':''}</span>
       <button class="pillbtn" id="syncAds" title="Baja de Meta el gasto de ahora mismo, sin esperar a la próxima corrida">${icon("refresh")} Actualizar</button>`
    : `<span class="demopill" style="background:var(--surface-2);color:var(--muted);border-color:var(--border)"><span class="d" style="background:var(--faint)"></span>SIN CONECTAR</span>`;
  const bs=$("syncAds"); if(bs) bs.onclick=()=>sincronizarAhora(bs);
  $("noticeSlot").innerHTML = st.syncError
    ? `<div class="notice" style="background:var(--red-bg);border-color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div><b>Tu token de anuncios dejó de funcionar.</b> ${esc(st.syncError)} Reconéctalo en <a href="config.html">Ajustes → Meta</a>.</div></div>`
    : "";
}
// Fuerza una corrida de ads-sync. No llama a ads-sync directo (está protegida con el secreto
// del scheduler, que no puede vivir en el navegador): se lo pide a ads-schedule, que sí lo
// tiene en su entorno. Después recarga, porque el gasto recién bajado no se pinta solo.
async function sincronizarAhora(btn){
  btn.disabled=true; const old=btn.innerHTML;
  btn.classList.add("cargando"); btn.innerHTML=icon("refresh")+" Actualizando…";
  try{
    // `invoke` en vez de un fetch a mano: así no hay que importar la URL ni la anon key
    // (un import nuevo en un módulo compartido ya dejó el panel en blanco una vez por caché).
    const { data:j, error }=await supa.functions.invoke("ads-schedule",{ body:{ action:"run" } });
    if(error||j?.error){
      let d=""; try{ d=(await error?.context?.json?.())?.detalle||""; }catch{}
      toast(d||j?.detalle||j?.error||error?.message||"No se pudo actualizar",true); return;
    }
    // El backend NO devuelve el detalle de la corrida a propósito (el cron es global y su
    // resumen nombra canales de otros negocios). Así que el resultado se mide acá: se
    // recarga y la pantalla muestra lo que haya.
    toast(j?.reciente ? "Ya estaba al día · se bajó hace menos de un minuto" : "Listo · gasto actualizado");
    await loadAccount();
  }catch(e){ toast(e.message||"error",true); }
  finally{ btn.disabled=false; btn.classList.remove("cargando"); btn.innerHTML=old; }
}

function ventanaHtml(){

      <div class="vt"><label for="tarifaMsg">Tarifa por mensaje (US$)</label><input id="tarifaMsg" type="number" step="0.0001" min="0" placeholder="Meta aún no publica la de Perú" value="${tarifa??""}"><button id="tarifaSave">Guardar</button></div></div>

    ${tarifa?"":`<p class="vn">Sin tarifa no se estima el costo: por ahora solo los conteos. Cuando Meta publique la tarifa de tu país, ponla arriba y el costo aparece solo.</p>`}

function wireVentana(){
  const b=$("tarifaSave"); if(!b) return;
  b.onclick=async()=>{
    const v=Number($("tarifaMsg").value); const val=v>0?+v.toFixed(6):null;
    b.disabled=true;
    const {error}=await updateChannel(st.channelId, { tarifa_msg_usd:val });
    b.disabled=false;
    if(error){ toast(/tarifa_msg_usd/.test(error.message)?"Falta aplicar la migración 0092 (tarifa por mensaje)":error.message,true); return; }
    st.tarifaMsg=val; toast(val?"Tarifa guardada":"Tarifa borrada: solo conteos"); await reload();
  };
}

    it("En anuncios",money0(m.gasto)),

function renderTable(){

function renderAnuncio(){
  // (10-oct) Antes: fila de campaña + fila de conjunto + fila del anuncio + total, las cuatro iguales con un solo
  // anuncio. Ahora la campaña y el conjunto son títulos chicos, y solo cuando agrupan a más de un anuncio.
  const rows=visibleRows();
  const nCol=visibleCols().length+1;
  const camps=[...new Set(rows.map(a=>a.campaign))];
  let html="";
  camps.forEach(camp=>{
    const cads=rows.filter(a=>a.campaign===camp);
    if(cads.length>1) html+=`<tr class="grp"><td colspan="${nCol}">Campaña · ${esc(camp)}</td></tr>`;
    const asets=[...new Set(cads.map(a=>a.adset))];
    asets.forEach(aset=>{
      const aads=cads.filter(a=>a.adset===aset);
      if(aads.length>1) html+=`<tr class="grp sub"><td colspan="${nCol}">Conjunto · ${esc(aset)}</td></tr>`;
      aads.forEach(a=>{ const i=st.rows.indexOf(a); const e=st.adEstado&&st.adEstado[a.ad_id];
        const dot=e?`<span class="stdot${e==="ACTIVE"?" on":""}" title="${e==="ACTIVE"?"Activo en Meta":"Pausado en Meta"}"></span>`:"";
        html+=`<tr class="ad" data-ad="${i}"><td>${dot}${nameCell(a.name,a.tag,"",true)}${cads.length===1&&aads.length===1?`<div class="adctx">${esc(camp)}</div>`:""}</td>${cells(metrics(a))}</tr>`; });
    });
  });
  $("tbody").innerHTML=html;
  $("tbody").querySelectorAll("tr.ad").forEach(tr=>tr.onclick=()=>abrirDetalle(Number(tr.dataset.ad)));
}
// ══════ POR COPY ══════════════════════════════════════════════════════
// Qué versión de los mensajes que manda el bot rinde mejor. Nada que ver con el gasto de
// Meta: acá se mide el TEXTO (el saludo inicial y cada paso de remarketing), que el motor
// ya reparte al azar por peso. La fuente es `variante_envios` (migración 0079).
//
// ⚠️ SOBRE CUÁNDO SE PUEDE DECIDIR. No hay un mínimo fijo de clientes: ese número depende
// de qué tan grande sea la diferencia que buscas. Para una tasa de respuesta del 40%,
// detectar +10 puntos pide ~385 por versión; +20 puntos, ~95; +30 puntos, ~40. Por eso el
// criterio es el test de dos proporciones, que ya escala solo — una diferencia enorme se
// confirma con pocos casos y una chica exige muchos. El único mínimo que queda es el de
// validez de la fórmula (≥5 respuestas y ≥5 no-respuestas por lado), no una regla de dedo.
function testProporciones(a,b){
  const n1=a.env,n2=b.env,x1=a.resp,x2=b.resp;
  if(Math.min(x1,n1-x1,x2,n2-x2)<5) return { valido:false };
  const p=(x1+x2)/(n1+n2), se=Math.sqrt(p*(1-p)*(1/n1+1/n2));
  if(!se) return { valido:false };
  const z=Math.abs(x1/n1-x2/n2)/se;
  return { valido:true, difiere:z>=1.96 };     // 95% de confianza
}
// Cuántos clientes por versión harían falta para confirmar la diferencia que HOY se ve.
// Es lo honesto para reemplazar el "faltan N" inventado: el N sale de la diferencia real.
//
// ⚠️ Las tasas crudas se usan SUAVIZADAS (Agresti-Coull: +2 éxitos y +4 casos). Con las
// crudas, la fórmula se rompe justo donde uno cae al principio: "1 contestó de 1" contra
// "0 de 1" da 100% vs 0%, y como p(1-p) vale cero en los extremos el resultado era
// "harían falta unos 0 clientes por versión" — que además contradice el propio cartel de
// "todavía no se puede decidir". Suavizado, ese mismo caso pide ~95, que es lo real.
function nNecesario(x1,n1,x2,n2){
  const p1=(x1+2)/(n1+4), p2=(x2+2)/(n2+4);
  const d=Math.abs(p1-p2); if(d<0.005) return null;             // prácticamente iguales
  return Math.ceil(7.85*(p1*(1-p1)+p2*(1-p2))/(d*d));           // 95% conf · 80% poder
}
// Qué versiones siguen VIVAS hoy (activas en un flujo o en una secuencia). Sin esto el
// veredicto comparaba también las que el dueño ya borró o apagó, y salían consejos
// imposibles de seguir: medido, "«Vieja borrada» rinde mejor, súbele el peso" — de una
// versión que ya no existe en el flujo, contra otra que ya estaba apagada. Lo que pasó
// pasó y se muestra igual en la tabla, pero para DECIDIR solo cuentan las que están vivas.
async function variantesVigentes(){
  const vivas=new Set();
  try{
    const { data:nodos }=await supa.from("flow_nodes")
      .select("config, flows!inner(channel_id)").eq("tipo","rotador").eq("flows.channel_id", st.channelId);
    for(const n of nodos||[]) for(const v of (n.config?.variantes||[])) if(v?.id && v.activo!==false) vivas.add(v.id);
  }catch(_){ /* sin flujos legibles → se comportan todas como vigentes */ }
  try{
    const { data:seqs }=await supa.from("sequences").select("pasos").eq("channel_id", st.channelId);
    for(const s of seqs||[]) for(const p of (s.pasos||[])) for(const v of (p?.variantes||[])) if(v?.id && v.activo!==false) vivas.add(v.id);
  }catch(_){ }
  return vivas;
}
// De qué PRODUCTO es cada envío. El `ref_id` guarda el flujo (saludo) o la secuencia
// (remarketing); de ahí se llega al producto. Hace falta porque los copys de productos
// distintos NUNCA compiten por el mismo cliente: mezclarlos es el mismo error que comparar
// ángulos distintos — el saludo del curso contra el de las zapatillas, y un "ganador" que
// no significa nada.
async function productoPorRef(){
  const map={};
  try{
    const { data:fls }=await supa.from("flows").select("id,product_id").eq("channel_id",st.channelId);
    for(const f of fls||[]) if(f.product_id) map[f.id]=f.product_id;
  }catch(_){ }
  try{
    const { data:ps }=await supa.from("products").select("id,nombre,tipo,config").eq("channel_id",st.channelId);
    window.__prodNombre={}; window.__prodTipo={};
    for(const p of ps||[]){
      window.__prodNombre[p.id]=p.nombre;
      // Digital o físico, para que el filtro Tipo también valga en "Por copy": cada copy
      // pertenece a un producto, así que no había motivo para dejar esta vista sin ese
      // filtro — y era justo lo que hacía desaparecer los botones y saltar la barra.
      window.__prodTipo[p.id]=String(p.tipo||"")==="digital"?"digital":"fisico";
      const cfg=p.config||{};
      const m=(cfg.remarketing_seqs&&typeof cfg.remarketing_seqs==="object")?cfg.remarketing_seqs:{};
      for(const v of Object.values(m)) if(v) map[v]=p.id;
      if(cfg.remarketing_seq_id) map[cfg.remarketing_seq_id]=p.id;
    }
  }catch(_){ }
  return map;
}
async function cargaCopys(){
  const r=st.range||computePreset("hoy");
  // ⚠️ `r.to` es la MEDIANOCHE del último día (su instante de inicio), no su final: usarlo
  // tal cual como tope dejaba fuera todo lo de hoy — medido, con envíos de las 00:28 de Lima
  // la vista salía vacía teniendo 320 filas. Se toma el fin del día en la zona del negocio.
  const desde=startOfDayLima(new Date(r.from)).toISOString();
  const hasta=endOfDayLima(new Date(r.to)).toISOString();
  // ⚠️ PostgREST corta en 1000 filas y `.limit()` NO lo sube: con `.limit(10000)` devolvía
  // exactamente 1000 de 1500 (medido). Y el recorte no es inocente — se queda con las
  // primeras según un orden no garantizado, así que una versión podía salir con 900 envíos
  // y la otra con 100 solo por dónde cayó el corte, mostrando un "ganador" inventado.
  // pageAll pagina de verdad; el `order` estable es lo que hace que las páginas no se pisen.
  const { data, error, truncado }=await pageAll((a,b)=>supa.from("variante_envios")
    .select("contact_id,ambito,ref_id,paso,variante_id,variante_rev,variante_nom,angulo,respondio_at,compro_at,monto")
    .eq("channel_id", st.channelId).gte("enviado_at",desde).lte("enviado_at",hasta)
    .order("enviado_at",{ascending:true}).order("id",{ascending:true}).range(a,b));
  if(error) return { error };
  const refProd=await productoPorRef();
  // 🧮 La compra se acredita cuando NACE el pedido, y un pedido recién nacido todavía
  // puede no ser una venta (provincia arranca en "esperando_adelanto": dio sus datos y
  // no pagó) o dejar de serlo después (lo canceló). Contarlas igual inflaba la columna
  // "compraron" y sus ingresos — medido: 20 compras / S/ 2.791 cuando eran 17 / S/ 2.404,
  // con dos leads sin pagar y un pedido cancelado dentro. Y era el peor sitio para
  // inflar: un copy que atrae gente que da datos y no paga se veía igual de bueno que
  // uno que cierra. Se cruza con el estado ACTUAL del pedido, así que el número se
  // corrige solo cuando el de provincia paga su adelanto o cuando alguien cancela.
  const conVentaViva=new Set();
  try{
    const { data:_os }=await pageAll((a,b)=>supa.from("orders").select("contact_id,estado")
      .eq("channel_id", st.channelId).order("id",{ascending:true}).range(a,b));
    for(const o of _os||[]){ const e=O.EST[o.estado]||{}; if(e.venta && !e.perdido) conVentaViva.add(o.contact_id); }
  }catch(_){ /* sin pedidos legibles → se cuenta como antes */ }

  if(truncado) console.warn("[copys] periodo con demasiados envíos: los números pueden estar incompletos");
  const m=new Map();
  for(const x of data||[]){
    const prod=refProd[x.ref_id]||"";
    // El PASO entra en la clave: las versiones del toque 1 y las del toque 2 no compiten
    // por el mismo cliente (el 2 solo lo reciben los que ignoraron el 1, que son los mas
    // frios), asi que juntarlas haria parecer peor al copy del toque 2 por su publico, no
    // por su texto.
    const paso=x.paso??null;
    const k=`${x.ambito}|${prod}|${paso}|${x.variante_id}|${x.variante_rev}`;
    const s=m.get(k)||{ ambito:x.ambito, prod, paso, id:x.variante_id, nombre:x.variante_nom||"—", env:0, resp:0, compras:0, monto:0, angulos:new Set() };
    // El nombre se guarda en cada envío, así que si la renombraste hay filas con el viejo y
    // filas con el nuevo. Como se recorre de más antigua a más reciente, quedarse con el
    // último deja el nombre ACTUAL — si no, la tabla te mostraría un nombre que ya no existe
    // en el editor y no sabrías cuál de tus versiones es.
    if (x.variante_nom) s.nombre = x.variante_nom;
    s.env++; if(x.respondio_at) s.resp++;
    if(x.compro_at && conVentaViva.has(x.contact_id)){ s.compras++; s.monto+=Number(x.monto)||0; }
    if(x.angulo) s.angulos.add(x.angulo);
    m.set(k,s);
  }
  const vivas=await variantesVigentes();
  // El filtro Tipo (Todos / Digital / Físico) también manda acá: cada copy pertenece a un
  // producto y el mapa de arriba ya sabe si ese producto es digital o físico. Los copys sin
  // producto resuelto (una secuencia suelta, un flujo sin producto) se quedan solo en
  // "Todos": esconderlos en Digital o en Físico sería inventarles un tipo.
  const tipoDe=(pid)=>(window.__prodTipo||{})[pid]||"";
  return { filas:[...m.values()]
    .filter(f=>st.tipo==="all"||tipoDe(f.prod)===st.tipo)
    .map(f=>({ ...f, vigente: vivas.has(f.id) })) };
}
function renderCopys(){
  const box=$("content");
  box.innerHTML=`<div class="nodo-empty" style="border:none;padding:40px 20px"><p>Cargando…</p></div>`;
  cargaCopys().then(({filas,error})=>{
    if(error){
      box.innerHTML=`<div class="nodo-empty" style="border:none;padding:44px 20px"><h3>Falta aplicar la migración 0079</h3>
        <p>Esta vista lee la tabla <code>variante_envios</code>, que todavía no existe en tu base.</p></div>`;
      return;
    }
    if(!filas.length && st.tipo!=="all"){
      // Vacío por el FILTRO, no por falta de datos: decir "todavía no hay copys medidos"
      // mandaría a buscar un problema que no existe (y a agregar versiones que ya tiene).
      box.innerHTML=`<div class="nodo-empty" style="border:none;padding:44px 20px">
        <h3>No hay copys de productos ${st.tipo==="digital"?"digitales":"físicos"} en este periodo</h3>
        <p style="max-width:52ch;margin:8px auto 0;line-height:1.6">Sí puede haber copys medidos de otro tipo de producto. Cambia el filtro a <b>Todos</b> para verlos.</p></div>`;
      return;
    }
    if(!filas.length){
      box.innerHTML=`<div class="nodo-empty" style="border:none;padding:44px 20px">
        <h3>Todavía no hay copys medidos en este periodo</h3>
        <p style="max-width:52ch;margin:8px auto 0;line-height:1.6">Se llena solo: cada vez que el bot manda un saludo inicial o un paso de remarketing que tiene <b>varias versiones</b>, queda registrado cuál mandó y si el cliente contestó.<br><br>Si tus mensajes tienen una sola versión, no hay nada que comparar — agrega una segunda en el flujo o en la secuencia.</p></div>`;
      return;
    }
    const grupos=[["inicial","Saludo inicial","El primer mensaje del bot. Decide si el cliente contesta o no."],
                  ["secuencia","Remarketing","Los pasos que reenganchan al que se quedó callado."]];
    // Una tabla por ÁMBITO y por PRODUCTO. Los copys de productos distintos no compiten
    // por el mismo cliente: mezclarlos daba un "ganador" sin sentido — medido, el saludo del
    // curso (1 cliente, 100%) salía encabezando la lista de las zapatillas.
    box.innerHTML=grupos.flatMap(([amb,titulo,sub])=>{
      const delAmb=filas.filter(f=>f.ambito===amb);
      // …y, en remarketing, una por TOQUE: el toque 2 solo lo reciben los que ignoraron el 1.
      const claves=[...new Set(delAmb.map(f=>(f.prod||"")+"#"+(f.paso??"")))];
      return claves.map(k=>{ const [pid,ps]=k.split("#");
        return [amb,titulo,sub,pid,delAmb.filter(f=>(f.prod||"")===pid && String(f.paso??"")===ps), ps]; });
    }).map(([amb,titulo,sub,pid,gg,ps],idx,arr)=>{
      // El subtitulo explica el ambito, no la tarjeta: repetido en cada producto/toque era
      // ruido. Sale solo en la primera tarjeta de su ambito.
      const primeraDelAmbito = arr.findIndex(r=>r[0]===amb)===idx;
      const g=gg.sort((a,b)=>(b.resp/b.env)-(a.resp/a.env));
      if(!g.length) return "";
      const nomProd=(window.__prodNombre||{})[pid];
      return `<div class="panel" style="margin-bottom:16px">
        <div style="padding:13px 15px 0"><div style="font-weight:700;font-size:14px">${titulo}${nomProd?` · <span style="color:var(--muted);font-weight:600">${esc(nomProd)}</span>`:""}${(ps!==""&&ps!=null&&amb==="secuencia")?` · <span style="color:var(--faint);font-weight:600">toque ${Number(ps)+1}</span>`:""}</div>
${primeraDelAmbito?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${sub}</div>`:""}
          ${veredictoHtml(g)}</div>
        <div class="scroll"><table><thead><tr>
          <th>Versión</th><th>Recibieron</th><th>${amb==="secuencia"?"Reengancharon":"Contestaron"}</th>
          <th>Tasa</th><th>Compraron</th><th>Ingresos</th></tr></thead>
        <tbody>${g.map(f=>`<tr${f.vigente?"":' style="opacity:.62"'}>
          <td>${nameCell(f.nombre,"","",false)}${f.vigente?"":'<div style="font-size:10.5px;color:var(--faint);margin-top:1px">ya no está en uso</div>'}</td>
          <td class="num">${f.env}</td><td class="num">${f.resp}</td>
          <td class="num" style="font-weight:800;color:${f.resp===0?"var(--faint)":"var(--text)"}">${Math.round(f.resp/f.env*100)}%</td>
          <td class="num">${f.compras}</td><td class="num">${money0(f.monto)}</td></tr>`).join("")}
        </tbody></table></div></div>`;
    }).join("") || `<div class="nodo-empty" style="border:none;padding:44px 20px"><p>Sin datos en este periodo.</p></div>`;
  }).catch(e=>{ box.innerHTML=`<div class="nodo-empty" style="border:none;padding:44px 20px"><p>No se pudo cargar: ${esc(String(e?.message||e))}</p></div>`; });
}
// El cintillo: qué se puede concluir HOY. Es la parte que más importa que sea honesta —
// un "gana A" con datos flojos hace apagar la versión buena.
function veredictoHtml(gIn){
  let g=gIn;
  // El cintillo lleva icono Lucide, no emoji: en el cromo del panel la iconografía es una
  // sola (ver DESIGN_SYSTEM §8) y los emojis quedan para el contenido — el emoji del
  // producto y los mensajes que se le mandan al cliente.
  const ICO={ "34,197,94":"flag", "245,158,11":"alert", "148,163,184":"clock" };
  const S=(t,c)=>`<div style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:9px 11px;border-radius:9px;font-size:12.5px;line-height:1.55;background:rgba(${c},.09);border:1px solid rgba(${c},.32)"><span style="flex:none;color:rgb(${c});margin-top:2px">${icon(ICO[c]||"clock")}</span><div>${t}</div></div>`;
  // Solo deciden las que siguen vivas: recomendar sobre una versión borrada o apagada da
  // un consejo que no se puede ejecutar.
  const hist=g.filter(f=>!f.vigente).length;
  const pie=hist?` <span style="color:var(--faint)">(${hist} ${hist>1?"versiones":"versión"} de la tabla ya no ${hist>1?"están":"está"} en uso; ${hist>1?"salen":"sale"} solo como historial)</span>`:"";
  g=g.filter(f=>f.vigente);
  if(!g.length) return S(`Ninguna de las versiones medidas sigue activa hoy. Lo de abajo es historial de copys que ya cambiaste o apagaste.`,"148,163,184");
  if(g.length<2) return S(`Solo hay una versión activa, así que no hay con qué compararla. Agrega una segunda para empezar a medir cuál rinde mejor.${pie}`,"148,163,184");
  const todos=new Set(); g.forEach(f=>f.angulos.forEach(a=>todos.add(a)));
  if(todos.size>1) return S("<b>No se pueden comparar entre sí:</b> están repartidas por ángulos distintos, así que nunca compitieron por el mismo cliente. Lo que verías sería el efecto del anuncio, no del copy.","245,158,11");
  const [a,b]=g;                                    // ya vienen ordenadas por tasa
  const t=testProporciones(a,b);
  const pc=x=>Math.round(x.resp/x.env*100)+"%";
  // Con 3+ versiones no basta el duelo de arriba. Medido: A 50%, B 48%, C 20% sobre 200
  // clientes cada una — el cartel decía "todavía no se puede decidir" (por el empate de A
  // y B) y NO mencionaba a C, que estaba quemando un tercio del tráfico a menos de la
  // mitad de tasa. Lo accionable quedaba fuera del consejo. Se compara la mejor contra
  // TODAS, y las que rinden claramente menos se nombran aparte.
  const flojas=g.slice(1).filter(x=>{ const tt=testProporciones(a,x); return tt.valido && tt.difiere; });
  const aviso=flojas.length
    ? ` <b>${flojas.map(x=>`“${esc(x.nombre)}”`).join(" y ")}</b> rinde${flojas.length>1?"n":""} bastante menos (${flojas.map(pc).join(" y ")} contra ${pc(a)}): puedes apagarla${flojas.length>1?"s":""}.`
    : "";
  if(t.valido && t.difiere){
    return S(`<b>“${esc(a.nombre)}” rinde mejor.</b> Contesta el ${pc(a)} contra el ${pc(b)}, sobre ${a.env} y ${b.env} clientes. Puedes subirle el peso o apagar la otra.${pie}`,"34,197,94");
  }
  // Las de arriba empatan, pero alguna de abajo es claramente peor: eso SÍ se puede decidir.
  if(flojas.length){
    return S(`<b>“${esc(a.nombre)}” y “${esc(b.nombre)}” van parejas</b> (${pc(a)} y ${pc(b)}), así que entre esas dos da igual cuál dejes.${aviso}${pie}`,"34,197,94");
  }
  // Hay DOS motivos distintos por los que no se puede decidir, y confundirlos deja mensajes
  // absurdos. Con 9 de 10 contra 1 de 10 la fórmula del total pide "9 clientes" cuando ya
  // llevas 10: ahí lo que falta no es volumen, son casos en el lado flaco (solo 1 silencio
  // en una y 1 respuesta en la otra). Se dice el motivo real.
  if(!t.valido){
    return S(`<b>Todavía no se puede decidir.</b> Para que la comparación sea fiable hacen falta al menos <b>5 respuestas y 5 silencios en cada versión</b>; por ahora tienes ${a.resp} de ${a.env} y ${b.resp} de ${b.env}. Los números de abajo son reales, pero con tan pocos casos la diferencia puede darse vuelta con un solo cliente.${pie}`,"148,163,184");
  }
  const n=nNecesario(a.resp,a.env,b.resp,b.env);
  const cuanto=n ? `Para confirmar una diferencia de este tamaño harían falta unos <b>${n} clientes por versión</b> (llevas ${a.env} y ${b.env}).`
                 : `Van casi empatadas: por ahora da igual cuál dejes.`;
  return S(`<b>Todavía no se puede decidir.</b> ${cuanto} Los números de abajo son reales, pero la diferencia aún puede ser casualidad.${pie}`,"148,163,184");
}

function renderAngulo(){
  const rows=visibleRows();
  // Los ángulos son POR PRODUCTO (tabla angulos: único por channel+product+slug), así que dos
  // productos DISTINTOS pueden tener un ángulo con el MISMO nombre ("Oferta"). Antes se agrupaba
  // solo por el nombre → se fusionaban gasto/ventas de productos distintos bajo una fila y el
  // CPA/ROAS de ese ángulo no correspondía a ninguno real. Se agrupa por (nombre + producto);
  // si un nombre se repite entre productos, se muestra el producto para no confundir.
  const nombresPorProd={};
  rows.forEach(a=>{ (nombresPorProd[a.angulo||""]=nombresPorProd[a.angulo||""]||new Set()).add(a.prod||""); });
  const key=a=>`${a.angulo||""}${a.prod||""}`;
  const grupos=[...new Set(rows.map(key))];
  let html="";
  grupos.forEach((gk,ci)=>{
    const aads=rows.filter(a=>key(a)===gk);
    const ang=aads[0].angulo||"— Sin ángulo —";
    const ambiguo=(nombresPorProd[aads[0].angulo||""]||new Set()).size>1;
    const label= ambiguo && aads[0].prod ? `${ang} · ${aads[0].prod}` : ang;
    html+=`<tr class="camp" data-c="${ci}"><td><div class="nm"><span class="caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span><span class="t1">${esc(label)}</span></div></td>${cells(metrics(sumAds(aads)))}</tr>`;
    aads.forEach(a=>{ const i=st.rows.indexOf(a); html+=`<tr class="ad kid k${ci}" data-ad="${i}"><td>${nameCell(a.name,a.tag,"",true)}</td>${cells(metrics(a))}</tr>`; });
  });
  $("tbody").innerHTML=html;
  $("tbody").querySelectorAll("tr.camp").forEach(tr=>tr.onclick=()=>{ tr.classList.toggle("closed"); $("tbody").querySelectorAll(".k"+tr.dataset.c).forEach(k=>k.classList.toggle("hide")); });
  $("tbody").querySelectorAll("tr.ad").forEach(tr=>tr.onclick=()=>abrirDetalle(Number(tr.dataset.ad)));
}
function renderProducto(){
  const rows=visibleRows();
  const key=(a)=>a.prod||"— sin producto —";
  const prods=[...new Set(rows.map(key))];
  $("tbody").innerHTML=prods.map(p=>{
    const pads=rows.filter(a=>key(a)===p); const a0=pads[0];
    // \p{Emoji} es true para los DÍGITOS y para # y * (así lo define Unicode), así que un
    // producto llamado «2 en 1 Cargador» o «3M Adaptador» perdía su primera palabra: se la
    // llevaba como si fuera su emoji. Extended_Pictographic son los pictogramas de verdad.
    const parts=String(p).split(" "); const em=/\p{Extended_Pictographic}/u.test(parts[0])?parts.shift():"";
    return `<tr class="ad"><td>${nameCell(parts.join(" ")||p,a0.prodTag,em,false)}</td>${cells(metrics(sumAds(pads)))}</tr>`;
  }).join("");
}

// ── Selector de rango de fechas ────────────────────────────────────
// Vive en date-range.js: lo comparten esta sección y el conciliador. Acá solo
// quedan los ayudantes de fecha que usa el resto del archivo.

// ── Detalle día por día ────────────────────────────────────────────
// Serie diaria REAL: recorre cada día del periodo y toma lo que ads-sync +
// orders dejaron en row.daily (0 si ese día no hubo nada).
function serieReal(row){
  const r=st.range||computePreset("hoy"); const out=[]; let d=new Date(r.from); const end=new Date(r.to);
  // Con «Máximo» (desde 2020) el tope de 400 días se comía desde el PRINCIPIO: la serie
  // mostraba 2020 en cero y nunca llegaba a los días con datos. Se arranca en el primer día
  // con datos del anuncio y, si aun así pasa de 400, se quedan los ÚLTIMOS 400.
  const dias=Object.keys(row.daily).filter(Boolean).sort();
  if(dias.length){ const primero=new Date(dias[0]+"T00:00:00"); if(primero>d) d=primero; }
  const tope=new Date(end); tope.setDate(tope.getDate()-399); if(tope>d) d=tope;
  let guard=0;
  while(d<=end && guard++<400){ const f=ymd(d); const x=row.daily[f]||{};
    out.push({ fecha:new Date(d), gasto:x.gasto||0, impr:x.impr||0, clics:x.clics||0, conf:x.conf||0, ventas:x.ventas||0, ingresos:x.ingresos||0 });
    d=new Date(d); d.setDate(d.getDate()+1);
  }
  return out;
}
// ── Detalle de un anuncio (10-oct, rehecho con Rodrigo: «los gráficos no me gustan y se salen de las tarjetas») ──
// · Si el periodo es de UN día, el detalle se abre con los últimos 14 (un día = una sola barra, nada que comparar) y
//   al volver se restaura el periodo que tenías. El detalle tiene su propio selector de fechas.
// · Una línea de resumen (como la tabla) en vez de 5 tarjetas de colores.
// · UN gráfico con selector de métrica: Ganancia · Gasto e ingresos · CPA · CTR. Barras con su monto encima, escala
//   en números redondos, sin estirarse (antes preserveAspectRatio="none" deformaba y los puntos se salían).
// · Tabla día por día con lo que sirve para decidir; «Confirm.» solo si alguna vez difiere de las ventas.
const DASH='<span style="color:var(--faint)">—</span>';
const DCOLS=[
  {k:"gasto",   l:"Gasto",        c:d=>money(d.gasto)},
  {k:"impr",    l:"Impresiones",  c:d=>nf(d.impr)},
  {k:"clics",   l:"Clics",        c:d=>nf(d.clics)},
  {k:"ctr",     l:"CTR",          c:d=>d.impr?nf(d.clics/d.impr*100,2)+"%":DASH},
  {k:"cpm",     l:"CPM",          c:d=>d.impr?money(d.gasto/d.impr*1000):DASH},
  {k:"cpc",     l:"CPC",          c:d=>d.clics?money(d.gasto/d.clics):DASH},
  {k:"conf",    l:"Confirmaciones", h:"Confirm.", c:d=>nf(d.conf)},
  {k:"ventas",  l:"Ventas",       c:d=>nf(d.ventas)},
  {k:"cpa",     l:"CPA",          c:d=>d.ventas?money(d.gasto/d.ventas):DASH},
  {k:"ingresos",l:"Ingresos",     c:d=>money(d.ingresos)},
  {k:"ganancia",l:"Ganancia",     cls:d=>(d.ingresos-d.gasto)<0?"neg":"pos", c:d=>(d.gasto||d.ingresos)?money(d.ingresos-d.gasto):DASH},
  {k:"roas",    l:"ROAS",         c:d=>{ const r=d.gasto?d.ingresos/d.gasto:0; return (d.ventas&&d.gasto)?`<span class="roas ${r>=2?'g':r>=1?'a':'r'}"><span class="rd"></span>${nf(r,2)}×</span>`:DASH; }},
];
let detCols=(()=>{ try{ const x=JSON.parse(localStorage.getItem("nodo.rendDetCols")||"null"); if(Array.isArray(x)&&x.length) return new Set(x); }catch{} return new Set(["gasto","impr","clics","ctr","ventas","cpa","ingresos","ganancia","roas"]); })();
function detTabla(S){
  const cols=DCOLS.filter(c=>detCols.has(c.k));
  return `<table><thead><tr><th>Día</th>${cols.map(c=>`<th>${c.h||c.l}</th>`).join("")}</tr></thead><tbody>${S.slice().reverse().map(d=>
    `<tr${d.pre?' class="prenodo" title="Antes de la primera venta en Nodo"':""}><td>${d.fecha.toLocaleDateString("es-PE",{weekday:"short",day:"numeric",month:"short"})}</td>${cols.map(c=>`<td class="num${c.cls?" "+c.cls(d):""}">${c.c(d)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
let detMetrica=(()=>{ try{ return localStorage.getItem("nodo.rendMetrica")||"ganancia"; }catch{ return "ganancia"; } })();
// Día de la primera venta del bot EN NODO (sin contactos de prueba). Los días anteriores con gasto son de otro sistema
// (en Prime Digital, ChatLevel): sus ventas no están acá y salían como pérdidas que hundían el resumen y la escala.
const primeraK={};
async function primeraVentaK(){
  const cid=st.channelId; if(primeraK[cid]!==undefined) return primeraK[cid];
  let k="";
  try{
    const [oR,pR]=await Promise.all([
      supa.from("orders").select("contact_id,amount,currency,order_bumps,estado,shipping,created_at").eq("channel_id",cid).order("created_at",{ascending:true}).limit(200),
      pageAll((f,t)=>supa.from("contacts").select("id").eq("channel_id",cid).or("wa_id.eq.webchat-test,source.eq.sim").order("id",{ascending:true}).range(f,t)),
    ]);
    const prueba=new Set(((pR&&pR.data)||[]).map(c=>c.id));
    const o=((oR&&oR.data)||[]).find(x=>!prueba.has(x.contact_id) && O.esVenta(x));
    if(o) k=ymdLima(o.created_at);
  }catch(_){}
  primeraK[cid]=k; return k;
}
function abrirDetalle(i){
  const a=st.rows[i]; if(!a) return;
  st.sel=i; st.selId=a.ad_id;
  const r=st.range;
  const unDia = r && r.from && r.to && ymd(r.from)===ymd(r.to);
  if(unDia){ st.rangoAntes=r; st.range=computePreset("14d"); reload(); }
  else render();
}
function cerrarDetalle(){
  st.sel=null; st.selId=null;
  if(st.rangoAntes){ st.range=st.rangoAntes; st.rangoAntes=null; reload(); } else render();
}
async function renderDetail(){
  const primera=await primeraVentaK();
  const a=(st.selId!=null && st.rows.find(r=>r.ad_id===st.selId)) || st.rows[st.sel];
  const v=$("view");
  if(!a){
    v.innerHTML=`<button class="back" id="back">${icon("chevronLeft")||'‹'} Volver a Rendimiento</button><div class="dhd"><div><h2>Sin datos de este anuncio en estas fechas</h2></div><div id="ddr" style="margin-left:auto"></div></div>`;
    mountDateRange($("ddr"), { valor:st.range, onChange:(r)=>{ st.range=r; st.rangoAntes=null; reload(); } });
    $("back").onclick=cerrarDetalle; return;
  }
  const m=metrics(a); const S=serieReal(a);
  S.forEach(d=>{ d.pre = !!primera && ymd(d.fecha)<primera; });
  const pre=S.filter(d=>d.pre), gastoPre=pre.reduce((x,d)=>x+d.gasto,0);
  const e=st.adEstado&&st.adEstado[a.ad_id];
  const it=(l,val,c="")=>`<span>${l} <b class="${c}">${val}</b></span>`;
  const resumen=[
    it("Gasto",money0(m.gasto)), it("Chats",nf(m.chats)), it("Costo/chat",oDash(m.cpr,money)),
    it("Ventas",nf(m.ventas)), it("CPA",oDash(m.cpaReal,money)), it("ROAS",oDash(m.roas,x=>nf(x,2)+"×")),
    it("Ganancia neta",m.neta==null?"—":money(m.neta),m.neta==null?"":m.neta<0?"neg":"pos"),
  ].join('<i class="sep">·</i>');
  const MET=[["ganancia","Ganancia"],["gastoing","Gasto e ingresos"],["cpa","CPA"],["ctr","CTR"]];
  v.innerHTML=`
    <button class="back" id="back">${icon("chevronLeft")||'‹'} Volver a Rendimiento</button>
    <div class="dhd">
      <div><h2>${e?`<span class="stdot${e==="ACTIVE"?" on":""}" title="${e==="ACTIVE"?"Activo en Meta":"Pausado en Meta"}" style="float:none;margin:0 8px 0 0;vertical-align:4px"></span>`:""}${esc(a.name)}</h2>
        <div class="ctx">${esc(a.campaign)} · Conjunto ${esc(a.adset)}${a.prod?` · ${esc(a.prod)}`:""}</div></div>
      <div id="ddr" style="margin-left:auto"></div>
    </div>
    ${pre.length&&gastoPre>0?`<div class="dnota">Incluye ${pre.length} ${pre.length===1?"día":"días"} antes de la primera venta en Nodo (${money0(gastoPre)} de gasto; esas ventas se cerraban en otro sistema). En el gráfico van en gris y fuera de la escala.</div>`:""}
    ${st.rangoAntes?`<div class="dnota">Mostrando los últimos 14 días para ver la tendencia · al volver regresas a «${esc(rangeLabel(st.rangoAntes))}»</div>`:""}
    <div class="resumen">${resumen}</div>
    <div class="panel dchart">
      <div class="dch-top"><div class="seg dmet">${MET.map(([k,l])=>`<button data-m="${k}" class="${detMetrica===k?"on":""}">${l}</button>`).join("")}</div><div class="dch-sum" id="dchSum"></div></div>
      <div class="dch-wrap" id="dchWrap"></div>
    </div>
    <div class="panel"><div class="dtab-top"><span>Día por día</span><div class="colbtn"><button id="dColBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Columnas</button><div class="colpop" id="dColPop"></div></div></div><div class="scroll" id="dTabla">${detTabla(S)}</div></div>`;
  $("back").onclick=cerrarDetalle;
  { const pop=$("dColPop");
    pop.innerHTML=DCOLS.map(c=>`<label><input type="checkbox" data-dcol="${c.k}" ${detCols.has(c.k)?"checked":""}/> ${c.l}</label>`).join("");
    $("dColBtn").onclick=(ev)=>{ ev.stopPropagation(); pop.classList.toggle("show"); };
    pop.onclick=(ev)=>ev.stopPropagation();
    pop.querySelectorAll("input[data-dcol]").forEach(inp=>inp.onchange=()=>{ inp.checked?detCols.add(inp.dataset.dcol):detCols.delete(inp.dataset.dcol); if(!detCols.size){ detCols.add("gasto"); } try{ localStorage.setItem("nodo.rendDetCols",JSON.stringify([...detCols])); }catch{} $("dTabla").innerHTML=detTabla(S); });
    const cerrar=(ev)=>{ if(!$("dColPop")){ document.removeEventListener("click",cerrar); return; } if(!ev.target.closest(".colbtn")) $("dColPop").classList.remove("show"); };
    document.addEventListener("click",cerrar); }
  mountDateRange($("ddr"), { valor:st.range, onChange:(r)=>{ st.range=r; st.rangoAntes=null; reload(); } });
  v.querySelectorAll(".dmet button").forEach(b=> b.onclick=()=>{ detMetrica=b.dataset.m; try{ localStorage.setItem("nodo.rendMetrica",detMetrica); }catch{} v.querySelectorAll(".dmet button").forEach(x=>x.classList.toggle("on",x===b)); pintarDetChart(S); });
  pintarDetChart(S);

// Un gráfico de barras por día, en el estilo del Profit diario del Dashboard.
function pintarDetChart(S){
  const wrap=$("dchWrap"), sumEl=$("dchSum"); if(!wrap) return;
  const fd=new Intl.DateTimeFormat("es-PE",{weekday:"short",day:"numeric",month:"short"});
  const M=detMetrica;
  // Valor(es) por día según la métrica. null = ese día no aplica (no se dibuja).
  const val=(d)=> M==="ganancia" ? ((d.gasto||d.ingresos)?d.ingresos-d.gasto:null)
    : M==="cpa" ? (d.ventas?d.gasto/d.ventas:null)
    : M==="ctr" ? (d.impr?d.clics/d.impr*100:null) : null;
  const fmt=(x)=> M==="ctr" ? nf(x,2)+"%" : M==="ganancia" ? (x<0?"−":"+")+nf(Math.abs(Math.round(x))) : nf(x, x<10?2:0);
  const W=760,H=165,padL=46,padR=10,padT=18,padB=24;   // (10-oct) más bajo: «está muy grande»
  const n=S.length||1, bw=(W-padL-padR)/n;
  let vMax=0,vMin=0;
  if(M==="gastoing"){ S.forEach(d=>{ if(d.pre) return; vMax=Math.max(vMax,d.gasto,d.ingresos); }); }
  else S.forEach(d=>{ if(d.pre) return; const x=val(d); if(x==null) return; vMax=Math.max(vMax,x); vMin=Math.min(vMin,x); });
  if(vMax===vMin) vMax=vMin+(M==="ctr"?1:10);
  const paso=(()=>{ const r=(vMax-vMin)/3, p=Math.pow(10,Math.floor(Math.log10(r))); const q=r/p; return (q<=1?1:q<=2?2:q<=5?5:10)*p; })();
  vMax=Math.ceil(vMax/paso)*paso; vMin=Math.floor(vMin/paso)*paso;
  const yf=(x)=> padT+(vMax-x)/(vMax-vMin)*(H-padT-padB), y0=yf(0);
  let grid="";
  for(let t=vMin;t<=vMax+1e-9;t+=paso) grid+=`<line x1="${padL}" x2="${W-padR}" y1="${yf(t).toFixed(1)}" y2="${yf(t).toFixed(1)}" stroke="var(--border)"${Math.abs(t)<1e-9?' stroke-width="1.2"':' stroke-dasharray="2 4"'}/><text x="${padL-8}" y="${(yf(t)+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--faint)">${M==="ctr"?nf(t,t<1?1:0)+"%":nf(Math.round(t))}</text>`;
  const salto=Math.ceil(n/16), conMonto=bw>=28;
  const xl=S.map((d,i)=> i%salto===0?`<text x="${(padL+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--faint)">${d.fecha.getDate()}</text>`:"").join("");
  let marks="";
  S.forEach((d,i)=>{
    const x=padL+i*bw;
    if(d.pre){ marks+=`<rect x="${(x+bw*0.2).toFixed(1)}" y="${(y0-3).toFixed(1)}" width="${Math.max(2,bw*0.6).toFixed(1)}" height="6" rx="2" fill="var(--border-strong,#D0D5DD)"/><rect class="dhit" data-i="${i}" x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${H-padT-padB}" fill="transparent"/>`; return; }
    if(M==="gastoing"){
      const w=Math.max(2,bw*0.32);
      [[d.gasto,"var(--muted)",x+bw*0.16],[d.ingresos,"var(--green)",x+bw*0.52]].forEach(([vv,c,xx])=>{ if(!vv) return; const y=yf(vv); marks+=`<rect x="${xx.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(2,y0-y).toFixed(1)}" rx="2" fill="${c}" fill-opacity="${c==="var(--muted)"?0.55:0.9}"/>`; });
    } else {
      const vv=val(d); if(vv==null) return;
      const y=Math.min(yf(vv),y0), h=Math.max(2,Math.abs(yf(vv)-y0));
      const col = M==="ganancia" ? (vv<0?"var(--red)":"var(--green)") : "var(--brand)";
      marks+=`<rect x="${(x+bw*0.18).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(3,bw*0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}" fill-opacity=".9"/>`;
      if(conMonto) marks+=`<text x="${(x+bw/2).toFixed(1)}" y="${(vv>=0?y-5:y+h+12).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--muted)">${fmt(vv)}</text>`;
    }
    marks+=`<rect class="dhit" data-i="${i}" x="${x.toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${H-padT-padB}" fill="transparent"/>`;
  });
  // resumen de la métrica en el periodo
  const T=S.filter(d=>!d.pre).reduce((o,d)=>{ o.g+=d.gasto; o.i+=d.ingresos; o.v+=d.ventas; o.im+=d.impr; o.c+=d.clics; return o; },{g:0,i:0,v:0,im:0,c:0});
  sumEl.innerHTML = M==="ganancia" ? `Ingresos − publicidad: <b class="${T.i-T.g<0?"neg":"pos"}">${money(T.i-T.g)}</b>`
    : M==="gastoing" ? `<span class="lg"><i style="background:var(--muted);opacity:.55"></i>Gasto ${money0(T.g)}</span><span class="lg"><i style="background:var(--green)"></i>Ingresos ${money0(T.i)}</span>`
    : M==="cpa" ? `CPA del periodo: <b>${T.v?money(T.g/T.v):"—"}</b>`
    : `CTR del periodo: <b>${T.im?nf(T.c/T.im*100,2)+"%":"—"}</b>`;
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Detalle por día">${grid}${marks}${xl}</svg><div class="bc-tip" hidden></div>`;
  const tip=wrap.querySelector(".bc-tip"), svg=wrap.querySelector("svg");
  const fila=(l,x,c="")=>`<div class="r${c?" "+c:""}"><span>${l}</span><b>${x}</b></div>`;
  wrap.querySelectorAll(".dhit").forEach(r=>{
    r.addEventListener("mouseenter",()=>{
      const d=S[+r.dataset.i], g=d.ingresos-d.gasto;
      if(d.pre){ tip.innerHTML=`<div class="t">${esc(fd.format(d.fecha))}</div><div class="r"><span>Antes de la primera venta en Nodo</span></div>`+fila("Gasto",money(d.gasto)); tip.hidden=false; const sr=svg.getBoundingClientRect(), wr=wrap.getBoundingClientRect(), k=sr.width/W, cx=(padL+(+r.dataset.i)*bw+bw/2)*k+(sr.left-wr.left); tip.style.left=Math.max(0,Math.min(cx+12,wr.width-tip.offsetWidth))+"px"; tip.style.top="6px"; return; }
      tip.innerHTML=`<div class="t">${esc(fd.format(d.fecha))}</div>`+fila("Gasto",money(d.gasto))+fila("Ingresos",money(d.ingresos))+fila("Ventas",nf(d.ventas))+fila("CPA",d.ventas?money(d.gasto/d.ventas):"—")+fila("CTR",d.impr?nf(d.clics/d.impr*100,2)+"%":"—")+fila("Ingresos − gasto",money(g),g<0?"neg":"pos");
      tip.hidden=false;
      const sr=svg.getBoundingClientRect(), wr=wrap.getBoundingClientRect(), k=sr.width/W;
      const cx=(padL+(+r.dataset.i)*bw+bw/2)*k+(sr.left-wr.left), tw=tip.offsetWidth;
      let left=cx+12; if(left+tw>wr.width) left=cx-12-tw;
      tip.style.left=Math.max(0,left)+"px"; tip.style.top="6px";
    });
    r.addEventListener("mouseleave",()=>{ tip.hidden=true; });
  });
}
