<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nodo</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
<script>
// (31-oct, Rodrigo) Ajustes desapareció: «Nombre y logo» y «País y moneda» viven en Negocio, y Meta, Google Sheets
// y el uso de Supabase en Conexiones (canales.html). Esta página queda solo para reenviar los enlaces viejos —y el
// regreso del login de Google, que gsheets-callback sigue mandando acá con ?gs=…— sin perder lo que traen.
(function(){
  var q = new URLSearchParams(location.search);
  var aConexiones = q.has("gs") || q.get("tab") === "conexiones";
  if (!aConexiones) { q.delete("tab"); q.set("tab", "datos"); }
  else q.delete("tab");
  var s = q.toString();
  location.replace((aConexiones ? "canales.html" : "negocio.html") + (s ? "?" + s : ""));
})();
</script>
</head>
<body></body>
</html>
