<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem("nodo.theme")||"dark"}catch(e){}</script>
<title>Nodo · Tu equipo</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
<link rel="stylesheet" href="shell.css" />
<style>
  :root{
    --bg:#0e1116; --surface:#151a21; --surface-2:#1b222c; --border:#232b36;
    --text:#e7ecf2; --muted:#8a97a8; --faint:#5c6675;
    --brand:#2b7fff; --brand-2:#1e6ff0; --brand-bg:#12233f;
    --green:#22c079; --green-bg:#10281d; --amber:#f0a92b; --red:#e2564a;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px}
  button{font-family:inherit;cursor:pointer}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .card h2{font-size:15px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:9px}
  .card h2 svg{width:17px;height:17px;color:var(--muted)}
  .desc{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.55}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .in{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 12px;font-size:13.5px;outline:none;font-family:var(--font)}
  .in:focus{border-color:var(--brand)}
  .btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--faint)}
  .btn.primary{background:var(--brand);border:none;color:#fff} .btn.primary:hover{background:var(--brand-2)}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px}
  .btn.danger{color:var(--red);border-color:transparent;background:transparent}
  .btn.danger:hover{background:rgba(226,86,74,.1)}
  .mem{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--border)}
  .mem .av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);flex:none}
  .mem .nm{font-weight:600;font-size:13.5px}
  .mem .em{color:var(--faint);font-size:11.5px}
  .badge{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
  .badge.admin{background:var(--brand-bg);color:var(--brand);border-color:transparent}
  .badge.plan{background:var(--green-bg);color:var(--green);border-color:transparent;text-transform:capitalize}
  .codebox{background:var(--surface-2);border:1px dashed var(--brand);border-radius:12px;padding:14px 16px;margin-top:12px}
  .codebox .lbl{font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .codebox .val{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;word-break:break-all;color:var(--text)}
  .copyrow{display:flex;gap:8px;align-items:center;margin-top:8px}
  .inv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);font-size:12.5px}
  .inv .t{font-family:ui-monospace,Menlo,monospace;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--muted)}
  .plat{border:1px solid var(--brand);background:var(--brand-bg)}
  a.btn{text-decoration:none}
  .nodo-modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  /* (13-nov) Tipos de producto que vende la cuenta */
  .tchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tchip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;user-select:none}
  .tchip input{display:none}
  .tchip .ck{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:#fff}
  .tchip .ck svg{width:11px;height:11px;opacity:0}
  .tchip.on{border-color:var(--brand);background:var(--brand-bg);color:var(--brand)}
  .tchip.on .ck{background:var(--brand);border-color:var(--brand)} .tchip.on .ck svg{opacity:1}
  .badge.tipos{background:var(--brand-bg);color:var(--brand);border-color:transparent}
  /* (14-nov) Bots de cada equipo */
  .bots{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 14px}
  .bots-t{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-right:4px}
  .botchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px 0 5px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text)}
  .botchip img,.botchip svg{width:20px;height:20px;border-radius:50%;object-fit:cover;flex:none}
  .botchip svg{padding:3px;background:var(--brand-bg);color:var(--brand)}
  /* 👥 (14-nov, Rodrigo: «ahora ves lo confuso, me aparecen todos mis equipos y mis bots… agrega una foto a mi equipo»)
     Cada equipo es una fila compacta (foto, nombre, cuántos bots y personas) que se abre al tocarla. Abierto de entrada:
     el equipo del bot en el que estás. */
  .card.eq{padding:0;overflow:hidden;margin-bottom:10px}
  .eq-cab{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer}
  .eq-cab:hover{background:var(--surface-2)}
  .eq-cab:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
  .eq-foto{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;overflow:hidden;color:#fff;font-weight:800;font-size:18px}
  .eq-foto img{width:100%;height:100%;object-fit:cover}
  .eq-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .eq-tx b{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
  .eq-tx small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eq-aqui{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand-bg);color:var(--brand);flex:none}
  .eq-badges{display:flex;gap:6px;flex:none}
  .eq-chev{width:28px;height:28px;flex:none;display:grid;place-items:center;color:var(--muted);transition:transform .2s}
  .eq-chev svg{width:16px;height:16px}
  .card.eq.abierto .eq-chev{transform:rotate(90deg)}
  .eq-body{display:none;padding:4px 18px 18px;border-top:1px solid var(--border)}
  .card.eq.abierto .eq-body{display:block}
  .eq-acciones{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 12px}
  @media(max-width:640px){ .eq-badges{display:none} .eq-cab{padding:12px 14px;gap:12px} .eq-body{padding:4px 14px 14px} }
  .nodo-modal label.tchip{display:inline-flex;margin:0;font-size:13px;color:var(--text)}   /* la regla de label de .nodo-modal la volvía bloque */
  .nodo-modal label.tchip.on{color:var(--brand)}
</style>
</head>
<body>
<div class="nodo-page">
  <div class="nodo-wrap" style="--nodo-max:var(--nodo-form)">
    <div class="nodo-head"><div class="grow">
      <h1 class="nodo-title">Tu equipo</h1>
      <p class="nodo-lead">El equipo del bot que tienes abierto: sus bots y quién puede entrar. Para ver otro, cambia de bot arriba.</p>
    </div></div>
    <div id="accts" style="margin-top:20px"></div>
    <div id="invCard"></div>
    <div id="platCard"></div>
    <!-- (6-nov, Rodrigo) Antes vivía en Perfil, entre «Cambiar contraseña» y «Cerrar sesión». Es el respaldo del link
         de invitación: quien ya usa Nodo normalmente acepta desde el mismo link. -->
    <div class="card">
      <h2 id="joinTt">¿Te invitaron a otro equipo?</h2>
      <p class="desc">Si te pasaron un código, pégalo aquí para entrar a ese equipo. (Si te mandaron un link, ábrelo y acepta desde ahí.)</p>
      <div class="row"><input class="in" id="joinCode" placeholder="Código o link de la invitación" autocomplete="off" style="flex:1;min-width:200px"/><button class="btn primary" id="joinBtn">Unirme</button></div>
    </div>
  </div>
</div>

<script type="module">
import { supa, mountShell, toast, icon, askText, confirmDialog, askChoice, usuarioActual } from "./shell.js";
const $ = (id) => document.getElementById(id);
const st = { uid:null, me:null, accounts:[], abiertos:new Set(), botActual:null };
try { st.botActual = localStorage.getItem("nodo.channelId"); } catch {}
const esc = (s) => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini = (s) => (s||"?").trim().charAt(0).toUpperCase();

async function boot(){
  const { data:{session} } = await supa.auth.getSession(); if(!session){ location.href="index.html"; return; }
  const shell = await mountShell({ active:"cuenta" });
  // Al cambiar de bot arriba, se muestra el equipo de ese bot.
  shell?.onChannel?.((id) => { st.botActual = id; st.abiertos.clear(); load(); });
  wireUnirme();
  await load();
}

// Canjear un código siendo un usuario YA registrado (se mudó de Perfil el 6-nov). Acepta también el link
// entero pegado: se saca el código de adentro.
function wireUnirme(){
  $("joinTt").insertAdjacentHTML("afterbegin", icon("users"));
  $("joinBtn").onclick = async ()=>{
    const v = $("joinCode").value.trim(); const m = v.match(/[?&](?:join|invite)=([^&#\s]+)/);
    const tok = (m ? decodeURIComponent(m[1]) : v).toUpperCase();
    if(!tok){ toast("Pega el código",true); return; }
    $("joinBtn").disabled = true;
    const { data, error } = await supa.functions.invoke("invites",{ body:{ action:"redeem", token:tok } });
    let det=""; if(error){ try{ const j=await error.context?.json?.(); det=j?.detalle||j?.error||""; }catch(_){} }
    $("joinBtn").disabled = false;
    if(error||!data||data.error){ toast(det||data?.detalle||"No se pudo usar ese código (¿vencido o ya usado?)",true); return; }
    toast("Listo, ya eres parte de ese equipo"); setTimeout(()=>location.reload(),900);
  };
}

async function load(){
  st.uid = (await usuarioActual())?.id;
  const { data: me } = await supa.from("app_users").select("id,nombre,platform_admin").eq("id",st.uid).maybeSingle();
  st.me = me || {};
  const { data: mems } = await supa.from("account_members")
    .select("account_id,role,accounts(id,nombre,plan,features,logo_url)").eq("user_id",st.uid).eq("activo",true);
  st.accounts = (mems||[]).map(m=>({ id:m.account_id, role:m.role, nombre:m.accounts?.nombre, plan:m.accounts?.plan, logo:m.accounts?.logo_url||null, tipos:tiposDe(m.accounts?.features), members:[] }));
  for(const a of st.accounts){
    const { data: ms } = await supa.from("account_members")
      .select("user_id,role,app_users(nombre)").eq("account_id",a.id).eq("activo",true);
    a.members = ms||[];
  }
  // 🏢 (14-nov, Rodrigo: «es confuso, me dice Nodo Systems y Soluciones Prácticas») Cada tarjeta muestra SUS bots: sin eso no
  // se entendía qué agrupa un equipo. (La RLS solo devuelve los bots de los equipos donde estás.)
  let { data: chs, error: eCh } = await supa.from("channels").select("id,nombre,account_id,logo_url").eq("activo", true).order("nombre");
  if (eCh) ({ data: chs } = await supa.from("channels").select("id,nombre,account_id").eq("activo", true).order("nombre"));
  for (const a of st.accounts) a.bots = (chs || []).filter((c) => c.account_id === a.id);
  // Primero el equipo del bot en el que estás (abierto); los demás, por nombre y cerrados. Con un solo equipo, abierto.
  const deAqui = (a) => (a.bots||[]).some((b) => b.id === st.botActual);
  st.accounts.sort((x, y) => (deAqui(y) - deAqui(x)) || String(x.nombre||"").localeCompare(String(y.nombre||"")));
  // (14-nov, Rodrigo: «no me debe aparecer un equipo que no estoy gestionando, o sea, no estoy dentro de su bot») Solo
  // se muestra el equipo del bot abierto arriba; al cambiar de bot, cambia. Si el bot no es de ningún equipo tuyo, todos.
  const mio = st.accounts.filter(deAqui);
  st.visibles = mio.length ? mio : st.accounts;
  if (st.visibles.length === 1) st.abiertos.add(st.visibles[0].id);
  else if (!st.abiertos.size && st.visibles[0]) st.abiertos.add(st.visibles[0].id);
  render();
  loadInvites();
}
// Foto del equipo (o su inicial sobre un color propio, para que se distingan aunque no tengan foto).
const COLORES_EQ = ["#2563eb","#7c3aed","#db2777","#ea580c","#16a34a","#0891b2","#ca8a04","#4f46e5"];
function colorEquipo(t){ let h=0; for (const ch of String(t||"")) h=(h*31+ch.charCodeAt(0))>>>0; return COLORES_EQ[h%COLORES_EQ.length]; }
function fotoEquipo(a){
  return a.logo ? `<span class="eq-foto"><img src="${esc(a.logo)}" alt=""></span>`
    : `<span class="eq-foto" style="background:${colorEquipo(a.nombre||a.id)}">${esc(ini(a.nombre||"E"))}</span>`;
}
function achicarImagen(file, size = 128){
  return new Promise((res, rej) => { const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { const c = document.createElement("canvas"); c.width = size; c.height = size; const ctx = c.getContext("2d");
      const k = Math.max(size / img.width, size / img.height), w = img.width * k, h = img.height * k;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.85)); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("No se pudo abrir esa imagen")); }; img.src = u; });
}
function ponerFoto(accId){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/png,image/jpeg,image/webp";
  inp.onchange = async () => { const file = inp.files[0]; if (!file) return;
    if (file.size > 6 * 1024 * 1024){ toast("La imagen pesa mucho (máximo 6 MB)", true); return; }
    try { const url = await achicarImagen(file);
      const { error } = await supa.from("accounts").update({ logo_url: url }).eq("id", accId);
      if (error){ toast(error.message, true); return; }
      toast("Listo, el equipo ya tiene su foto"); load();
    } catch (e){ toast(e.message || "No se pudo poner la foto", true); } };
  inp.click();
}
async function quitarFoto(accId){
  const { error } = await supa.from("accounts").update({ logo_url: null }).eq("id", accId);
  if (error){ toast(error.message, true); return; }
  toast("Foto quitada"); load();
}
function botsHtml(a){
  const bs = a.bots || [];
  return `<div class="bots"><span class="bots-t">${bs.length===1?"Bot":"Bots"}</span>${bs.length ? bs.map((b) => `<span class="botchip">${b.logo_url?`<img src="${esc(b.logo_url)}" alt="">`:icon("robot")}${esc(b.nombre||"Bot")}</span>`).join("") : '<span class="muted" style="font-size:12.5px">Todavía no tiene bots</span>'}</div>`;
}

// 🧩 (13-nov, Rodrigo) Cuentas por TIPO de producto: «que solo puedan vender ese tipo y desaparezca todo rastro de
// los otros». Lo elige el admin de plataforma al crear el link de cuenta, y lo puede cambiar después en la tarjeta de
// cada cuenta. Se guarda en accounts.features.tipos (sin la clave = vende de todo); la base no deja crear un producto de
// otro tipo (trigger, migración 0145) y el panel esconde todo lo de los tipos que no vende (shell.js).
const TIPOS = [ { v:"fisico", l:"Físicos" }, { v:"digital", l:"Digitales" }, { v:"microapp", l:"Micro apps" } ];
function tiposDe(f){ const t = Array.isArray(f?.tipos) ? f.tipos.filter(x=>TIPOS.some(y=>y.v===x)) : []; return t.length ? t : null; }
function chipsTipos(sel, id){
  const on = sel || TIPOS.map(t=>t.v);
  return `<div class="tchips" id="${id}">${TIPOS.map(t=>`<label class="tchip${on.includes(t.v)?" on":""}"><input type="checkbox" value="${t.v}"${on.includes(t.v)?" checked":""}/><span class="ck">${icon("check")}</span>${t.l}</label>`).join("")}</div>`;
}
function wireChips(box){ box.querySelectorAll(".tchip input").forEach(i=> i.onchange=()=>{
  if(!box.querySelector("input:checked")){ i.checked = true; toast("El equipo tiene que vender al menos un tipo",true); }
  box.querySelectorAll(".tchip").forEach(l=> l.classList.toggle("on", l.querySelector("input").checked)); }); }
const leerChips = (box)=> [...box.querySelectorAll("input:checked")].map(i=>i.value);
const nombreTipos = (t)=> !t ? "" : t.map(v=>TIPOS.find(x=>x.v===v)?.l).filter(Boolean).join(" + ");
function pedirTipos(acc){
  return new Promise((resolve)=>{
    const back = document.createElement("div"); back.className = "nodo-modal-back";
    back.innerHTML = `<div class="nodo-modal" role="dialog" aria-modal="true">
      <h3>Qué vende ${esc(acc?.nombre||"este equipo")}</h3>
      <div class="muted" style="font-size:12.5px;margin:4px 0 14px;line-height:1.5">Lo que no marques desaparece del panel y de la app de ese equipo: no lo ven ni pueden crear productos de ese tipo.</div>
      ${chipsTipos(acc?.tipos, "ptChips")}
      <div class="nb-acts"><button class="nb-btn" id="ptCancel" type="button">Cancelar</button><button class="nb-btn primary" id="ptOk" type="button">Guardar</button></div>
    </div>`;
    document.body.appendChild(back);
    const box = back.querySelector("#ptChips"); wireChips(box);
    let hecho=false; const cerrar=(v)=>{ if(hecho) return; hecho=true; back.remove(); resolve(v); };
    back.querySelector("#ptOk").onclick = ()=> cerrar(leerChips(box));
    back.querySelector("#ptCancel").onclick = ()=> cerrar(null);
    back.addEventListener("mousedown", (e)=>{ if(e.target===back) cerrar(null); });
    back.addEventListener("keydown", (e)=>{ if(e.key==="Escape") cerrar(null); });
  });
}
async function cambiarTipos(accId){
  const acc = st.accounts.find(a=>a.id===accId);
  const t = await pedirTipos(acc); if(!t) return;
  const { error } = await supa.rpc("set_account_tipos", { p_account:accId, p_tipos:t });
  if(error){ toast(error.message,true); return; }
  try { localStorage.removeItem("nodo.tiposCuenta"); } catch {}
  toast(t.length===TIPOS.length ? "Listo: este equipo vende de todo" : "Listo: este equipo solo vende "+nombreTipos(t).toLowerCase()); load();
}

function render(){
  // Platform admin: crear cuenta de cliente.
  $("platCard").innerHTML = st.me.platform_admin ? `
    <div class="card plat">
      <h2>${icon("sparkles")} Crear un equipo para un cliente</h2>
      <p class="desc">Genera un link de invitación. Quien lo abra crea su propio equipo en Nodo y queda como su administrador, aislado de los demás.</p>
      <div class="row">
        <input class="in" id="bizEmail" type="email" placeholder="Correo del cliente" autocomplete="off" style="flex:1;min-width:200px"/>
        <input class="in" id="bizName" placeholder="Nombre del equipo (opcional)" style="flex:1;min-width:200px"/>
        <button class="btn primary" id="mkAccount">Generar link</button>
      </div>
      <div style="margin-top:12px"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Qué va a poder vender</div>${chipsTipos(null,"bizTipos")}</div>
      <p class="muted" style="font-size:12px;margin:6px 0 0">El link solo va a servir con ese correo: así nadie se registra a nombre de otra persona.</p>
      <div id="acctLinkBox"></div>
    </div>` : "";
  if(st.me.platform_admin){ $("mkAccount").onclick = mkAccountLink; wireChips($("bizTipos")); }

  // Cada cuenta del usuario.
  $("accts").innerHTML = (st.visibles || st.accounts).map(a=>{
    const soyAdmin = a.role === "admin";
    const members = a.members.map(m=>{
      const yo = m.user_id === st.uid;
      const nm = m.app_users?.nombre || "(sin nombre)";
      return `<div class="mem">
        <div class="av">${esc(ini(nm))}</div>
        <div style="flex:1;min-width:0"><div class="nm">${esc(nm)}${yo?' <span class="muted">· tú</span>':''}</div></div>
        <span class="badge ${m.role==='admin'?'admin':''}">${m.role==='admin'?'Admin':'Operador'}</span>
        ${(soyAdmin && !yo) ? `<button class="btn sm" data-rol="${esc(m.user_id)}" data-acc="${esc(a.id)}" data-actual="${esc(m.role)}">${m.role==='admin'?'Pasar a operador':'Hacer admin'}</button><button class="btn danger sm" data-rm="${esc(m.user_id)}" data-acc="${esc(a.id)}">Quitar</button>` : ''}
      </div>`;
    }).join("");
    const nB = (a.bots||[]).length, nP = a.members.length, aqui = (st.visibles||st.accounts).length > 1 && (a.bots||[]).some((b)=>b.id===st.botActual);
    return `<div class="card eq${st.abiertos.has(a.id)?" abierto":""}" data-acc="${esc(a.id)}">
      <button class="eq-cab" type="button" data-abrir="${esc(a.id)}" aria-expanded="${st.abiertos.has(a.id)}">
        ${fotoEquipo(a)}
        <span class="eq-tx"><b><span class="acctName">${esc(a.nombre||"Mi equipo")}</span>${aqui?'<span class="eq-aqui">Estás aquí</span>':""}</b>
          <small>${nB} bot${nB===1?"":"s"} · ${nP} persona${nP===1?"":"s"}${nB?" · "+esc((a.bots||[]).map((b)=>b.nombre).join(", ")):""}</small></span>
        <span class="eq-badges">${a.tipos?`<span class="badge tipos">Solo ${esc(nombreTipos(a.tipos).toLowerCase())}</span>`:""}</span>
        <span class="eq-chev">${icon("chevronRight")}</span>
      </button>
      <div class="eq-body">
        ${soyAdmin||st.me.platform_admin?`<div class="eq-acciones">
          ${soyAdmin?`<button class="btn sm" data-foto="${esc(a.id)}">${icon("image")} ${a.logo?"Cambiar foto":"Poner foto"}</button>`:""}
          ${soyAdmin&&a.logo?`<button class="btn sm danger" data-sinfoto="${esc(a.id)}">Quitar foto</button>`:""}
          ${soyAdmin?`<button class="btn sm" data-rename="${esc(a.id)}">Renombrar</button>`:""}
          ${st.me.platform_admin?`<button class="btn sm" data-tipos="${esc(a.id)}">Qué vende</button>`:""}
        </div>`:""}
        ${botsHtml(a)}
        <p class="desc">Personas que entran${soyAdmin?' · como admin puedes invitar y quitar gente.':''}</p>
        ${members}
        ${soyAdmin?`<div class="row" style="margin-top:16px">
          <button class="btn primary" data-team="${esc(a.id)}">${icon("users")} Invitar a alguien</button>
          <span class="muted" style="font-size:12px">Le llega un link para entrar a este equipo como operador o admin.</span>
        </div><div id="teamBox-${esc(a.id)}"></div>`:''}
      </div>
    </div>`;
  }).join("") || `<div class="card"><p class="muted">No perteneces a ningún equipo todavía.</p></div>`;

  // Wiring.
  document.querySelectorAll("[data-abrir]").forEach(b=> b.onclick=()=>{ const id=b.getAttribute("data-abrir"), c=b.closest(".card.eq");
    const abre=!c.classList.contains("abierto"); c.classList.toggle("abierto",abre); b.setAttribute("aria-expanded",abre);
    if(abre) st.abiertos.add(id); else st.abiertos.delete(id); });
  document.querySelectorAll("[data-foto]").forEach(b=> b.onclick=()=>ponerFoto(b.getAttribute("data-foto")));
  document.querySelectorAll("[data-sinfoto]").forEach(b=> b.onclick=()=>quitarFoto(b.getAttribute("data-sinfoto")));
  document.querySelectorAll("[data-tipos]").forEach(b=> b.onclick=()=>cambiarTipos(b.getAttribute("data-tipos")));
  document.querySelectorAll("[data-rename]").forEach(b=> b.onclick=()=>renameAccount(b.getAttribute("data-rename")));
  document.querySelectorAll("[data-team]").forEach(b=> b.onclick=()=>mkTeamCode(b.getAttribute("data-team")));
  document.querySelectorAll("[data-rm]").forEach(b=> b.onclick=()=>removeMember(b.getAttribute("data-acc"), b.getAttribute("data-rm")));
  document.querySelectorAll("[data-rol]").forEach(b=> b.onclick=()=>cambiarRol(b.getAttribute("data-acc"), b.getAttribute("data-rol"), b.getAttribute("data-actual")));
}

async function mkAccountLink(){
  const nombre = $("bizName").value.trim();
  const email = $("bizEmail").value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("Escribe el correo de tu cliente: el link solo va a servir con ese correo.",true); $("bizEmail").focus(); return; }
  const tipos = leerChips($("bizTipos"));
  const r = await callFn({ action:"create_account_invite", nombre_sugerido:nombre, email, tipos });
  if(!r) return;
  if(tipos.length < TIPOS.length){
    const { error } = await supa.rpc("set_invite_tipos", { p_token:r.token, p_tipos:tipos });
    if(error){ toast("El link se creó, pero no se pudo guardar qué vende: "+error.message,true); return; }
  }
  $("acctLinkBox").innerHTML = codeBox("Link para crear el equipo", r.link, `Envíaselo a tu cliente. Solo sirve con ${esc(email)} y vence en 14 días.${tipos.length<TIPOS.length?` Su equipo solo va a vender ${esc(nombreTipos(tipos).toLowerCase())}.`:""}`);
  wireCopy($("acctLinkBox"), r.link);
}
// (6-nov, Rodrigo) «Invitar a alguien»: UNA ventana con correo + rol (antes eran dos preguntas seguidas) y el
// resultado es UN link con «Copiar link». Antes salían código y link a la vez y no quedaba claro
// cuál mandar. El código queda abajo, chico, solo de respaldo (se pega en la página de registro o en Perfil).
const ROLES = [
  { value:"operador", label:"Operador", desc:"Atiende chats y pedidos, aprueba pagos. No cambia la configuración." },
  { value:"admin", label:"Admin", desc:"Todo lo del operador + configuración, equipo y conexiones." } ];
function pedirInvitacion(nombreCuenta){
  return new Promise((resolve)=>{
    const back = document.createElement("div"); back.className = "nodo-modal-back";
    back.innerHTML = `<div class="nodo-modal" role="dialog" aria-modal="true">
      <h3>Invitar a alguien${nombreCuenta?` a ${esc(nombreCuenta)}`:""}</h3>
      <label for="ivMail">Su correo</label>
      <input id="ivMail" type="email" placeholder="nombre@correo.com" autocomplete="off" />
      <div class="muted" style="font-size:11.5px;margin:5px 0 12px">El link solo va a servir con este correo: el que la persona usa (o usará) para entrar a Nodo.</div>
      <label>Qué podrá hacer</label>
      <div class="nodo-choices">${ROLES.map(r=>`<button class="nodo-choice${r.value==="operador"?" on":""}" type="button" data-v="${r.value}">
        <span class="nc-tx"><b>${r.label}</b><small>${r.desc}</small></span><span class="nc-ck">${icon("check")}</span></button>`).join("")}</div>
      <div class="nb-acts"><button class="nb-btn" id="ivCancel" type="button">Cancelar</button><button class="nb-btn primary" id="ivOk" type="button">Crear invitación</button></div>
    </div>`;
    document.body.appendChild(back);
    let rol = "operador", hecho = false;
    const cerrar = (v)=>{ if(hecho) return; hecho = true; back.remove(); resolve(v); };
    const mail = back.querySelector("#ivMail"), ok = back.querySelector("#ivOk");
    const valido = ()=> /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail.value.trim());
    const sync = ()=>{ ok.disabled = !valido(); ok.style.opacity = ok.disabled ? ".5" : ""; };
    mail.addEventListener("input", sync); sync();
    back.querySelectorAll(".nodo-choice").forEach(b=> b.onclick=()=>{ rol = b.dataset.v; back.querySelectorAll(".nodo-choice").forEach(x=>x.classList.toggle("on", x===b)); });
    ok.onclick = ()=>{ if(valido()) cerrar({ email:mail.value.trim().toLowerCase(), role:rol }); else mail.focus(); };
    back.querySelector("#ivCancel").onclick = ()=> cerrar(null);
    back.addEventListener("mousedown", (e)=>{ if(e.target===back) cerrar(null); });
    back.addEventListener("keydown", (e)=>{ if(e.key==="Escape") cerrar(null); if(e.key==="Enter" && e.target===mail){ e.preventDefault(); ok.click(); } });
    setTimeout(()=> mail.focus(), 30);
  });
}
// (6-nov, Rodrigo) Sin botón de WhatsApp: solo «Copiar link».
function cajaInvitacion({ email, role, link, code }){
  return `<div class="codebox">
    <div class="lbl">Invitación lista para <b style="color:var(--text)">${esc(email)}</b> · ${role==="admin"?"Admin":"Operador"}</div>
    <div class="val" style="font-size:12.5px;font-weight:600">${esc(link)}</div>
    <div class="copyrow" style="flex-wrap:wrap">
      <button class="btn sm primary" data-copy>${icon("copy")} Copiar link</button>
    </div>
    <div class="muted" style="font-size:11.5px;margin-top:10px;line-height:1.55">Sirve una sola vez y vence en 14 días. Si el link no abre, la persona puede pegar este código en la página de registro o en Cuenta y equipo → «¿Te invitaron a otro equipo?»: <b style="font-family:ui-monospace,Menlo,monospace;color:var(--text)">${esc(code)}</b></div>
  </div>`;
}
async function mkTeamCode(accId){
  const acc = st.accounts.find(a=>a.id===accId);
  const datos = await pedirInvitacion(acc?.nombre);
  if(!datos) return;
  const r = await callFn({ action:"create_team_invite", account_id:accId, role:datos.role, email:datos.email });
  if(!r) return;
  const box = $("teamBox-"+accId);
  box.innerHTML = cajaInvitacion({ email:datos.email, role:datos.role, link:r.link, code:r.code, negocio:acc?.nombre });
  wireCopy(box, r.link);
  loadInvites();
}
async function renameAccount(accId){
  const acc = st.accounts.find(a=>a.id===accId);
  const nuevo = await askText({ title:"Renombrar equipo", value:acc?.nombre||"", placeholder:"Nombre del equipo", confirmText:"Guardar" });
  if(nuevo==null) return;
  const { error } = await supa.from("accounts").update({ nombre:nuevo.trim() }).eq("id",accId);
  if(error){ toast(error.message,true); return; }
  toast("Equipo renombrado"); load();
}
async function removeMember(accId, userId){
  // Guard "último admin": no dejar la cuenta sin ningún admin (quedaría ingobernable —
  // nadie podría invitar, renombrar ni gestionar). La defensa dura vive en un trigger de
  // BD (migración 0072); esto cubre el caso normal desde el panel.
  const acc = st.accounts.find(a=>a.id===accId);
  const admins = (acc?.members||[]).filter(m=>m.role==="admin");
  if(admins.some(m=>m.user_id===userId) && admins.length<=1){
    toast("No puedes quitar al único admin — el equipo quedaría sin dueño. Primero suma otro admin.",true); return;
  }
  const ok = await confirmDialog({ title:"Quitar del equipo", message:"Esta persona dejará de ver y operar este equipo.", confirmText:"Quitar", danger:true });
  if(!ok) return;
  const { error } = await supa.from("account_members").delete().eq("account_id",accId).eq("user_id",userId);
  if(error){ toast(error.message,true); return; }
  // …y se le cortan sus códigos pendientes y su Telegram (seguía aprobando pagos).
  const r = await callFn({ action:"limpiar_miembro", account_id:accId, user_id:userId }, true);
  toast("Miembro quitado"+(r&&r.telegram_cortados?` · se le cortó Telegram en ${r.telegram_cortados} bot(s)`:"")+". Si vinculó su Telegram antes de hoy, quítalo también en Conexiones → Telegram."); load();
}
async function cambiarRol(accId, userId, actual){
  const nuevo = actual==="admin" ? "operador" : "admin";
  const acc = st.accounts.find(a=>a.id===accId);
  if(nuevo==="operador" && (acc?.members||[]).filter(m=>m.role==="admin").length<=1){ toast("Es el único admin: suma otro admin antes de quitarle el rol.",true); return; }
  if(!await confirmDialog({ title: nuevo==="admin"?"Hacer admin":"Pasar a operador", message: nuevo==="admin"?"Podrá cambiar la configuración, el equipo y las conexiones.":"Dejará de poder cambiar la configuración y el equipo.", confirmText:"Cambiar" })) return;
  const { data, error } = await supa.from("account_members").update({ role:nuevo }).eq("account_id",accId).eq("user_id",userId).select("user_id");
  if(error){ toast(error.message,true); return; }
  if(!(data||[]).length){ toast("No se pudo cambiar el rol",true); return; }
  toast("Rol cambiado"); load();
}

async function loadInvites(){
  const r = await callFn({ action:"list" }, true);
  // Si ya cambiaste de seccion mientras la funcion respondia, este id ya no existe
  // (o peor: es de OTRA pantalla). Las lecturas por `supa` las corta shell.js al salir,
  // pero las llamadas a Edge Functions no se pueden cancelar a ciegas: muchas escriben.
  const card = $("invCard"); if (!card) return;
  const invs = (r?.invites||[]).filter(i=>!i.used_at && (!i.expires_at || new Date(i.expires_at)>new Date()));   // vencidos fuera
  card.innerHTML = invs.length ? `
    <div class="card">
      <h2>${icon("mail")} Invitaciones activas</h2>
      <p class="desc">Invitaciones que todavía nadie usó. Si la persona perdió el link, cópialo de aquí.</p>
      ${invs.map(i=>`<div class="inv">
        <span class="badge">${i.kind==='new_account'?'Equipo nuevo':(i.role==='admin'?'Admin':'Operador')}</span>
        <span class="t" style="font-family:var(--font);color:var(--text)">${esc(i.email||i.token)}<span class="muted" style="font-size:11.5px"> · vence el ${esc(new Date(i.expires_at).toLocaleDateString("es-PE",{day:"numeric",month:"short"}))}</span></span>
        <button class="btn sm" data-cplink="${esc(linkDe(i))}">${icon("copy")} Copiar link</button>
        <button class="btn danger sm" data-rev="${esc(i.id)}">Revocar</button>
      </div>`).join("")}
    </div>` : "";
  document.querySelectorAll("[data-cplink]").forEach(b=> b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.getAttribute("data-cplink")); toast("Link copiado"); }catch{ toast("No se pudo copiar",true); } });
  document.querySelectorAll("[data-rev]").forEach(b=> b.onclick=async()=>{
    await callFn({ action:"revoke", id:b.getAttribute("data-rev") }); loadInvites();
  });
}

const PANEL_URL = "https://trackmeta.github.io/Nodo/panel";
function linkDe(i){ return `${PANEL_URL}/registro.html?${i.kind==="new_account"?"invite":"join"}=${encodeURIComponent(i.token)}`; }
function codeBox(label, value, hint){
  return `<div class="codebox">
    <div class="lbl">${esc(label)}</div>
    <div class="val" data-val>${esc(value)}</div>
    <div class="copyrow"><button class="btn sm" data-copy>${icon("copy")} Copiar</button>
      <span class="muted" style="font-size:11.5px">${esc(hint)}</span></div>
  </div>`;
}
function wireCopy(scope, text){
  const b = scope.querySelector("[data-copy]");
  if(b) b.onclick = async ()=>{ try{ await navigator.clipboard.writeText(text); toast("Copiado"); }catch{ toast("No se pudo copiar",true); } };
}
async function callFn(body, silent){
  const { data, error } = await supa.functions.invoke("invites", { body });
  if(error){ let d=""; try{ d=(await error.context.json())?.detalle||""; }catch{} if(!silent) toast(d||error.message||"Error",true); return null; }
  return data;
}
